    actions.appendChild(makeNetworkToolButton("Open the diff for this file",
      function () {
        openNetworkFile(node.path);
      }));
  }
  actions.appendChild(makeNetworkToolButton("Centre in the view", function () {
    centreNetworkNode(node.path);
  }));
  actions.appendChild(makeNetworkToolButton("Clear selection", function () {
    clearNetworkSelection();
    focusNetworkDetailHead();
  }));
  networkDetailElement.appendChild(actions);

  if (!node.analyzed) {
    var unread = makeNetworkSection("NOT READ");
    unread.appendChild(makeText("div", "net-detail-note", NETWORK_UNREAD_SENTENCE));
    networkDetailElement.appendChild(unread);
  } else {
    var outList = networkLayout.outgoingEdges[node.path];
    var uses = makeNetworkSection("USES (" + outList.length + ")");
    uses.appendChild(makeText("div", "net-detail-note",
      "this file depends on these"));
    if (node.linksDropped) {
      uses.appendChild(makeText("div", "net-detail-note",
        NETWORK_LINKS_DROPPED_SENTENCE));
    } else if (outList.length === 0 &&
        networkLayout.incomingEdges[node.path].length === 0) {
      uses.appendChild(makeText("div", "net-detail-note", NETWORK_NO_LINKS_SENTENCE));
    }
    for (var o = 0; o < outList.length; o++) {
      var outEdge = networkLayout.edges[outList[o]];
      uses.appendChild(makeNetworkNeighbourRow(outEdge, outEdge.toPath));
    }
    networkDetailElement.appendChild(uses);
  }

  // USED BY is known even for an unread file: the arrows into it come from
  // the files that were read.
  var inList = networkLayout.incomingEdges[node.path];
  var usedBy = makeNetworkSection("USED BY (" + inList.length + ")");
  usedBy.appendChild(makeText("div", "net-detail-note",
    "if this file changed, these would be affected"));
  for (var n = 0; n < inList.length; n++) {
    var inEdge = networkLayout.edges[inList[n]];
    usedBy.appendChild(makeNetworkNeighbourRow(inEdge, inEdge.fromPath));
  }
  networkDetailElement.appendChild(usedBy);

  if (node.cycle) {
    networkDetailElement.appendChild(makeNetworkCycleSection(node));
  }
  var outside = makeNetworkOutsideSection(node.path);
  if (outside !== null) {
    networkDetailElement.appendChild(outside);
  }
}

function makeNetworkCycleSection(node) {
  var group = networkLayout.componentMembers[node.comp];
  var others = [];
  for (var i = 0; i < group.length; i++) {
    if (group[i] !== node.path) {
      others.push(group[i]);
    }
  }
  var section = makeNetworkSection("IN A LOOP WITH " +
    pluralize(others.length, "OTHER FILE", "OTHER FILES"));
  section.appendChild(makeText("div", "net-detail-note",
    "Following the arrows from this file gets you back to this file."));
  for (var m = 0; m < others.length; m++) {
    section.appendChild(makeNetworkLoopRow(others[m]));
  }
  return section;
}

function makeNetworkLoopRow(path) {
  var row = makeElement("button", "net-neighbour-row");
  row.type = "button";
  row.appendChild(makePlainPath(path, false));
  row.addEventListener("click", function () {
    selectNetworkNode(path);
    centreNetworkNode(path);
    focusNetworkDetailHead();
  });
  return row;
}

// The server groups unresolved imports by specifier and names at most five
// files in each, so this section says the file is one of those named, never
// that the list is complete.
function makeNetworkOutsideSection(path) {
  if (!currentNetwork.unresolved || currentNetwork.unresolved.length === 0) {
    return null;
  }
  var matches = [];
  for (var i = 0; i < currentNetwork.unresolved.length; i++) {
    var group = currentNetwork.unresolved[i];
    var examples = group.examples || [];
    for (var e = 0; e < examples.length; e++) {
      if (examples[e] === path) {
        matches.push(group);
        break;
      }
    }
  }
  if (matches.length === 0) {
    return null;
  }
  var section = makeNetworkSection("IMPORTS WITH NO ARROW (" +
    matches.length + ")");
  section.appendChild(makeText("div", "net-detail-note",
    "this file is named among the importers of these; the server names at " +
    "most five files per group, so this file may have more"));
  for (var m = 0; m < matches.length; m++) {
    var line = makeElement("div", "net-summary-line");
    line.appendChild(makeText("span", "mono", matches[m].specifier));
    line.appendChild(document.createTextNode(": " + matches[m].reason));
    section.appendChild(line);
  }
  return section;
}

/* ---- Network: the no-selection summary ---- */

function makeNetworkSummaryLine(section, text, strong) {
  section.appendChild(makeText("div",
    "net-summary-line" + (strong ? " strong" : ""), text));
}

function renderNetworkSummary() {
  var counts = currentNetwork.counts || {};
  var head = makeElement("div", "net-detail-head");
  head.tabIndex = -1; // focusNetworkDetailHead puts the focus here
  head.appendChild(makeText("div", "net-detail-note",
    "Click a file in the picture to see what it uses and what uses it."));
  networkDetailElement.appendChild(head);

  var totals = makeNetworkSection("AT THIS COMMIT");
  makeNetworkSummaryLine(totals,
    pluralize(networkLayout.nodes.length, "file drawn", "files drawn") + " · " +
    pluralize(networkLayout.edges.length, "link", "links"), true);
  if (typeof counts.files_at_commit === "number") {
    // code_files counts files in a language this view reads. Files it
    // recognises as code but does not parse (Go, Rust, shell) have their own
    // count.
    var filesWords = pluralize(counts.files_at_commit, "file", "files");
    if (networkListingStopped()) {
      filesWords = "More than " + filesWords; // the listing stopped early
    }
    // the code counts cover only the files that were looked at
    var notLookedAt = networkFilesNotLookedAt();
    var codeLine = filesWords + " exist at this commit; " +
      (notLookedAt > 0 ? "of those looked at, " : "") +
      pluralize(counts.code_files || 0, "is source code", "are source code") +
      " in a language this view reads.";
    if (counts.unsupported_code_files > 0) {
      codeLine = codeLine + " " +
        pluralize(counts.unsupported_code_files, "file is", "files are") +
        " code in a language it does not read.";
    }
    if (notLookedAt > 0) {
      var notLookedAtWords = networkNotLookedAtWords("file was", "files were");
      codeLine = codeLine + " " + notLookedAtWords.charAt(0).toUpperCase() +
        notLookedAtWords.slice(1) + " not looked at.";
    }
    makeNetworkSummaryLine(totals, codeLine, false);
  }
  makeNetworkSummaryLine(totals,
    pluralize(networkLayout.unparsedCount, "file was", "files were") +
    " not read, so what they use is unknown; what uses them is still drawn.",
    false);
  makeNetworkSummaryLine(totals,
    pluralize(networkLayout.disconnectedCount, "file has", "files have") +
    " no drawn link in either direction.", false);
  if (networkLayout.linksDroppedCount > 0) {
    makeNetworkSummaryLine(totals,
      pluralize(networkLayout.linksDroppedCount, "file had", "files had") +
      " links cut by the size limit and are marked with a plus; what they use " +
      "is only partly drawn.", false);
  }
  if (networkLayout.cycleCount > 0) {
    var cycleChip = makeText("button", "net-chip cycle clickable",
      pluralize(networkLayout.cycleCount, "loop", "loops") + ": highlight");
    cycleChip.type = "button";
    cycleChip.addEventListener("click", function () {
      highlightNetworkCycles();
    });
    var chipRow = makeElement("div", "net-detail-chips");
    chipRow.appendChild(cycleChip);
    totals.appendChild(chipRow);
  }
  if (networkLayout.droppedEdgeCount > 0) {
    makeNetworkSummaryLine(totals, networkLayout.droppedEdgeCount +
      " links named a file this view was not given and were not drawn.", false);
  }
  networkDetailElement.appendChild(totals);

  if (currentNetwork.notes && currentNetwork.notes.length > 0) {
    var notes = makeNetworkSection("WHAT THIS VIEW COULD NOT SEE");
    for (var i = 0; i < currentNetwork.notes.length; i++) {
      makeNetworkSummaryLine(notes, currentNetwork.notes[i], false);
    }
    networkDetailElement.appendChild(notes);
  }

  networkDetailElement.appendChild(makeNetworkSkippedSection());
  var outside = makeNetworkUnresolvedSection();
  if (outside !== null) {
    networkDetailElement.appendChild(outside);
  }
  networkDetailElement.appendChild(makeNetworkDirectorySection());

  if (currentNetwork.explanation) {
    var foot = makeElement("div", "net-detail-section");
    foot.appendChild(makeText("div", "net-detail-note", currentNetwork.explanation));
    networkDetailElement.appendChild(foot);
  }
}

function makeNetworkSkippedSection() {
  var skipped = currentNetwork.skipped || [];
  var counts = currentNetwork.counts || {};
  var total = typeof counts.skipped === "number" ? counts.skipped : skipped.length;
  var section = makeNetworkSection("FILES NOT READ (" + total + ")");
  if (total === 0) {
    section.appendChild(makeText("div", "net-detail-note",
      "Every file drawn here was read."));
    return section;
  }
  section.appendChild(makeText("div", "net-detail-note",
    "These are drawn with a dashed outline and a question mark. " +
    NETWORK_UNREAD_SENTENCE));
  var byReason = {};
  var reasons = [];
  var i;
  for (i = 0; i < skipped.length; i++) {
    var reason = skipped[i].reason || "reason not given";
    if (!hasOwnKey(byReason, reason)) {
      byReason[reason] = 0;
      reasons.push(reason);
    }
    byReason[reason] = byReason[reason] + 1;
  }
  reasons.sort();
  for (i = 0; i < reasons.length; i++) {
    makeNetworkSummaryLine(section,
      pluralize(byReason[reasons[i]], "file", "files") + ": " + reasons[i], false);
  }
  if (total > skipped.length) {
    makeNetworkSummaryLine(section, "The server listed " + skipped.length +
      " of these " + total + " files by name.", false);
  }
  var shown = networkSkippedExpanded ? skipped.length : Math.min(skipped.length, 8);
  for (i = 0; i < shown; i++) {
    var row = makeElement("div", "net-summary-line");
    row.appendChild(makePlainPath(skipped[i].path, false));
    section.appendChild(row);
  }
  if (!networkSkippedExpanded && skipped.length > shown) {
    var more = makeText("button", "net-toggle",
      "+" + (skipped.length - shown) + " more");
    more.type = "button";
    more.addEventListener("click", function () {
      networkSkippedExpanded = true;
      preserveScroll(networkDetailElement, renderNetworkDetail);
      focusNetworkDetailHead();
    });
    section.appendChild(more);
  }
  return section;
}

function makeNetworkUnresolvedSection() {
  var groups = currentNetwork.unresolved || [];
  var counts = currentNetwork.counts || {};
  var total = typeof counts.unresolved_imports === "number" ?
    counts.unresolved_imports : groups.length;
  if (groups.length === 0 && total === 0) {
    return null;
  }
  var section = makeNetworkSection("IMPORTS WITH NO ARROW (" + total + ")");
  section.appendChild(makeText("div", "net-detail-note",
    "These point at packages, at the standard library, or at something this " +
    "view could not follow. They are counted, not drawn. Each line says why."));
  // The server caps how many distinct specifiers it names; this line says when
  // the list is capped.
  var groupsTotal = counts.unresolved_groups_total;
  var groupsShown = counts.unresolved_groups_shown;
  if (typeof groupsTotal === "number" && typeof groupsShown === "number" &&
      groupsShown < groupsTotal) {
    section.appendChild(makeText("div", "net-detail-note",
      "The server named " + groupsShown + " of these " + groupsTotal +
      " specifiers; the rest are counted above but not listed."));
  }
  var shown = networkUnresolvedExpanded ? groups.length : Math.min(groups.length, 8);
  for (var i = 0; i < shown; i++) {
    var line = makeElement("div", "net-summary-line");
    line.appendChild(makeText("span", "mono", groups[i].specifier));
    line.appendChild(document.createTextNode(": " + groups[i].reason + " · " +
      pluralize(groups[i].count || 0, "import", "imports")));
    section.appendChild(line);
  }
  if (!networkUnresolvedExpanded && groups.length > shown) {
    var more = makeText("button", "net-toggle",
      "+" + (groups.length - shown) + " more");
    more.type = "button";
    more.addEventListener("click", function () {
      networkUnresolvedExpanded = true;
      preserveScroll(networkDetailElement, renderNetworkDetail);
      focusNetworkDetailHead();
    });
    section.appendChild(more);
  }
  return section;
}

function makeNetworkDirectorySection() {
  var directories = networkLayout.directories;
  var section = makeNetworkSection("A FILE'S BORDER IS ITS TOP DIRECTORY");
  for (var i = 0; i < directories.length; i++) {
    var row = makeElement("div", "net-dir-row");
    var swatch = makeElement("span", "net-dir-swatch");
    swatch.style.borderColor = networkDirectoryColor(directories[i], directories);
    row.appendChild(swatch);
    row.appendChild(document.createTextNode(
      directories[i] === "" ? "files at the top of the repository" : directories[i]));
    section.appendChild(row);
  }
  if (directories.length > NETWORK_DIR_COLORS.length) {
    section.appendChild(makeText("div", "net-detail-note",
      "more directories than colours; some share a colour"));
  }
  return section;
}

/* ---- Network: listeners that live for the life of the page ---- */

networkCanvasElement.addEventListener("keydown", onNetworkKeydown);

// Places a drawing made while the pane was hidden, and keeps a start view
// the reader has not moved centred as the canvas changes size.
function onNetworkCanvasResize() {
  if (networkStartViewPending || networkIsAtStartView()) {
    showNetworkStartView();
  }
}
if (typeof ResizeObserver === "function") {
  new ResizeObserver(onNetworkCanvasResize).observe(networkCanvasElement);
} else {
  window.addEventListener("resize", onNetworkCanvasResize);
}

/* ============================== Security feed ============================= */

// The security state lives outside the repository and changes without the
// state_token moving, so it has its own poll loop (pollSecurity, stopped once
// the server says the feature is off) and its own rendering. The banner, the
// badges and the Check tab all read the run through buildRunView().

// The stage a running check is in: the first one running, else the first
// one waiting (the gap between two stages), or null.
function currentStage(stages) {
  var order = [stages.gate, stages.review, stages.verdict];
  for (var i = 0; i < order.length; i++) {
    if (order[i].state === "running") {
      return order[i];
    }
  }
  for (var j = 0; j < order.length; j++) {
    if (order[j].state === "waiting") {
      return order[j];
    }
  }
  return null;
}

// The branch a banner or a tab title names: the one a run started here is
// checking, else the one the shown run judged.
function checkBranchName(view) {
  if (view.inProgress && view.runner.active && view.runner.branch !== null) {
    return view.runner.branch;
  }
  return judgedBranchName(view);
}

// One line over every tab about the latest check: while it runs, its
// branch and stage; once it is over, its branch, when it ended and its
// verdict word. A click opens the Check tab.
function renderSecurityBanner() {
  clearNode(securityBannerElement);
  securityBannerElement.className = "";
  if (securityState === null) {
    return; // stays hidden
  }
  var view = buildRunView();
  var feed = view.feed;
  var branchName = checkBranchName(view);
  var banner = securityBannerElement;

  if (view.inProgress) {
    banner.className = "running";
    // a run started elsewhere that went silent may have died without a verdict
    var silent = view.runner.active ? null : feedSilentMinutes(feed);
    var stalled = silent !== null && silent >= STALLED_FEED_MINUTES;
    banner.appendChild(document.createTextNode(stalled ? "Security check" :
      (feed === null ? "Security check starting" : "Security check running")));
    if (branchName !== null) {
      banner.appendChild(document.createTextNode(" on "));
      banner.appendChild(makeText("span", "mono", branchName));
    }
    var stage = feed === null ? null : currentStage(buildStages(view));
    if (stalled) {
      banner.appendChild(document.createTextNode(": no progress for " + silent + " min" +
        (stage !== null ? ", last at step " + stage.number + " of 3, " + stage.title : "")));
    } else if (stage !== null) {
      banner.appendChild(document.createTextNode(
        ", step " + stage.number + " of 3, " + stage.title +
        (stage.statusText !== "" ? ": " + stage.statusText : "")));
    }
    if (feed !== null && feed.base) {
      banner.appendChild(document.createTextNode(", comparing with "));
      appendRunBase(banner, feed.base, branchName);
    }
  } else if (feed !== null && (view.stopped || feed.verdict || feed.verdict_word)) {
    banner.className = "done";
    banner.appendChild(document.createTextNode("Last security check"));
    if (branchName !== null) {
      banner.appendChild(document.createTextNode(" on "));
      banner.appendChild(makeText("span", "mono", branchName));
    }
    if (typeof feed.last_utc === "string") {
      banner.appendChild(document.createTextNode(", "));
      var when = makeText("span", "rel-time", relativeTime(feed.last_utc));
      when.setAttribute("data-when", feed.last_utc);
      banner.appendChild(when);
    }
    banner.appendChild(document.createTextNode(": "));
    if (view.stopped) {
      banner.appendChild(document.createTextNode("stopped before reaching a verdict"));
    } else {
      banner.appendChild(makeText("span", "banner-word",
        feed.verdict_word || "finished"));
      if (feed.verdict_word === "PASSED") {
        banner.appendChild(document.createTextNode(" (mechanical checks only)"));
      }
    }
    if (judgedRunIsOutOfDate(view)) {
      banner.appendChild(document.createTextNode(
        " · " + branchName + " has moved since"));
    }
  } else {
    return; // nothing to say: stays hidden
  }
  var go = makeElement("span", "banner-go");
  go.appendChild(document.createTextNode(" · "));
  go.appendChild(makeText("span", "banner-link", "open the Check tab"));
  banner.appendChild(go);
}

// The tab title names a running check, or one that ended while the page
// was out of sight; otherwise it is the diff's title.
var titleSawCheckRunning = false; // the last /api/security answer had a check running
var checkEndedUnseen = false;     // one ended while the page was hidden or unfocused

function noticeCheckEnd(view) {
  if (titleSawCheckRunning && !view.inProgress &&
      (document.hidden || !document.hasFocus())) {
    checkEndedUnseen = true;
  }
  titleSawCheckRunning = view.inProgress;
}

// Whether the last /api/security answer had a check running; null before
// the first answer, which announces nothing.
var announcedCheckRunning = null;

// Tells screen readers when a check starts and how it ends.
function announceCheckChange(view) {
  if (announcedCheckRunning !== null && view.inProgress !== announcedCheckRunning) {
    var branchName = checkBranchName(view);
    var onBranch = branchName !== null ? " on " + branchName : "";
    if (view.inProgress) {
      announce("Security check started" + onBranch + ".");
    } else if (view.failedEarly) {
      announce("The security check stopped before its first check.");
    } else if (view.stopped || view.feed === null) {
      announce("Security check" + onBranch + " stopped before reaching a verdict.");
    } else {
      announce("Security check" + onBranch + " finished" +
        (view.feed.verdict_word ? ": " + view.feed.verdict_word : "") + ".");
    }
  }
  announcedCheckRunning = view.inProgress;
}

function updateDocumentTitle() {
  var title = diffTitle;
  if (securityState !== null) {
    var view = buildRunView();
    var branchName = checkBranchName(view);
    if (view.inProgress) {
      var stage = view.feed !== null ? currentStage(buildStages(view)) : null;
      title = "Checking" + (branchName !== null ? " " + branchName : "") +
        (stage !== null ? ", step " + stage.number + " of 3" : "") + " - BranchLens";
    } else if (checkEndedUnseen && view.failedEarly) {
      // the feed still holds the run before: its verdict is not this one's
      title = "Check failed to start" +
        (view.runner.branch !== null ? " · " + view.runner.branch : "") + " - BranchLens";
    } else if (checkEndedUnseen && view.feed !== null) {
      var outcome = view.stopped ? "Check stopped" :
        (view.feed.verdict_word || "Check finished");
      title = outcome + (branchName !== null ? " · " + branchName : "") + " - BranchLens";
    }
  }
  if (document.title !== title) {
    document.title = title;
  }
}

// Seeing the page again puts the diff's title back.
function forgetUnseenCheckEnd() {
  if (checkEndedUnseen && !document.hidden) {
    checkEndedUnseen = false;
    updateDocumentTitle();
  }
}

window.addEventListener("focus", forgetUnseenCheckEnd);

// The banner is a link to the Check tab, except on the Check tab itself.
function updateSecurityBannerLink() {
  if (viewMode === "check") {
    securityBannerElement.removeAttribute("role");
    securityBannerElement.removeAttribute("tabindex");
    securityBannerElement.removeAttribute("title");
  } else {
    securityBannerElement.setAttribute("role", "button");
    securityBannerElement.setAttribute("tabindex", "0");
    securityBannerElement.title = "Open the Check tab";
  }
}

updateSecurityBannerLink();
securityBannerElement.addEventListener("click", function () {
  switchView("check");
});
securityBannerElement.addEventListener("keydown", function (event) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    switchView("check");
  }
});

// Whether the shown run judged from the base picked in the Tree: the empty
// tree, or the same commit on the shown line of history. A commit on another
// line is judged from where the two lines meet, which the page does not show.
function pickedBaseWasJudged(view) {
  if (view.feed === null || view.feed.base !== baseSha) {
    return false;
  }
  return baseSha === EMPTY_TREE_BASE ||
    (currentDiff !== null && currentDiff.base_is_ancestor === true);
}

// Whether the files on screen are the code the shown run judged: its branch
// at its commit, with a status that reads clean and the usual base (or the
// base the run judged from, picked in the Tree), or that commit picked in
// the Tree. When only the commit is known (a run started outside the page,
// before its verdict), a branch whose tip is that commit counts. When
// nothing is known, nothing counts.
function selectionIsJudged(view) {
  var judged = judgedRun(view);
  if (judged === null) {
    return false;
  }
  if (baseSha !== null && !pickedBaseWasJudged(view)) {
    return false;
  }
  if (selectedCommitSha !== null) {
    return judged.commit !== null && selectedCommitSha === judged.commit;
  }
  if (selectedBranchName === null) {
    return false;
  }
  if (judged.branch !== null && selectedBranchName !== judged.branch) {
    return false;
  }
  var branch = findBranchInState(selectedBranchName);
  if (branch === null || branch.has_uncommitted || typeof branch.status_error === "string") {
    return false;
  }
  if (judged.branch === null) {
    return judged.commit !== null && branch.commit === judged.commit;
  }
  return judged.commit === null || branch.commit === judged.commit;
}

/* CHECK-EXTRACT-BEGIN (pure function, no DOM; test.sh runs it under node) */

// The feed's key for the file a finding names. Reviewers sometimes write
// "./a.py" or an absolute path where the feed lists "a.py": a leading "./"
// is dropped, then the longest key the path ends with after a "/" is taken.
// A path that matches no key comes back without its leading "./".
function findingFileKey(file, feedFiles) {
  if (typeof file !== "string" || file === "") {
    return file;
  }
  var hasKey = Object.prototype.hasOwnProperty;
  var files = feedFiles !== null && typeof feedFiles === "object" ? feedFiles : {};
  if (hasKey.call(files, file)) {
    return file;
  }
  var trimmed = file;
  while (trimmed.indexOf("./") === 0) {
    trimmed = trimmed.slice(2);
  }
  if (hasKey.call(files, trimmed)) {
    return trimmed;
  }
  var best = null;
  for (var key in files) {
    if (!hasKey.call(files, key) || key === "") {
      continue;
    }
    var tail = "/" + key;
    if (trimmed.length >= tail.length &&
        trimmed.slice(trimmed.length - tail.length) === tail &&
        (best === null || key.length > best.length)) {
      best = key;
    }
  }
  return best !== null ? best : trimmed;
}

/* CHECK-EXTRACT-END */

// The verdict's findings per file, as {path: {count, blocking}}, once the
// run is over and its LLM review merged its result; null before that.
function verdictFindingsByFile(view) {
  if (view.feed === null || view.inProgress) {
    return null;
  }
  var reviewPhase = findPhase(view.feed, "review");
  if (reviewPhase === null || reviewPhase.status !== "done" || phaseSaysNotRun(reviewPhase)) {
    return null;
  }
  var byFile = makePathMap();
  var findings = view.feed.findings || [];
  for (var i = 0; i < findings.length; i++) {
    var file = findingFileKey(findings[i].file, view.feed.files);
    if (!hasOwnKey(byFile, file)) {
      byFile[file] = { count: 0, blocking: 0 };
    }
    byFile[file].count = byFile[file].count + 1;
    if (findings[i].blocking === true) {
      byFile[file].blocking = byFile[file].blocking + 1;
    }
  }
  return byFile;
}

// How many of the run's findings name a file the feed does not list.
function unmatchedFindingCount(view) {
  if (view.feed === null) {
    return 0;
  }
  var files = view.feed.files || {};
  var findings = view.feed.findings || [];
  var count = 0;
  for (var i = 0; i < findings.length; i++) {
    if (!hasOwnKey(files, findingFileKey(findings[i].file, files))) {
      count = count + 1;
    }
  }
  return count;
}

// The badge a file row should carry right now, as {kind, text, title}, or
// null for no badge. verdictFindings is verdictFindingsByFile(view), and
// allFindingsMatched says whether each finding's file matched a listed one.
// The deep dive's own count is of candidates, before verification; once
// the review has merged, the verdict's findings are counted instead.
function securityBadgeInfo(path, view, verdictFindings, allFindingsMatched) {
  if (view.feed === null || !view.feed.files) {
    return null;
  }
  if (verdictFindings !== null && hasOwnKey(verdictFindings, path)) {
    var inVerdict = verdictFindings[path];
    return {
      kind: "findings",
      text: pluralize(inVerdict.count, "finding", "findings"),
      title: "The verdict lists " + pluralize(inVerdict.count, "finding", "findings") +
        " in this file" + (inVerdict.blocking > 0 ? ", " + inVerdict.blocking + " blocking" : "")
    };
  }
  // Own properties only: a file named "constructor" must not find
  // Object's.
  if (!hasOwnKey(view.feed.files, path)) {
    return null;
  }
  var entry = view.feed.files[path];
  if (entry.status === "pending" || entry.status === "checking") {
    if (!view.inProgress) {
      // the run is over and this file was never checked on its own: no badge
      return null;
    }
    return entry.status === "pending" ?
      { kind: "pending", text: "waiting", title: "Waiting for a deep dive to read this file" } :
      { kind: "checking", text: "reading", title: "A deep dive is reading this file now" };
  }
  if (entry.status === "skipped") {
    return { kind: "skipped", text: "not reviewed",
             title: entry.reason || "No per-file reviewer covered this file" };
  }
  var candidates = entry.status === "findings" ? (entry.count || 1) : 0;
  if (verdictFindings !== null) {
    // a finding whose file matched no listed path may be about this file
    var noFinding = allFindingsMatched ? "the verdict lists no finding in this file" :
      "no verdict finding was matched to this file";
    return { kind: "clean", text: "clean",
             title: candidates > 0 ?
               "The deep dive reported " + pluralize(candidates, "candidate", "candidates") +
               " here; " + noFinding :
               "The deep dive found nothing here, and " + noFinding };
  }
  var stillRunning = view.inProgress;
  if (candidates === 0) {
    return { kind: "clean", text: "clean",
             title: stillRunning ?
               "The deep dive found nothing here; the verdict is not in yet" :
               "The deep dive found nothing here; the LLM review did not finish" };
  }
  if (stillRunning) {
    return { kind: "candidates", text: pluralize(candidates, "candidate", "candidates"),
             title: "The deep dive reported " + pluralize(candidates, "candidate", "candidates") +
               " here; up to 20 candidates of the run are verified before the verdict" };
  }
  return { kind: "unverified", text: "unverified",
           title: "The deep dive reported " + pluralize(candidates, "candidate", "candidates") +
             " here, but the LLM review did not finish, so none of them reached a verdict" };
}

function makeSecurityBadge(info) {
  var badge = makeText("span", "security-badge " + info.kind, info.text);
  badge.title = info.title;
  return badge;
}

// Adds, replaces or removes the badge in each existing file row. Feed changes
// never re-render the file list, so no row moves or flashes for them.
function updateSecurityBadges() {
  var view = buildRunView();
  var showBadges = selectionIsJudged(view);
  var verdictFindings = verdictFindingsByFile(view);
  var allFindingsMatched = verdictFindings === null || unmatchedFindingCount(view) === 0;
  var rows = fileListElement.children;
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var path = row.dataset.filePath;
    if (path === undefined) {
      continue;
    }
    var info = showBadges ?
      securityBadgeInfo(path, view, verdictFindings, allFindingsMatched) : null;
    var wantedState = info === null ? "" : JSON.stringify(info);
    var existing = row.querySelector(".security-badge");
    var shownState = existing === null ? "" : existing.dataset.badgeState;
    if (wantedState === shownState) {
      continue;
    }
    if (existing !== null) {
      row.removeChild(existing);
    }
    if (info !== null) {
      var badge = makeSecurityBadge(info);
      badge.dataset.badgeState = wantedState;
      // before the counts (the row's last element), so counts stay rightmost
      row.insertBefore(badge, row.lastChild);
    }
  }
  // This runs after every file-list render, which is also when the set of
  // files a Check-tab row can open changes.
  refreshCheckFileLinks();
}

/* ---- Check tab: the pipeline console ---- */
// The Run card (branch, Run or Cancel, elapsed time, a meter), then three
// numbered stages on a timeline. Both are built once and updated in place: a
// row is rebuilt only when what it shows changed, so focus, hover and text
// selection survive a run's events.

// The gate's checks, in the order it runs them, shown as waiting until the
// feed reports them. A check the feed names differently gets its own row;
// placeholders the run never reached go when the stage ends.
var EXPECTED_GATE_CHECKS = [
  "Exceptions file",
  "Secrets",
  "Security tests in the diff",
  "Scanner integrity",
  "Semgrep",
  "Code without scanner rules",
  "Bandit",
  "Dependencies (Trivy)",
  "Outbound HTTP",
  "Maven build and tests",
  "Python tests",
  "Python security tests"
];

// The checklist reviewers. They are matched by their REV-NN id, so a
// reworded title in the toolkit only changes the label.
var EXPECTED_REVIEWERS = [
  "REV-01 SQL injection (OWASP A03)",
  "REV-02 XSS, stored and reflected (OWASP A03)",
  "REV-03 Authorization, IDOR, ownership (OWASP A01)",
  "REV-04 Authentication, session, CSRF (OWASP A07)",
  "REV-05 Path traversal and file handling (OWASP A01/A05)",
  "REV-06 XXE and unsafe deserialization (OWASP A05/A08)",
  "REV-07 Command injection and expression injection (OWASP A03)",
  "REV-08 Secrets, sensitive data, weak cryptography (OWASP A02)",
  "REV-09 SSRF and outbound requests (OWASP A10)",
  "REV-10 Business logic and trust boundaries"
];

// What each stage will do, shown while it has not started.
var GATE_PREVIEW = EXPECTED_GATE_CHECKS.length +
  " checks: secrets, scanners, dependencies, build and tests";
var REVIEW_PREVIEW = EXPECTED_REVIEWERS.length +
  " checklist reviewers, deep dives of up to 12 code files in languages " +
  "with a deep-dive skill, then up to 20 findings verified";
var VERDICT_PREVIEW =
  "Push unlocks on READY TO PUBLISH for the branch's latest commit";

// Margins for deciding whether the feed's latest run is the one this server
// launched. Feed stamps have whole seconds and the gate takes a moment to
// write its first event; a run starting after the late margin was started
// somewhere else.
var LAUNCH_EARLY_MARGIN_MS = 5000;
var LAUNCH_LATE_MARGIN_MS = 180000;
// A run this server did not start counts as stopped after this long with no
// feed event. The pipeline stops its LLM review after one hour.
var QUIET_FEED_MS = 2 * 60 * 60 * 1000;

var SPIN_PERIOD_MS = 900;          // one turn of a spinner (matches the CSS)
var SEVERITY_CLASSES = { high: true, medium: true, low: true };
var RESULT_WORDS = {
  "TESTED": "tested",
  "PARTIAL": "partial",
  "NOT POSSIBLE": "not examined",
  "NOT APPLICABLE": "not applicable"
};
var RESULT_CLASSES = {
  "TESTED": "tested",
  "PARTIAL": "partial",
  "NOT POSSIBLE": "not-possible",
  "NOT APPLICABLE": "not-applicable"
};
// A verification's outcome, sent with its "done" event.
var VERIFICATION_WORDS = {
  "CONFIRMED": "confirmed",
  "PLAUSIBLE": "plausible",
  "REJECTED": "rejected"
};

var runCard = null;               // the Run card's elements, built once
// A Run, Cancel or Push click stays pending until an /api/security answer
// requested after its POST returned arrives; only that answer shows what the
// POST did.
var pendingAction = null;         // "run" | "cancel" | "push" | null
var pendingActionDoneAt = null;   // when its POST returned (ms), or null
var runMessage = "";              // the last Run/Cancel error, in the Run card
var pushMessage = "";             // the last Push error, under the Push button
var runLogOpen = null;            // null = automatic; true/false = the user's click
var stageOpenChoice = {};         // stage key -> open (true) or closed, by a click
var areasExpanded = false;        // in-memory only, like the view mode
var pushOutputOpen = false;       // git's output after a successful push, unfolded
var currentRunKey = null;         // the run the choices above belong to
var timelineParts = null;         // the timeline's lasting elements
var timelineRunKey = null;        // the run the timeline's rows were drawn for
var lastTimelineKey = null;       // what the timeline was last drawn from
// Set by the Run card's "change" link: the next branch picked in the
// Branches tab brings the Check tab back.
var returnToCheckAfterPick = false;

// Own keys only, so a path spelled like an Object.prototype property is not
// found.
function hasOwnKey(object, key) {
  return Object.prototype.hasOwnProperty.call(object, key);
}

function formatDuration(seconds) {
  if (typeof seconds !== "number") {
    return "";
  }
  if (seconds < 60) {
    return seconds + "s";
  }
  var minutes = Math.floor(seconds / 60);
  if (minutes >= 60) {
    var leftoverMinutes = minutes % 60;
    return Math.floor(minutes / 60) + "h" + (leftoverMinutes < 10 ? "0" : "") +
      leftoverMinutes + "m";
  }
  var rest = seconds % 60;
  return minutes + "m" + (rest < 10 ? "0" : "") + rest + "s";
}

// A gate check's own timing has fractions of a second.
function formatCheckSeconds(seconds) {
  if (typeof seconds !== "number") {
    return "";
  }
  if (seconds < 0.1) {
    return "<0.1s";
  }
  if (seconds < 10) {
    return seconds.toFixed(1) + "s";
  }
  return formatDuration(Math.round(seconds));
}

// Milliseconds since the epoch for an ISO stamp (or a number of seconds),
// or null when there is nothing usable.
function parseUtcMs(value) {
  if (typeof value === "number") {
    return value * 1000;
  }
  if (typeof value !== "string" || value === "") {
    return null;
  }
  var milliseconds = new Date(value).getTime();
  return isNaN(milliseconds) ? null : milliseconds;
}

function formatElapsedSince(sinceMs) {
  var seconds = Math.max(0, Math.floor((Date.now() - sinceMs) / 1000));
  return formatDuration(seconds);
}

// A span that tickLiveElapsed() keeps counting up, once a second, without
// anything around it being rebuilt.
function makeLiveElapsed(sinceMs) {
  var span = makeText("span", "live-elapsed", formatElapsedSince(sinceMs));
  span.dataset.since = String(sinceMs);
  return span;
}

function tickLiveElapsed() {
  if (document.hidden) {
    return;
  }
  var spans = document.querySelectorAll(".live-elapsed");
  for (var i = 0; i < spans.length; i++) {
    var since = Number(spans[i].dataset.since);
    if (isNaN(since)) {
      continue;
    }
    var text = formatElapsedSince(since);
    if (spans[i].textContent !== text) {
      spans[i].textContent = text;
    }
  }
}

// Every spinner takes its phase from the clock, so a row rebuilt mid-turn
// carries on where the old one was.
function setSpinPhase(element) {
  element.style.setProperty("--spin-delay",
    "-" + (Date.now() % SPIN_PERIOD_MS) + "ms");
}

/* ---- The run as the console sees it ---- */

function logTailText(value) {
  if (Array.isArray(value)) {
    return value.join("\n");
  }
  if (typeof value === "string") {
    return value;
  }
  return "";
}

// The runner block of /api/security with a safe value for every field,
// so a server without a toolkit (or an older one) reads as "no runner".
function runnerInfo() {
  var runner = null;
  if (securityState !== null && securityState.runner) {
    runner = securityState.runner;
  }
  if (runner === null) {
    return { available: false, unavailableReason: null, active: false,
             branch: null, base: null, startedMs: null, exitCode: null,
             runId: null, logText: "" };
  }
  return {
    available: runner.available === true,
    unavailableReason: nonEmptyString(runner.unavailable_reason),
    active: runner.active === true,
    branch: typeof runner.branch === "string" && runner.branch !== "" ?
      runner.branch : null,
    // the base the server started its last run with, as /api/run named it
    base: nonEmptyString(runner.base),
    startedMs: parseUtcMs(runner.started_utc),
    exitCode: typeof runner.exit_code === "number" ? runner.exit_code : null,
    runId: nonEmptyString(runner.run_id),
    logText: logTailText(runner.log_tail)
  };
}

// How the feed's latest run relates to the run this server launched last:
// "none" (it never launched one), "before" (the feed still shows an older
// run), "same" (the feed run is the launched one) or "after" (a later run
// started somewhere else, for example from a terminal). Once the launched
// run's log names its run_id, the ids decide; until then, the start times.
function launchRelation(runner) {
  if (runner.startedMs === null) {
    return "none";
  }
  if (securityState === null || typeof securityState.run_id !== "string") {
    return "before";
  }
  var feedStartMs = parseUtcMs(securityState.started_utc);
  if (runner.runId !== null) {
    if (securityState.run_id === runner.runId) {
      return "same";
    }
    return feedStartMs !== null && feedStartMs >= runner.startedMs ? "after" : "before";
  }
  if (feedStartMs === null) {
    return "same"; // no stamp to compare with: take the feed at its word
  }
  if (feedStartMs < runner.startedMs - LAUNCH_EARLY_MARGIN_MS) {
    return "before";
  }
  if (feedStartMs > runner.startedMs + LAUNCH_LATE_MARGIN_MS) {
    return "after";
  }
  return "same";
}

// True when the feed has written nothing for QUIET_FEED_MS.
function feedWentQuiet(feed) {
  var lastMs = parseUtcMs(feed.last_utc);
  return lastMs !== null && Date.now() - lastMs > QUIET_FEED_MS;
}

// Everything the console, the banner and the badges need to agree on,
// derived from the two polls in one place.
function buildRunView() {
  var runner = runnerInfo();
  var relation = launchRelation(runner);
  var feed = null;
  if (securityState !== null && typeof securityState.run_id === "string") {
    feed = securityState;
  }
  // A run was launched but has not written its first event yet. The feed
  // still holds the previous run, which must not pass for this one.
  var starting = runner.active && (feed === null || relation === "before");
  if (starting) {
    feed = null;
  }
  // No verdict and no more events coming: this server's run has exited,
  // or a run started elsewhere went quiet long ago.
  var stopped = !runner.active && feed !== null && feed.running === true &&
    (relation === "same" || feedWentQuiet(feed));
  // The gate writes its own verdict a moment before the review starts; the
  // runner bridges that gap, so the run never reads as finished in between.
  var inProgress = runner.active ||
    (feed !== null && feed.running === true && !stopped);
  // The launched run ended before writing anything: the feed is older.
  var failedEarly = !runner.active && runner.exitCode !== null &&
    relation === "before";
  return {
    runner: runner,
    relation: relation,
    feed: feed,
    starting: starting,
    stopped: stopped,
    inProgress: inProgress,
    failedEarly: failedEarly
  };
}

function findPhase(feed, name) {
  if (feed === null || !feed.phases) {
    return null;
  }
  for (var i = 0; i < feed.phases.length; i++) {
    if (feed.phases[i].name === name) {
      return feed.phases[i];
    }
  }
  return null;
}

function isRunningPhase(phase) {
  return phase !== null && phase.status === "running";
}

// A gate that does not pass closes the review with "not run: ...". The
// phase then exists, but nothing was reviewed.
function phaseSaysNotRun(phase) {
  return phase !== null && typeof phase.detail === "string" &&
    phase.detail.indexOf("not run") === 0;
}

// True when the LLM review merged its result (its phase is done, not "not run").
function reviewMerged(feed) {
  var phase = findPhase(feed, "review");
  return phase !== null && phase.status === "done" && !phaseSaysNotRun(phase);
}

function checksOfStage(feed, stageName) {
  var rows = [];
  if (feed === null || !feed.checks) {
    return rows;
  }
  for (var i = 0; i < feed.checks.length; i++) {
    var check = feed.checks[i];
    if (check.stage === stageName && typeof check.name === "string") {
      rows.push(check);
    }
  }
  return rows;
}

// Steps of a stage this page does not know: listed under the LLM review
// rather than dropped.
function otherStageChecks(feed) {
  var rows = [];
  if (feed === null || !feed.checks) {
    return rows;
  }
  for (var i = 0; i < feed.checks.length; i++) {
    var check = feed.checks[i];
    if (typeof check.name !== "string") {
      continue;
    }
    if (check.stage !== "gate" && check.stage !== "review" &&
        check.stage !== "dive" && check.stage !== "verify") {
      rows.push(check);
    }
  }
  return rows;
}

function plainName(name) {
  return name;
}

// "REV-03 Authorization, IDOR, ownership (OWASP A01)" -> "REV-03"
function reviewerKey(name) {
  var match = /^(REV-\d+)(\s|$)/.exec(name);
  return match ? match[1] : name;
}

// The rows of one group. With placeholders: every expected name in order
// (the feed's own row when it has one, a waiting row when not), then any
// row the expected list does not know. Without: the feed's rows alone.
function mergeWithPlaceholders(actualRows, expectedNames, keyOf, usePlaceholders) {
  if (!usePlaceholders) {
    return actualRows.slice();
  }
  var actualByKey = {};
  for (var i = 0; i < actualRows.length; i++) {
    actualByKey[keyOf(actualRows[i].name)] = actualRows[i];
  }
  var merged = [];
  var expectedKeys = {};
  for (var j = 0; j < expectedNames.length; j++) {
    var key = keyOf(expectedNames[j]);
    expectedKeys[key] = true;
    if (hasOwnKey(actualByKey, key)) {
      merged.push(actualByKey[key]);
    } else {
      merged.push({ name: expectedNames[j], status: "pending" });
    }
  }
  for (var k = 0; k < actualRows.length; k++) {
    if (!hasOwnKey(expectedKeys, keyOf(actualRows[k].name))) {
      merged.push(actualRows[k]);
    }
  }
  return merged;
}

function countBlocking(list) {
  var total = 0;
  for (var i = 0; i < list.length; i++) {
    if (list[i].blocking === true) {
      total = total + 1;
    }
  }
  return total;
}

function sortedFilePaths(feed) {
  var paths = [];
  if (feed === null || !feed.files) {
    return paths;
  }
  for (var path in feed.files) {
    if (hasOwnKey(feed.files, path)) {
      paths.push(path);
    }
  }
  paths.sort();
  return paths;
}

// The bare verdict word decides the styling; the sentence is never parsed.
function verdictKind(word) {
  if (word === "READY TO PUBLISH" || word === "PASSED") {
    return "ok";
  }
  if (word === "DO NOT PUBLISH" || word === "FAILED") {
    return "blocked";
  }
  if (word === "INCONCLUSIVE") {
    return "unsure";
  }
  return "idle";
}

/* ---- Stage models: plain data, built before any DOM ---- */

// Stage states: waiting, running, done, blocked, warn (did not complete or
// inconclusive), skipped (did not run) and stopped (the run died under it).

function buildGateStage(view) {
  var feed = view.feed;
  var phase = findPhase(feed, "gate");
  var actual = checksOfStage(feed, "gate");
  var phaseOver = phase !== null && !isRunningPhase(phase);
  var usePlaceholders = view.inProgress && !phaseOver &&
    (view.runner.active || actual.length > 0);
  var rows = mergeWithPlaceholders(actual, EXPECTED_GATE_CHECKS, plainName,
    usePlaceholders);
  var blockingRows = [];
  var doneCount = 0;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].status === "done") {
      doneCount = doneCount + 1;
    }
    if (rows[i].blocking === true) {
      blockingRows.push(rows[i]);
    }
  }

  var state;
  if (view.starting) {
    state = "running";
  } else if (feed === null) {
    state = "waiting";
  } else if (phase === null) {
    // a feed from a toolkit that reports no phases
    if (view.inProgress) {
      state = "running";
    } else {
      state = actual.length > 0 ? "done" : "skipped";
    }
  } else if (isRunningPhase(phase)) {
    state = view.inProgress ? "running" : "stopped";
  } else if (phase.status === "failed" || phase.detail === "FAILED" ||
             blockingRows.length > 0) {
    state = "blocked";
  } else if (phase.detail === "INCONCLUSIVE") {
    state = "warn";
  } else {
    state = "done";
  }

  var statusText = "";
  var liveSince = null;
  if (state === "running" && view.starting) {
    statusText = "starting";
    liveSince = view.runner.startedMs;
  } else if (state === "running") {
    statusText = rows.length > 0 ?
      doneCount + " of " + pluralize(rows.length, "check", "checks") : "running";
    liveSince = phase !== null ? parseUtcMs(phase.started_utc) : null;
  } else if (state === "waiting") {
    statusText = view.inProgress ? "waiting" : "";
  } else if (state === "stopped") {
    statusText = "stopped";
  } else if (state === "skipped") {
    statusText = "not reported";
  } else {
    statusText = pluralize(rows.length, "check", "checks");
    if (blockingRows.length > 0) {
      statusText = statusText + " · " + blockingRows.length + " blocking";
    }
    if (phase !== null && typeof phase.seconds === "number") {
      statusText = statusText + " · " + formatDuration(phase.seconds);
    }
  }

  var detail = "";
  if (phase !== null && phase.detail && state !== "running") {
    detail = phase.detail;
  } else if (state === "waiting") {
    detail = GATE_PREVIEW;
  }

  var fraction = 0;
  if (state === "done" || state === "blocked" || state === "warn") {
    fraction = 1;
  } else if (rows.length > 0) {
    fraction = doneCount / rows.length;
  }

  return {
    key: "gate",
    number: 1,
    title: "Mechanical checks",
    state: state,
    statusText: statusText,
    liveSince: liveSince,
    detail: detail,
    fraction: fraction,
    rows: rows,
    blockingRows: blockingRows,
    rowCount: rows.length,
    autoOpen: false // set by buildStages, which also knows the review's state
  };
}

function buildReviewStage(view, gateStage) {
  var feed = view.feed;
  var reviewPhase = findPhase(feed, "review");
  var divesPhase = findPhase(feed, "dives");
  var notRun = phaseSaysNotRun(reviewPhase);
  var reviewOver = reviewPhase !== null && !isRunningPhase(reviewPhase);
  var gateEnded = gateStage.state === "blocked" || gateStage.state === "warn" ||
    gateStage.state === "stopped";
  var actualReviewers = checksOfStage(feed, "review");
  var usePlaceholders = view.inProgress && !reviewOver && !gateEnded &&
    (view.runner.active || actualReviewers.length > 0 || reviewPhase !== null);
  var reviewers = mergeWithPlaceholders(actualReviewers, EXPECTED_REVIEWERS,
    reviewerKey, usePlaceholders);
  // Deep dives usually come as file events; "dive" step events are listed
  // with them.
  var diveSteps = checksOfStage(feed, "dive");
  var verifications = checksOfStage(feed, "verify");
  var otherSteps = otherStageChecks(feed);
  var filePaths = sortedFilePaths(feed);
  var findings = feed !== null && feed.findings ? feed.findings : [];
  var blockingFindings = countBlocking(findings);

  var reviewersDone = countStatus(reviewers, "done");
  var verificationsDone = countStatus(verifications, "done");
  // Files the deep dives will read, and those they have read; a skipped
  // file is never read.
  var filesToRead = 0;
  var filesRead = 0;
  var filesSkipped = 0;
  for (var j = 0; j < filePaths.length; j++) {
    var fileStatus = feed.files[filePaths[j]].status;
    if (fileStatus === "skipped") {
      filesSkipped = filesSkipped + 1;
    } else {
      filesToRead = filesToRead + 1;
    }
    if (fileStatus === "clean" || fileStatus === "findings") {
      filesRead = filesRead + 1;
    }
  }

  var hasActivity = reviewPhase !== null || divesPhase !== null ||
    actualReviewers.length > 0 || diveSteps.length > 0 ||
    verifications.length > 0;
  // The review merged its result but did not cover everything.
  var incomplete = false;
  var state;
  if (feed === null) {
    state = "waiting";
  } else if (notRun) {
    state = "skipped";
  } else if (!hasActivity) {
    state = view.inProgress ? "waiting" : "skipped";
  } else if (reviewPhase !== null && reviewPhase.status === "failed") {
    state = "warn";
  } else if (isRunningPhase(reviewPhase) || isRunningPhase(divesPhase)) {
    state = view.inProgress ? "running" : "stopped";
  } else if (reviewPhase === null && (view.inProgress || view.stopped)) {
    // a review that never reported its phase: running, or ended with the run
    state = view.inProgress ? "running" : "stopped";
  } else if (blockingFindings > 0) {
    state = "blocked";
  } else if (typeof feed.review_incomplete === "string") {
    state = "warn";
    incomplete = true;
  } else {
    state = "done";
  }

  var statusText = "";
  var liveSince = null;
  if (state === "running") {
    // The step still in progress: reviewers and deep dives, then the
    // verifications, then the merge of the results.
    var reading = [];
    if (reviewersDone < reviewers.length) {
      reading.push(reviewersDone + " of " + reviewers.length + " reviewers");
    }
    if (filesRead < filesToRead) {
      reading.push(filesRead + " of " + filesToRead + " files read");
    }
    if (reading.length > 0) {
      statusText = reading.join(" · ");
    } else if (verificationsDone < verifications.length) {
      statusText = "verifying findings, " + verificationsDone + " of " +
        verifications.length + " done";
    } else if (reviewers.length > 0 || filesToRead > 0) {
      statusText = "merging the results";
    } else {
      statusText = "running";
    }
    if (reviewPhase !== null) {
      liveSince = parseUtcMs(reviewPhase.started_utc);
    } else if (divesPhase !== null) {
      liveSince = parseUtcMs(divesPhase.started_utc);
    }
  } else if (state === "waiting") {
    statusText = view.inProgress ? "waiting" : "";
  } else if (state === "skipped") {
    statusText = "not run";
  } else if (state === "warn" && !incomplete) {
    statusText = "did not complete";
  } else if (state === "stopped") {
    statusText = "stopped";
  } else {
    statusText = findings.length === 0 ? "no findings" :
      pluralize(findings.length, "finding", "findings");
    if (blockingFindings > 0) {
      statusText = statusText + " · " + blockingFindings + " blocking";
    }
    if (incomplete) {
      statusText = "incomplete · " + statusText;
    }
    if (reviewPhase !== null && typeof reviewPhase.seconds === "number") {
      statusText = statusText + " · " + formatDuration(reviewPhase.seconds);
    }
  }

  // The phase detail says why a review did not run or failed. After a run
  // it holds the pipeline's verdict word, so the line counts the work instead.
  var detail = "";
  if (state === "waiting") {
    detail = REVIEW_PREVIEW;
  } else if (state === "skipped" || (state === "warn" && !incomplete)) {
    if (reviewPhase !== null && reviewPhase.detail && verdictKind(reviewPhase.detail) === "idle") {
      detail = reviewPhase.detail;
    }
  } else if (state !== "running") {
    var work = [];
    if (reviewersDone > 0) {
      work.push(pluralize(reviewersDone, "checklist reviewer", "checklist reviewers"));
    }
    var divesDone = filesRead + countStatus(diveSteps, "done");
    if (divesDone > 0) {
      work.push(pluralize(divesDone, "deep dive", "deep dives"));
    }
    if (verificationsDone > 0) {
      work.push(pluralize(verificationsDone, "verification", "verifications"));
    }
    detail = work.join(" · ");
    if (incomplete) {
      detail = (detail !== "" ? detail + ". " : "") + "Incomplete: " +
        (feed.review_incomplete || "no reason recorded");
    }
  }

  // Progress counts only once the review has started: files the gate marks
  // "not reviewed" must not fill the meter before then. While the review
  // runs the segment never fills: verifications and the merge come last.
  var fraction = 0;
  var units = reviewers.length + filePaths.length;
  if (state === "done" || state === "blocked" || incomplete) {
    fraction = 1;
  } else if (state !== "skipped" && state !== "waiting" && units > 0) {
    fraction = (reviewersDone + filesRead + filesSkipped) / units;
  }
  if (state === "running") {
    fraction = Math.min(fraction, 0.9);
  }

  return {
    key: "review",
    number: 2,
    title: "LLM review",
    state: state,
    statusText: statusText,
    liveSince: liveSince,
    detail: detail,
    fraction: fraction,
    incomplete: incomplete,
    reviewers: reviewers,
    reviewersDone: reviewersDone,
    diveSteps: diveSteps,
    verifications: verifications,
    verificationsDone: verificationsDone,
    otherSteps: otherSteps,
    filePaths: filePaths,
    filesRead: filesRead,
    filesSkipped: filesSkipped,
    rowCount: reviewers.length + diveSteps.length + verifications.length +
      otherSteps.length + filePaths.length,
    autoOpen: state === "running" || state === "stopped" || state === "warn"
  };
}

function countStatus(rows, status) {
  var total = 0;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].status === status) {
      total = total + 1;
    }
  }
  return total;
}

function buildVerdictStage(view) {
  var feed = view.feed;
  var hasVerdict = feed !== null && !view.inProgress &&
    (Boolean(feed.verdict_word) || Boolean(feed.verdict));
  var kind = hasVerdict ? verdictKind(feed.verdict_word) : "idle";
  // The review has merged its result; the pipeline still checks the merged
  // verdict before writing its own.
  var reviewPhase = findPhase(feed, "review");
  var confirming = view.inProgress && reviewMerged(feed);
  var state = "waiting";
  var liveSince = null;
  if (hasVerdict) {
    if (kind === "blocked") {
      state = "blocked";
    } else if (kind === "unsure") {
      state = "warn";
    } else {
      state = "done";
    }
  } else if (view.stopped) {
    state = "stopped";
  } else if (confirming) {
    state = "running";
    liveSince = parseUtcMs(reviewPhase.ended_utc);
  }
  var statusText = "";
  if (state === "running") {
    statusText = "confirming the verdict";
  } else if (state === "waiting" && view.inProgress) {
    statusText = "waiting";
  } else if (state === "stopped") {
    statusText = "no verdict";
  }
  return {
    key: "verdict",
    number: 3,
    title: "Verdict",
    state: state,
    statusText: statusText,
    liveSince: liveSince,
    detail: state === "waiting" ? VERDICT_PREVIEW : "",
    fraction: hasVerdict ? 1 : 0,
    hasVerdict: hasVerdict,
    kind: kind,
    rowCount: 0,
    autoOpen: true
  };
}

function buildStages(view) {
  var gate = buildGateStage(view);
  var review = buildReviewStage(view, gate);
  var verdict = buildVerdictStage(view);
  // The gate stays open while it is the stage to watch, when something in
  // it needs a look (advisory findings the summary counts included), or when
  // the run ended without a review. It folds away once the review takes over.
  var gateHasAdvisory = view.feed !== null && !view.inProgress &&
    typeof view.feed.mechanical_advisory === "number" &&
    view.feed.mechanical_advisory > 0;
  gate.autoOpen = gate.state === "running" || gate.state === "stopped" ||
    gate.state === "blocked" || gate.state === "warn" || gateHasAdvisory ||
    (gate.state === "done" && review.state === "skipped");
  return { gate: gate, review: review, verdict: verdict };
}

/* ---- Rows ---- */

function makeStatusMark(kind) {
  var mark = makeElement("span", "status-mark " + kind);
  if (kind === "running") {
    setSpinPhase(mark);
  }
  return mark;
}

// The mark for a check row. "pending" rows only exist during a run.
function checkMarkKind(check, view) {
  if (check.status === "pending") {
    return "pending";
  }
  if (check.status === "running") {
    return view.inProgress ? "running" : "stopped";
  }
  if (check.blocking === true) {
    return "block";
  }
  if (check.result === "CONFIRMED" || check.result === "PLAUSIBLE") {
    return "warn";
  }
  if (check.result === "NOT POSSIBLE" || check.result === "PARTIAL") {
    return "warn";
  }
  if (check.result === "NOT APPLICABLE") {
    return "neutral";
  }
  if (typeof check.count === "number" && check.count > 0) {
    return "warn";
  }
  return "ok";
}

// The word for a row that has not finished.
function unfinishedWord(status, view, runningWord) {
  if (status === "pending") {
    return "waiting";
  }
  if (status === "running") {
    return view.inProgress ? runningWord : "stopped";
  }
  return status || "";
}

function makeUnfinishedState(status, view, runningWord) {
  var className = "row-state";
  if (status === "running" && view.inProgress) {
    className = className + " running";
  }
  return makeText("span", className, unfinishedWord(status, view, runningWord));
}

// True for an LLM review step left unfinished in a run whose review merged.
function sentNoFinalReport(status, view) {
  return (status === "running" || status === "checking") && !view.inProgress &&
    reviewMerged(view.feed);
}

var NO_REPORT_TITLE = "This step sent no final report; the verdict still " +
  "counts its outcome, or its failure";
var DIVE_NO_REPORT_TITLE = "This deep dive sent no final report; if it " +
  "failed, the notes in verdict.txt name the file";

function makeNoReportState() {
  var state = makeText("span", "row-state", "no report");
  state.title = NO_REPORT_TITLE;
  return state;
}

function makeResultChip(check) {
  var result = typeof check.result === "string" ? check.result : "";
  if (check.blocking === true) {
    var blockingChip = makeText("span", "result-chip blocking", "blocking");
    blockingChip.title = (result !== "" ? "Result: " + result + ". " : "") +
      "This check blocks the verdict.";
    return blockingChip;
  }
  // own keys only: a result such as "constructor" must not find Object's
  var className = hasOwnKey(RESULT_CLASSES, result) ? RESULT_CLASSES[result] : "not-applicable";
  var word = hasOwnKey(RESULT_WORDS, result) ? RESULT_WORDS[result] :
    (result !== "" ? result.toLowerCase() : "done");
  var chip = makeText("span", "result-chip " + className, word);
  if (result !== "") {
    chip.title = "Result: " + result;
  }
  return chip;
}

function makeCheckRow(markKind) {
  var row = makeElement("div", "check-row");
  row.appendChild(makeStatusMark(markKind));
  return row;
}

function makeGateRow(check, view) {
  var row = makeCheckRow(checkMarkKind(check, view));
  if (check.blocking === true) {
    row.classList.add("blocking");
  }
  var name = makeText("span", "row-name", check.name);
  name.title = check.name;
  row.appendChild(name);
  var side = makeElement("span", "row-side");
  if (check.status === "done") {
    side.appendChild(makeResultChip(check));
  } else {
    side.appendChild(makeUnfinishedState(check.status, view, "running"));
  }
  side.appendChild(makeText("span", "row-time", formatCheckSeconds(check.seconds)));
  row.appendChild(side);
  // Present even while empty, so the row keeps its height when it lands.
  var detailText = typeof check.detail === "string" ? check.detail : "";
  var detail = makeText("div", "row-detail", detailText);
  if (detailText !== "") {
    detail.title = detailText;
  }
  row.appendChild(detail);
  return row;
}

function makeReviewerRow(check, view) {
  var noReport = sentNoFinalReport(check.status, view);
  var row = makeCheckRow(noReport ? "neutral" : checkMarkKind(check, view));
  var name = makeElement("span", "row-name");
  var match = /^(REV-\d+)\s+(.*)$/.exec(check.name);
  if (match) {
    name.appendChild(makeText("span", "row-id mono", match[1]));
    name.appendChild(document.createTextNode(match[2]));
  } else {
    name.appendChild(document.createTextNode(check.name));
  }
  name.title = check.name;
  row.appendChild(name);
  var side = makeElement("span", "row-side");
  if (check.status === "done") {
    side.appendChild(makeFinishedState(check));
  } else if (noReport) {
    side.appendChild(makeNoReportState());
  } else {
    side.appendChild(makeUnfinishedState(check.status, view, "reviewing"));
  }
  row.appendChild(side);
  return row;
}

// A finished step's count of candidate findings, or "done" when it has no
// count. The count is taken before verification.
function makeFinishedState(check) {
  var outcomeWord = hasOwnKey(VERIFICATION_WORDS, check.result) ?
    VERIFICATION_WORDS[check.result] : null;
  if (outcomeWord) {
    return makeText("span",
      check.result === "REJECTED" ? "row-state" : "row-state findings",
      outcomeWord);
  }
  if (typeof check.count === "number" && check.count > 0) {
    var candidates = makeText("span", "row-state findings",
      pluralize(check.count, "candidate", "candidates"));
    candidates.title = "Reported before verification";
    return candidates;
  }
  if (check.count === 0) {
    return makeText("span", "row-state", "clean");
  }
  return makeText("span", "row-state", "done");
}

// Deep-dive steps, verifications, and steps of stages this page does not
// know.
function makeStepRow(check, view, runningWord) {
  var noReport = sentNoFinalReport(check.status, view);
  var row = makeCheckRow(noReport ? "neutral" : checkMarkKind(check, view));
  // "claim (notes/web.py)": the path goes on its own line when it is one of
  // the run's files, so it is never the part cut off.
  var claim = check.name;
  var path = null;
  var match = /^(.*) \(([^()]+)\)$/.exec(check.name);
  if (match && view.feed !== null && view.feed.files && hasOwnKey(view.feed.files, match[2])) {
    claim = match[1];
    path = match[2];
  }
  var name = makeText("span", "row-name", claim);
  name.title = check.name;
  row.appendChild(name);
  var side = makeElement("span", "row-side");
  if (check.status === "done") {
    side.appendChild(makeFinishedState(check));
  } else if (noReport) {
    side.appendChild(makeNoReportState());
  } else {
    side.appendChild(makeUnfinishedState(check.status, view, runningWord));
  }
  row.appendChild(side);
  if (path !== null) {
    row.appendChild(makeText("div", "row-detail mono", path));
    linkRowToFile(row, path);
  }
  return row;
}

// A deep-dive row: one changed file and what its per-file reviewer found.
function makeDiveRow(path, entry, view) {
  var markKind;
  var stateText;
  var stateClass = "row-state";
  var stateTitle = "";
  if (sentNoFinalReport(entry.status, view)) {
    markKind = "neutral";
    stateText = "no report";
    stateTitle = DIVE_NO_REPORT_TITLE;
  } else if (entry.status === "checking") {
    markKind = view.inProgress ? "running" : "stopped";
    stateText = view.inProgress ? "reading" : "stopped";
    if (view.inProgress) {
      stateClass = stateClass + " running";
    }
  } else if (entry.status === "clean") {
    markKind = "ok";
    stateText = "clean";
  } else if (entry.status === "findings") {
    markKind = "warn";
    stateText = pluralize(entry.count || 1, "candidate", "candidates");
    stateClass = stateClass + " findings";
    stateTitle = "Reported by the deep dive before verification";
  } else if (entry.status === "skipped") {
    markKind = "neutral";
    stateText = "not reviewed";
    stateTitle = entry.reason || "No per-file reviewer covered this file";
  } else if (view.inProgress) {
    markKind = "pending";
    stateText = "waiting";
  } else {
    // The run is over and nothing looked at this file on its own.
    markKind = "neutral";
    stateText = "not reviewed";
    stateTitle = "The check finished without reviewing this file on its own";
  }
  var row = makeCheckRow(markKind);
  // Same path treatment as the file explorer: the directory gives way
  // first, so the filename survives.
  var name = makeElement("span", "row-name");
  name.appendChild(makePlainPath(path, false));
  name.title = path;
  row.appendChild(name);
  var side = makeElement("span", "row-side");
  var state = makeText("span", stateClass, stateText);
  if (stateTitle !== "") {
    state.title = stateTitle;
  }
  side.appendChild(state);
  row.appendChild(side);
  linkRowToFile(row, path);
  return row;
}

function makeFindingRow(finding, index) {
  var row = makeElement("div", "issue-row");
  // the verdict body is rebuilt; this key gives the focus back to the row
  row.setAttribute("data-focus-key", "finding:" + index);
  var severity = typeof finding.severity === "string" ? finding.severity : "low";
  var severityClass = hasOwnKey(SEVERITY_CLASSES, severity) ? severity : "low";
  row.appendChild(makeText("span", "severity-chip " + severityClass, severity));
  row.appendChild(makeText("span", "issue-title", finding.title || "(untitled)"));
  // Where, then which reviewer reported it and how its verification ended.
  var where = finding.file + (typeof finding.line === "number" ? ":" + finding.line : "");
  var whereSpan = makeElement("span", "issue-where");
  whereSpan.appendChild(makeText("span", "mono", where));
  var source = [];
  if (finding.entry) {
    source.push(finding.entry);
  }
  if (finding.outcome) {
    source.push(hasOwnKey(VERIFICATION_WORDS, finding.outcome) ?
      VERIFICATION_WORDS[finding.outcome] : String(finding.outcome).toLowerCase());
  }
  if (source.length > 0) {
    whereSpan.appendChild(document.createTextNode(" · " + source.join(" · ")));
  }
  row.appendChild(whereSpan);
  linkRowToFile(row, finding.file, finding.line);
  return row;
}

// A Check-tab row naming a file opens that file on the branch the check
// judged, at the reported line when there is one. Whether it can do so
// changes without the feed changing, so refreshCheckFileLinks() re-marks
// the rows after every file-list render.
function linkRowToFile(row, path, line) {
  // "?" is the server's stand-in for a finding that names no file
  if (typeof path !== "string" || path === "" || path === "?") {
    return;
  }
  // a finding may spell its file "./a.py" or as an absolute path
  path = findingFileKey(path, securityState !== null ? securityState.files : null);
  row.dataset.openPath = path;
  row.addEventListener("click", function () {
    openCheckedFile(path, typeof line === "number" ? line : null);
  });
  // refreshCheckFileLinks makes the row focusable when it can open its file
  row.addEventListener("keydown", function (event) {
    if (event.target !== row) {
      return; // a key meant for something inside the row
    }
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault(); // Space would scroll the list
      openCheckedFile(path, typeof line === "number" ? line : null);
    }
  });
}

// The judged branch's file list while another branch or a commit is on
// screen: {key, paths, error}, read from /api/diff with the compare base
// the page would open it with. paths is null when the read failed.
var judgedFileList = null;
var judgedFileListPending = false;

// What the judged branch's file list depends on.
function judgedFileListKey(branch) {
  return JSON.stringify([branch.name, branch.content_token, baseSha]);
}

// A failed read of the judged file list is tried again after this long.
var JUDGED_LIST_RETRY_MS = 10000;

// The file list read for this branch as it is now, or null.
function judgedFileListFor(branch) {
  if (judgedFileList === null || judgedFileList.key !== judgedFileListKey(branch)) {
    return null;
  }
  if (judgedFileList.paths === null &&
      Date.now() - judgedFileList.failedAt > JUDGED_LIST_RETRY_MS) {
    return null; // the failure may have passed: read it again
  }
  return judgedFileList;
}

// Reads the judged branch's file list, then marks the Check-tab rows again.
function loadJudgedFileList(branch) {
  var key = judgedFileListKey(branch);
  judgedFileListPending = true;
  fetchJson("/api/diff?" + targetQuery(branch.name, null, baseSha)).then(function (result) {
    judgedFileListPending = false;
    var paths = null;
    var error = null;
    if (result.ok && result.body !== null && Array.isArray(result.body.files)) {
      paths = [];
      for (var i = 0; i < result.body.files.length; i++) {
        if (result.body.files[i].unshowable !== true) {
          paths.push(result.body.files[i].path);
        }
      }
    } else if (result.body && result.body.error) {
      error = String(result.body.error);
    } else {
      error = "the server answered with status " + result.status + ".";
    }
    judgedFileList = { key: key, paths: paths, error: error, failedAt: Date.now() };
    refreshCheckFileLinks();
  }).catch(function () {
    judgedFileListPending = false;
    judgedFileList = { key: key, paths: null, error: "the local server did not answer.",
                       failedAt: Date.now() };
    refreshCheckFileLinks();
  });
}

// Where a Check-tab row would open its file: "here" (the diff on screen is
// the judged branch's and has the file), "branch" (the judged branch's
// file list has it, and that branch must be selected first), or null (it
// cannot be opened).
function checkedFileTarget(path, judgedName, view) {
  if (judgedName === null) {
    // no judged branch: only a selection showing the judged commit opens it
    return selectionIsJudged(view) && findShowableFileEntry(path) !== null ? "here" : null;
  }
  var judgedBranch = findBranchInState(judgedName);
  if (judgedBranch === null) {
    return null; // deleted, or a detached checkout
  }
  if (selectedBranchName === judgedName && selectedCommitSha === null) {
    return findShowableFileEntry(path) !== null ? "here" : null;
  }
  var list = judgedFileListFor(judgedBranch);
  if (list === null || list.paths === null || list.paths.indexOf(path) === -1) {
    return null;
  }
  return "branch";
}

// Why the judged branch's file list is not known, or null when it is.
function judgedFileListProblem(judgedName, judgedBranch) {
  var reading = "Reading the changes on " + judgedName + "…";
  if (selectedBranchName === judgedName && selectedCommitSha === null) {
    if (diffErrorText !== null) {
      return "Could not read the changes on " + judgedName + ": " + diffErrorText;
    }
    return currentDiff === null ? reading : null;
  }
  var list = judgedFileListFor(judgedBranch);
  if (list === null) {
    return reading;
  }
  if (list.paths === null) {
    return "Could not read the changes on " + judgedName + ": " + list.error;
  }
  return null;
}

function openCheckedFile(path, line) {
  var view = buildRunView();
  var judgedName = judgedBranchName(view);
  var target = checkedFileTarget(path, judgedName, view);
  if (target === "here") {
    selectFile(path);
  } else if (target === "branch") {
    selectBranch(judgedName);
    // selectBranch clears it; the branch's diff then opens this file
    fileToRestore = path;
    renderCheckPanel(); // the "Last check" line compares with the selection
  } else {
    return;
  }
  // set after the selection calls, which drop any earlier jump
  pendingLineJump = line !== null ? { path: path, line: line } : null;
}

// Scrolls the diff pane to the pending line once its file is drawn. When
// that line is not among the lines shown, it scrolls to the nearest one
// after it (else the last) and marks nothing.
function jumpToPendingLine(path) {
  var jump = pendingLineJump;
  pendingLineJump = null;
  if (jump === null || jump.path !== path || diffChunkHolder === null) {
    return;
  }
  var rows = diffChunkHolder.querySelectorAll("tr");
  var best = null;
  var bestIsExact = false;
  for (var i = 0; i < rows.length; i++) {
    var cells = rows[i].children;
    if (cells.length < 2) {
      continue; // a separator row
    }
    var newNumber = parseInt(cells[1].textContent, 10);
    if (isNaN(newNumber)) {
      continue; // a deleted line has no number in the new file
    }
    best = rows[i];
    if (newNumber >= jump.line) {
      bestIsExact = newNumber === jump.line;
      break;
    }
  }
  if (best === null) {
    return;
  }
  var previous = diffChunkHolder.querySelector("tr.jump-target");
  if (previous !== null) {
    previous.classList.remove("jump-target");
  }
  var noted = diffChunkHolder.querySelector("tr[data-jump-note]");
  if (noted !== null) {
    noted.removeAttribute("data-jump-note");
    noted.removeAttribute("title");
  }
  if (bestIsExact && selectionIsJudged(buildRunView())) {
    best.classList.add("jump-target");
  } else if (bestIsExact) {
    // newer commits or edits: the reported number may point elsewhere now
    best.setAttribute("data-jump-note", "");
    best.title = "The code shown is not the commit this check judged, so the " +
      "reported line may have moved";
  }
  best.scrollIntoView({ block: "center" });
}

function refreshCheckFileLinks() {
  var rows = checkListElement.querySelectorAll("[data-open-path]");
  var view = buildRunView();
  var judged = judgedRun(view);
  var judgedName = judgedBranchName(view);
  var judgedBranch = findBranchInState(judgedName);
  var judgedOnScreen = judgedName === selectedBranchName && selectedCommitSha === null;
  // Another branch or a commit is on screen: read the judged branch's list.
  if (rows.length > 0 && judgedBranch !== null && !judgedOnScreen &&
      judgedFileListFor(judgedBranch) === null && !judgedFileListPending) {
    loadJudgedFileList(judgedBranch);
  }
  var listProblem = judgedBranch !== null ?
    judgedFileListProblem(judgedName, judgedBranch) : null;
  for (var i = 0; i < rows.length; i++) {
    var target = checkedFileTarget(rows[i].dataset.openPath, judgedName, view);
    rows[i].classList.toggle("clickable", target !== null);
    // Tab reaches only the rows that can open their file
    if (target !== null) {
      rows[i].tabIndex = 0;
      rows[i].setAttribute("role", "button");
    } else {
      rows[i].removeAttribute("tabindex");
      rows[i].removeAttribute("role");
    }
    var hint = "";
    if (target === "branch") {
      hint = "Opens this file on " + judgedName + ", the branch this check judged";
    } else if (target === null && judgedName === "HEAD") {
      // git refuses HEAD as a branch name: this is a detached checkout
      hint = "This check judged a folder checked out on no branch, so its " +
        "files cannot be opened here";
    } else if (target === null && judgedName !== null && judgedBranch === null) {
      hint = "The branch " + judgedName + " no longer exists";
    } else if (target === null && listProblem !== null) {
      hint = listProblem;
    } else if (target === null && judgedName !== null) {
      hint = "This file is not among the changes shown for " + judgedName;
    } else if (target === null && judged === null) {
      hint = "What this check judged is not known yet";
    } else if (target === null && !selectionIsJudged(view)) {
      hint = "This check judged commit " + judged.commit.slice(0, 7) + ": pick it " +
        "in the Tree, or a branch whose last commit it is, to open this file";
    } else if (target === null) {
      hint = "This file is not among the changes shown";
    }
    rows[i].title = hint;
  }
}

/* ---- Rows kept in place ---- */

// One row of a stage body for syncRows(). data is the row's own data as JSON;
// json adds whatever else its look depends on (context), and build makes it.
function rowItem(key, dataObject, context, build) {
  var data = JSON.stringify(dataObject);
  var status = dataObject.status;
  return {
    key: key,
    data: data,
    json: data + "\u0000" + JSON.stringify(context),
    finished: status !== "pending" && status !== "running" && status !== "checking",
    build: build
  };
}

// A line of text in a stage body (a subhead, a note), for syncRows().
function textItem(key, className, text) {
  return {
    key: key,
    data: text,
    json: className + "\u0000" + text,
    finished: false,
    build: function () {
      return makeText("div", className, text);
    }
  };
}

// Makes the container's children the items' elements, in order. A child
// whose item json is unchanged is kept as it is; one whose json changed is
// built again, and flashes when it is finished and its data changed, the
// way branch and file rows flash elsewhere. Other children are removed.
function syncRows(container, items) {
  var oldChildren = [];
  var oldByKey = {};
  for (var c = 0; c < container.children.length; c++) {
    oldChildren.push(container.children[c]);
    oldByKey[container.children[c].rowKey] = container.children[c];
  }
  var keyCounts = {}; // item key -> how many items so far carried it
  var wanted = [];
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    // A key that repeats gets its ordinal, so each item has its own row.
    var key = item.key;
    if (hasOwnKey(keyCounts, item.key)) {
      keyCounts[item.key] = keyCounts[item.key] + 1;
      key = item.key + "\u0000#" + keyCounts[item.key];
    } else {
      keyCounts[item.key] = 1;
    }
    var old = hasOwnKey(oldByKey, key) ? oldByKey[key] : null;
    if (old !== null && old.rowJson === item.json) {
      wanted.push(old);
      continue;
    }
    var element = item.build();
    element.rowKey = key;
    element.rowJson = item.json;
    element.rowData = item.data;
    if (old !== null && item.finished && old.rowData !== item.data) {
      flashRow(element);
    }
    wanted.push(element);
  }
  for (var r = 0; r < oldChildren.length; r++) {
    if (wanted.indexOf(oldChildren[r]) === -1) {
      container.removeChild(oldChildren[r]);
    }
  }
  for (var j = 0; j < wanted.length; j++) {
    var current = container.children[j] || null;
    if (current !== wanted[j]) {
