      laneExpected.push(null); // reserved lane 0 stays a real, empty slot
    }
    laneExpected.push(null);
    return laneExpected.length - 1;
  }

  for (var c = 0; c < commits.length; c++) {
    var commit = commits[c];

    var activeBefore = [];
    var matches = [];
    for (var i = 0; i < laneExpected.length; i++) {
      if (laneExpected[i] !== null) {
        activeBefore.push(i);
        if (laneExpected[i] === commit.sha) {
          matches.push(i);
        }
      }
    }

    var lane;
    if (trunk[commit.sha] === true) {
      lane = 0; // reserved: the default branch keeps the spine, always
    } else if (matches.length > 0) {
      lane = matches[0]; // leftmost lane expecting this commit wins
    } else {
      lane = firstFreeLane(); // nothing expected it: a tip or a new root
    }
    // every matching lane other than this commit's own closes: its edge
    // bends into this dot (that is how a side branch rejoins the spine)
    var closes = [];
    for (var m = 0; m < matches.length; m++) {
      if (matches[m] !== lane) {
        closes.push(matches[m]);
        laneExpected[matches[m]] = null;
      }
    }

    // The commit's lane now waits for its first parent if that parent is
    // inside the graph window; otherwise the lane is freed.
    var firstParent = commit.parents.length > 0 ? commit.parents[0] : null;
    var hasOutgoing = firstParent !== null && knownShas[firstParent] === true;
    laneExpected[lane] = hasOutgoing ? firstParent : null;

    // Extra parents (merges) connect to the lane already expecting them,
    // or open a new lane; dangling ones are skipped entirely.
    var mergeEdges = [];
    for (var p = 1; p < commit.parents.length; p++) {
      var parent = commit.parents[p];
      if (knownShas[parent] !== true) {
        continue;
      }
      var target = -1;
      for (var j = 0; j < laneExpected.length; j++) {
        if (laneExpected[j] === parent) {
          target = j;
          break;
        }
      }
      if (target === -1) {
        target = firstFreeLane();
        laneExpected[target] = parent;
      }
      mergeEdges.push(target);
    }

    var rowMax = lane;
    for (var a = 0; a < activeBefore.length; a++) {
      if (activeBefore[a] > rowMax) {
        rowMax = activeBefore[a];
      }
    }
    for (var e = 0; e < mergeEdges.length; e++) {
      if (mergeEdges[e] > rowMax) {
        rowMax = mergeEdges[e];
      }
    }
    if (rowMax > maxLaneIndex) {
      maxLaneIndex = rowMax;
    }

    rows.push({
      sha: commit.sha,
      lane: lane,
      activeBefore: activeBefore,
      // a trunk commit can take lane 0 while only side lanes expected it:
      // then nothing comes straight down into the dot, the curves do it
      hasIncoming: matches.indexOf(lane) !== -1,
      closes: closes,
      hasOutgoing: hasOutgoing,
      mergeEdges: mergeEdges
    });
  }

  var layout = { rows: rows, maxLaneIndex: maxLaneIndex };
  if (lowestFreeLane === 0) {
    return layout; // fallback mode: no trunk, so no spine to stand in for
  }

  // Ghost spine: lane 0 is reserved but stays empty above the default branch
  // tip, so rows before it get a faded placeholder line. Topo order puts the
  // tip first among trunk commits, so the first trunk row found is it.
  layout.trunkTipRowIndex = -1;
  for (var g = 0; g < rows.length; g++) {
    if (trunk[rows[g].sha] === true) {
      layout.trunkTipRowIndex = g;
      break;
    }
  }
  for (var h = 0; h < rows.length; h++) {
    rows[h].ghostSpine = layout.trunkTipRowIndex > 0 && h < layout.trunkTipRowIndex;
  }
  return layout;
}

/* LANES-EXTRACT-END */

function laneColorVar(laneIndex) {
  if (laneIndex === 0) {
    return "var(--accent)"; // lane 0 is always accent-colored
  }
  return "var(--lane" + (((laneIndex - 1) % 5) + 1) + ")";
}

function makeSvgElement(tagName) {
  return document.createElementNS(SVG_NAMESPACE, tagName);
}

function makeTreeSvg(width) {
  var svg = makeSvgElement("svg");
  svg.setAttribute("class", "tree-svg");
  svg.setAttribute("width", String(width));
  svg.setAttribute("height", "26");
  return svg;
}

function addTreeLine(svg, x, yTop, yBottom, color, dashed) {
  var line = makeSvgElement("line");
  line.setAttribute("x1", String(x));
  line.setAttribute("y1", String(yTop));
  line.setAttribute("x2", String(x));
  line.setAttribute("y2", String(yBottom));
  line.setAttribute("stroke", color);
  line.setAttribute("stroke-width", dashed ? "1" : "2");
  if (dashed) {
    line.setAttribute("stroke-dasharray", "3,3");
  }
  svg.appendChild(line);
}

// The trunk's placeholder above the default branch tip: lane 0 carries no real
// edge up there, so a faded dashed line shows where the spine comes down to.
function addGhostSpine(svg, yTop, yBottom) {
  var line = makeSvgElement("line");
  line.setAttribute("x1", String(laneX(0)));
  line.setAttribute("y1", String(yTop));
  line.setAttribute("x2", String(laneX(0)));
  line.setAttribute("y2", String(yBottom));
  line.setAttribute("stroke", "var(--accent)");
  line.setAttribute("stroke-width", "2");
  line.setAttribute("stroke-dasharray", "2,4");
  line.setAttribute("opacity", "0.45");
  svg.appendChild(line);
}

// A smooth bend from one lane into another between two row edges.
function addTreeCurve(svg, xFrom, yFrom, xTo, yTo, color) {
  var path = makeSvgElement("path");
  var bend1 = yFrom + (yTo - yFrom) * 0.75;
  var bend2 = yFrom + (yTo - yFrom) * 0.25;
  path.setAttribute("d",
    "M " + xFrom + " " + yFrom +
    " C " + xFrom + " " + bend1 + ", " + xTo + " " + bend2 +
    ", " + xTo + " " + yTo);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", color);
  path.setAttribute("stroke-width", "2");
  svg.appendChild(path);
}

function addTreeDot(svg, x, color, isMerge, isTip) {
  var circle = makeSvgElement("circle");
  circle.setAttribute("cx", String(x));
  circle.setAttribute("cy", "13");
  if (isMerge) {
    // hollow ring, 7px across (9px when it is also a branch tip):
    // outer diameter = 2 * (radius + half the 2px stroke)
    circle.setAttribute("r", isTip ? "3.5" : "2.5");
    circle.setAttribute("class", "ring");
    circle.setAttribute("stroke", color);
    circle.setAttribute("stroke-width", "2");
  } else {
    circle.setAttribute("r", isTip ? "4.5" : "3.5");
    circle.setAttribute("fill", color);
  }
  svg.appendChild(circle);
}

// The compare-base marker: a small accent square on top of the dot.
function addBaseMarker(svg, x) {
  var square = makeSvgElement("rect");
  square.setAttribute("x", String(x - 2));
  square.setAttribute("y", "11");
  square.setAttribute("width", "4");
  square.setAttribute("height", "4");
  square.setAttribute("fill", "var(--accent)");
  svg.appendChild(square);
}

// Branch names that deserve an "edits not yet committed" pseudo-row:
// checked out somewhere AND carrying uncommitted work (from /api/state).
function pseudoBranchNames() {
  var names = {};
  if (currentState === null) {
    return names;
  }
  for (var i = 0; i < currentState.branches.length; i++) {
    var branch = currentState.branches[i];
    if (branch.worktree_path !== null && branch.has_uncommitted) {
      names[branch.name] = true;
    }
  }
  return names;
}

// The rows the tree actually shows: a pseudo-row goes above the tip commit
// of every branch with pending work (skipped when the tip is not listed).
function buildDisplayRows() {
  var trunkShas = buildTrunkShas(currentGraph.commits, currentGraph.default_branch,
    currentGraph.online_tip_sha);
  var layout = assignLanes(currentGraph.commits, trunkShas);
  var pseudoNames = pseudoBranchNames();
  var displayRows = [];
  for (var i = 0; i < currentGraph.commits.length; i++) {
    var commit = currentGraph.commits[i];
    var layoutRow = layout.rows[i];
    var pseudoForThisTip = [];
    for (var t = 0; t < commit.tips.length; t++) {
      if (pseudoNames[commit.tips[t]] === true) {
        pseudoForThisTip.push(commit.tips[t]);
      }
    }
    // The ghost line ends at the first row of the default branch tip, which
    // is a pseudo-row when pending edits sit above the tip. trunkTipRowIndex
    // is absent in fallback mode, where > 0 is false.
    var atTrunkTip = i === layout.trunkTipRowIndex && layout.trunkTipRowIndex > 0;
    for (var p = 0; p < pseudoForThisTip.length; p++) {
      displayRows.push({
        kind: "pseudo",
        branchName: pseudoForThisTip[p],
        lane: layoutRow.lane,
        activeBefore: layoutRow.activeBefore,
        chainAbove: p > 0,
        ghostSpine: layoutRow.ghostSpine === true,
        ghostToDot: atTrunkTip && p === 0
      });
    }
    displayRows.push({
      kind: "commit",
      commit: commit,
      layout: layoutRow,
      pseudoAbove: pseudoForThisTip.length > 0,
      ghostToDot: atTrunkTip && pseudoForThisTip.length === 0
    });
  }
  return { displayRows: displayRows, maxLaneIndex: layout.maxLaneIndex };
}

// A hollow square at the overflow slot, joined to nothing, so it cannot be
// read as a commit on a lane.
function addOverflowMark(svg) {
  var mark = makeSvgElement("rect");
  mark.setAttribute("x", String(laneX(treeLaneBudget) - 3));
  mark.setAttribute("y", "10");
  mark.setAttribute("width", "6");
  mark.setAttribute("height", "6");
  mark.setAttribute("fill", "none");
  mark.setAttribute("stroke", "var(--muted)");
  mark.setAttribute("stroke-width", "1.5");
  svg.appendChild(mark);
}

function makeTreeSvgForCommit(displayRow, svgWidth) {
  var layoutRow = displayRow.layout;
  var svg = makeTreeSvg(svgWidth);
  if (!laneIsDrawn(layoutRow.lane)) {
    // Off the right edge of the column. A dot on a drawn lane's x would read
    // as that lane's commit, so this row gets a mark of its own and no lines.
    addOverflowMark(svg);
    return svg;
  }
  var ownX = laneX(layoutRow.lane);
  var ownColor = laneColorVar(layoutRow.lane);

  // faded and dashed edges first, so solid ones paint over them on overlap
  if (layoutRow.ghostSpine === true) {
    addGhostSpine(svg, 0, 26);
  } else if (displayRow.ghostToDot) {
    addGhostSpine(svg, 0, 13); // the spine lands on this dot
  }
  if (displayRow.pseudoAbove) {
    addTreeLine(svg, ownX, 0, 13, "var(--amber-dot)", true);
  }
  for (var a = 0; a < layoutRow.activeBefore.length; a++) {
    var passingLane = layoutRow.activeBefore[a];
    if (passingLane === layoutRow.lane ||
        layoutRow.closes.indexOf(passingLane) !== -1) {
      continue; // drawn below as the incoming edge / closing curves
    }
    if (!laneIsDrawn(passingLane)) {
      continue;
    }
    addTreeLine(svg, laneX(passingLane), 0, 26, laneColorVar(passingLane), false);
  }
  for (var c = 0; c < layoutRow.closes.length; c++) {
    if (!laneIsDrawn(layoutRow.closes[c])) {
      continue;
    }
    addTreeCurve(svg, laneX(layoutRow.closes[c]), 0, ownX, 13,
      laneColorVar(layoutRow.closes[c]));
  }
  if (layoutRow.hasIncoming) {
    addTreeLine(svg, ownX, 0, 13, ownColor, false);
  }
  if (layoutRow.hasOutgoing) {
    addTreeLine(svg, ownX, 13, 26, ownColor, false);
  }
  for (var m = 0; m < layoutRow.mergeEdges.length; m++) {
    if (!laneIsDrawn(layoutRow.mergeEdges[m])) {
      continue;
    }
    addTreeCurve(svg, ownX, 13, laneX(layoutRow.mergeEdges[m]), 26,
      laneColorVar(layoutRow.mergeEdges[m]));
  }
  addTreeDot(svg, ownX, ownColor, displayRow.commit.parents.length >= 2,
    displayRow.commit.tips.length > 0);
  if (displayRow.commit.sha === baseSha) {
    addBaseMarker(svg, ownX);
  }
  return svg;
}

function makeTreeSvgForPseudo(displayRow, svgWidth) {
  var svg = makeTreeSvg(svgWidth);
  if (!laneIsDrawn(displayRow.lane)) {
    addOverflowMark(svg);
    return svg;
  }
  var x = laneX(displayRow.lane);
  // dashed pieces first, then the pass-through lanes paint over them
  if (displayRow.ghostSpine) {
    addGhostSpine(svg, 0, 26);
  } else if (displayRow.ghostToDot) {
    addGhostSpine(svg, 0, 13); // the spine ends on this row's amber dot
  }
  if (displayRow.chainAbove) {
    addTreeLine(svg, x, 0, 13, "var(--amber-dot)", true);
  }
  addTreeLine(svg, x, 13, 26, "var(--amber-dot)", true);
  for (var a = 0; a < displayRow.activeBefore.length; a++) {
    var passingLane = displayRow.activeBefore[a];
    if (!laneIsDrawn(passingLane)) {
      continue;
    }
    addTreeLine(svg, laneX(passingLane), 0, 26, laneColorVar(passingLane), false);
  }
  var dot = makeSvgElement("circle");
  dot.setAttribute("cx", String(x));
  dot.setAttribute("cy", "13");
  dot.setAttribute("r", "3.5");
  dot.setAttribute("fill", "var(--amber-dot)");
  svg.appendChild(dot);
  return svg;
}

// The branch checked out in the worktree the server was launched from.
function currentBranchName() {
  if (currentState === null) {
    return null;
  }
  for (var i = 0; i < currentState.branches.length; i++) {
    if (currentState.branches[i].is_current) {
      return currentState.branches[i].name;
    }
  }
  return null;
}

function makeTipChip(branchName, colorValue) {
  var chip = makeText("button", "tip-chip mono", branchName);
  chip.type = "button";
  chip.style.color = colorValue;
  chip.title = branchName; // a long name is cut with an ellipsis
  if (branchName === currentBranchName()) {
    // "you are here": filled instead of outlined. The border is normally
    // currentColor, which the canvas-colored text would wash out.
    chip.style.background = colorValue;
    chip.style.borderColor = colorValue;
    chip.style.color = "var(--canvas)";
    chip.title = branchName + " (checked out here)";
  }
  chip.addEventListener("click", function (event) {
    event.stopPropagation(); // the row underneath would select the commit
    selectBranch(branchName);
  });
  return chip;
}

// Marks where the default branch sits online. Not clickable: the row
// underneath selects that commit.
function makeOnlineChip(defaultBranchName) {
  var chip = makeText("span", "online-chip mono", defaultBranchName + " (online)");
  chip.title = "The " + defaultBranchName + " branch as last seen online";
  return chip;
}

function makeTreeCommitRow(displayRow, svgWidth) {
  var commit = displayRow.commit;
  var row = makeElement("div", "tree-row");
  row.dataset.sha = commit.sha;
  if (commit.sha === selectedCommitSha) {
    row.classList.add("selected");
  }
  row.title = commit.short + " · " + commit.subject + " · " +
    new Date(commit.date).toLocaleString();

  row.appendChild(makeTreeSvgForCommit(displayRow, svgWidth));

  for (var t = 0; t < commit.tips.length; t++) {
    row.appendChild(makeTipChip(commit.tips[t], laneColorVar(displayRow.layout.lane)));
  }
  if (currentGraph !== null && currentGraph.online_tip_sha === commit.sha) {
    row.appendChild(makeOnlineChip(currentGraph.default_branch));
  }
  row.appendChild(makeText("span", "tree-subject", commit.subject || ""));

  if (commit.sha === baseSha) {
    row.appendChild(makeText("span", "base-chip", "base"));
  } else {
    var compareChip = makeText("button", "compare-chip", "compare from here");
    compareChip.type = "button";
    compareChip.addEventListener("click", function (event) {
      event.stopPropagation();
      setBaseCommit(commit.sha);
    });
    row.appendChild(compareChip);
  }

  var timeSpan = makeText("span", "tree-time rel-time", relativeTime(commit.date));
  timeSpan.setAttribute("data-when", commit.date || "");
  row.appendChild(timeSpan);

  row.addEventListener("click", function (event) {
    if (event.shiftKey) {
      setBaseCommit(commit.sha); // shortcut for "compare from here"
      return;
    }
    selectCommit(commit.sha);
  });
  return row;
}

function makeTreePseudoRow(displayRow, svgWidth) {
  var branchName = displayRow.branchName;
  var row = makeElement("div", "tree-row pseudo");
  row.dataset.pseudoBranch = branchName;
  if (selectedCommitSha === null && branchName === selectedBranchName) {
    row.classList.add("selected");
  }
  row.appendChild(makeTreeSvgForPseudo(displayRow, svgWidth));
  var text = makeElement("span", "tree-subject");
  text.appendChild(document.createTextNode("edits not yet committed on "));
  text.appendChild(makeText("span", "mono", branchName));
  row.appendChild(text);
  row.addEventListener("click", function () {
    selectBranch(branchName);
  });
  return row;
}

function treeRegionJson() {
  var pseudoNames = pseudoBranchNames();
  var pseudoList = [];
  for (var name in pseudoNames) {
    pseudoList.push(name);
  }
  pseudoList.sort();
  // the checked-out branch is in here because switching branches can leave the
  // graph byte-identical while the filled "you are here" chip has to move
  return JSON.stringify([lastGraphJson, pseudoList, baseSha, currentBranchName()]);
}

function renderTreeIfChanged() {
  var json = treeRegionJson();
  if (json === lastTreeJson) {
    return;
  }
  lastTreeJson = json;
  preserveScroll(treeListElement, renderTree);
}

// Width of the graph column in the last renderTree.
var treeSvgWidth = 0;

// The Tree sidebar's final width, from its CSS variable (which does not animate).
function treeColumnWidth() {
  var value = getComputedStyle(document.documentElement).getPropertyValue("--wide-sidebar");
  return parseInt(value, 10) || 420;
}

// Hides the relative times when the graph column leaves less than 240px of text.
function updateTreeTimes() {
  var textSpace = treeColumnWidth() - treeSvgWidth - 12;
  treeListElement.classList.toggle("hide-times", textSpace < 240);
}

// the sidebar narrows below 1100px
window.addEventListener("resize", updateTreeTimes);

function renderTree() {
  clearNode(treeListElement);
  if (currentGraph === null) {
    previousTreeRowJson = null;
    treeListElement.appendChild(revealAfterDelay(
      makeText("div", "tree-empty", "Reading the history…")));
    return;
  }
  if (currentGraph.commits.length === 0) {
    previousTreeRowJson = null;
    treeListElement.appendChild(makeText("div", "tree-empty",
      "No commits yet; the tree will appear after the first commit."));
    return;
  }

  var built = buildDisplayRows();
  var geometry = computeTreeLaneGeometry(built.maxLaneIndex + 1);
  treeLaneSpacing = geometry.spacing;
  treeLaneBudget = geometry.drawn;
  var svgWidth = geometry.width;
  treeSvgWidth = svgWidth;
  updateTreeTimes();

  var allowFlash = previousTreeRowJson !== null;
  var newRowJson = {};
  for (var i = 0; i < built.displayRows.length; i++) {
    var displayRow = built.displayRows[i];
    var rowElement;
    var rowKey;
    var rowJson;
    if (displayRow.kind === "pseudo") {
      rowElement = makeTreePseudoRow(displayRow, svgWidth);
      rowKey = "p:" + displayRow.branchName;
      rowJson = "pseudo";
    } else {
      rowElement = makeTreeCommitRow(displayRow, svgWidth);
      rowKey = "c:" + displayRow.commit.sha;
      // lane geometry is left out: a reshaped graph does not flash rows whose
      // own data is unchanged
      rowJson = JSON.stringify([displayRow.commit.subject,
        displayRow.commit.date, displayRow.commit.tips]);
    }
    newRowJson[rowKey] = rowJson;
    if (allowFlash && previousTreeRowJson[rowKey] !== rowJson) {
      flashRow(rowElement);
    }
    treeListElement.appendChild(rowElement);
  }
  previousTreeRowJson = newRowJson;

  if (geometry.overflow) {
    treeListElement.appendChild(makeText("div", "tree-note",
      "· " + geometry.hidden + " more branch lanes than fit in this column: " +
      "their commits are marked with a hollow square at the right edge and " +
      "their lines are not drawn ·"));
  }
  if (currentGraph.truncated) {
    var shownLimit = currentGraph.limit || currentGraph.commits.length;
    treeListElement.appendChild(makeText("div", "tree-note",
      "· showing the latest " + shownLimit + " commits ·"));
  }
  treeListElement.appendChild(makeTreeBeginningEntry(svgWidth));
}

// The tree's last entry, below the oldest commit and the truncation note:
// compare with nothing. Not a commit row, so the arrow keys and the
// selection skip it.
function makeTreeBeginningEntry(svgWidth) {
  var entry = makeElement("div", "tree-beginning");
  // in line with the subjects, right of the graph column
  entry.style.paddingLeft = (svgWidth + 6) + "px";
  var explanation = "Compare with nothing: every file and every commit counts as " +
    "new, and Run judges the whole history.";
  if (baseSha === EMPTY_TREE_BASE) {
    entry.appendChild(makeText("span", "base-chip", "base"));
    var current = makeText("span", "tree-beginning-text",
      "the beginning: every commit counts as new");
    current.title = explanation;
    entry.appendChild(current);
  } else {
    var button = makeText("button", "beginning-chip", "compare from the beginning");
    button.type = "button";
    button.title = explanation;
    button.addEventListener("click", function () {
      setBaseCommit(EMPTY_TREE_BASE);
    });
    entry.appendChild(button);
    entry.appendChild(makeText("span", "tree-beginning-text", "before the first commit"));
  }
  return entry;
}

function updateTreeSelection() {
  var rows = treeListElement.children;
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var isSelected;
    if (row.dataset.sha !== undefined) {
      isSelected = row.dataset.sha === selectedCommitSha;
    } else if (row.dataset.pseudoBranch !== undefined) {
      isSelected = selectedCommitSha === null &&
        row.dataset.pseudoBranch === selectedBranchName;
    } else {
      continue; // the empty-state or truncation note
    }
    row.classList.toggle("selected", isSelected);
  }
}

/* ============================== Graph loading ============================= */

// The graph only needs fetching while something on screen depends on it.
function graphInUse() {
  return viewMode === "tree" || viewMode === "network" ||
    selectedCommitSha !== null || baseSha !== null;
}

function graphHasSha(sha) {
  if (currentGraph === null) {
    return false;
  }
  for (var i = 0; i < currentGraph.commits.length; i++) {
    if (currentGraph.commits[i].sha === sha) {
      return true;
    }
  }
  return false;
}

// True when the graph marks this commit as the edge of a shallow clone: the
// commit before it was not downloaded.
function commitIsShallowBoundary(sha) {
  if (currentGraph === null) {
    return false;
  }
  for (var i = 0; i < currentGraph.commits.length; i++) {
    if (currentGraph.commits[i].sha === sha) {
      return currentGraph.commits[i].shallow_boundary === true;
    }
  }
  return false;
}

function loadGraph() {
  graphRequestSerial += 1;
  var serial = graphRequestSerial;
  graphRequestPending = true;
  graphReloadWanted = false; // this request covers it
  fetchJson("/api/graph").then(function (result) {
    if (serial !== graphRequestSerial) {
      return; // a newer request was issued meanwhile
    }
    graphRequestPending = false;
    if (graphReloadWanted) {
      graphReloadWanted = false;
      window.setTimeout(loadGraph, 0); // runs once this answer is handled
    }
    if (!result.ok || result.body === null) {
      return; // polling will retry; the old drawing stays until then
    }
    lastGraphJson = JSON.stringify(result.body);
    currentGraph = result.body;
    afterGraphRefresh();
  }).catch(function (error) {
    if (serial === graphRequestSerial) {
      graphRequestPending = false;
    }
    setFooter(footerStateFor(error));
  });
}

// Polls reload through here: a request already on its way is kept, and the
// graph is asked for again once its answer is in.
function refreshGraph() {
  if (graphRequestPending) {
    graphReloadWanted = true;
  } else {
    loadGraph();
  }
}

function afterGraphRefresh() {
  // The empty tree is in no graph: it stays until "stop comparing".
  if (baseSha !== null && baseSha !== EMPTY_TREE_BASE && !graphHasSha(baseSha)) {
    // the base left the graph: clear it silently, back to plain comparisons
    baseSha = null;
    rememberViewInAddress();
    renderHeader();
    updateRunCard(); // Run no longer sends that base
    if (hasSelection()) {
      loadDiff();
    }
  }
  if (selectedCommitSha !== null && !graphHasSha(selectedCommitSha)) {
    handleCommitVanished();
  } else if (selectedCommitSha !== null && currentDiff !== null &&
             currentDiff.files.length === 0) {
    renderDiffBody(); // the graph says whether the commit is a shallow edge
  }
  renderTreeIfChanged();
  // the network pane depends on the graph only through the commit it shows
  if (networkCommitSha() !== currentNetworkSha) {
    renderNetworkPane();
  }
}

/* ============================== View switcher ============================= */

// Marks the open tab: the underline and aria-selected. Only the open tab is
// a Tab stop; the arrow keys move between the tabs.
function markTab(tabElement, isSelected) {
  tabElement.classList.toggle("selected", isSelected);
  tabElement.setAttribute("aria-selected", isSelected ? "true" : "false");
  tabElement.tabIndex = isSelected ? 0 : -1;
}

function switchView(mode) {
  if (viewMode === mode) {
    return;
  }
  if (mode !== "branches") {
    returnToCheckAfterPick = false;
  }
  viewMode = mode;
  appElement.classList.toggle("tree-mode", mode === "tree");
  appElement.classList.toggle("check-mode", mode === "check");
  appElement.classList.toggle("network-mode", mode === "network");
  updateSecurityBannerLink();
  markTab(tabBranchesElement, mode === "branches");
  markTab(tabTreeElement, mode === "tree");
  markTab(tabCheckElement, mode === "check");
  markTab(tabNetworkElement, mode === "network");
  rememberViewInAddress();
  if (mode !== "network" && fileReloadDeferred) {
    fileReloadDeferred = false;
    refreshOpenFile(); // the diff pane is visible again
  }
  if (mode === "tree" || mode === "network") {
    // the Network sidebar IS the Tree tab's commit list, so both need the graph
    if (currentGraph === null) {
      if (treeListElement.children.length === 0) {
        renderTree(); // first opening: say the history is being read
      }
      loadGraph();
    } else {
      renderTreeIfChanged();
    }
  }
  if (mode === "check") {
    renderCheckPanel();
  } else if (mode === "network") {
    renderNetworkPane();
    if (networkStartViewPending) {
      showNetworkStartView(); // the pane finally has a size to place it in
    }
  }
}

tabBranchesElement.addEventListener("click", function () {
  switchView("branches");
});
tabTreeElement.addEventListener("click", function () {
  switchView("tree");
});
tabCheckElement.addEventListener("click", function () {
  switchView("check");
});
tabNetworkElement.addEventListener("click", function () {
  switchView("network");
});

// Keyboard: ArrowLeft / ArrowRight go to the previous / next tab (wrapping
// round), Home / End to the first / last. The Check tab counts only when shown.
document.getElementById("view-tabs").addEventListener("keydown", function (event) {
  var key = event.key;
  if (key !== "ArrowLeft" && key !== "ArrowRight" && key !== "Home" && key !== "End") {
    return;
  }
  event.preventDefault();
  var tabs = [
    { element: tabBranchesElement, mode: "branches" },
    { element: tabTreeElement, mode: "tree" },
    { element: tabCheckElement, mode: "check" },
    { element: tabNetworkElement, mode: "network" }
  ];
  var shown = [];
  for (var i = 0; i < tabs.length; i++) {
    if (tabs[i].mode !== "check" || appElement.classList.contains("has-security")) {
      shown.push(tabs[i]);
    }
  }
  var index = 0;
  for (var j = 0; j < shown.length; j++) {
    if (shown[j].mode === viewMode) {
      index = j;
    }
  }
  if (key === "ArrowLeft") {
    index = (index - 1 + shown.length) % shown.length;
  } else if (key === "ArrowRight") {
    index = (index + 1) % shown.length;
  } else if (key === "Home") {
    index = 0;
  } else {
    index = shown.length - 1;
  }
  switchView(shown[index].mode);
  shown[index].element.focus();
});

// Keyboard: ArrowUp / ArrowDown walk the tree rows (pseudo-rows included).
treeListElement.addEventListener("keydown", function (event) {
  if (event.key !== "ArrowUp" && event.key !== "ArrowDown") {
    return;
  }
  event.preventDefault(); // stop the list from scrolling under the selection
  var rows = [];
  var children = treeListElement.children;
  for (var i = 0; i < children.length; i++) {
    if (children[i].dataset.sha !== undefined ||
        children[i].dataset.pseudoBranch !== undefined) {
      rows.push(children[i]);
    }
  }
  if (rows.length === 0) {
    return;
  }
  var index = -1;
  for (var j = 0; j < rows.length; j++) {
    if (rows[j].classList.contains("selected")) {
      index = j;
      break;
    }
  }
  if (index === -1) {
    index = 0;
  } else if (event.key === "ArrowDown") {
    index = Math.min(index + 1, rows.length - 1);
  } else {
    index = Math.max(index - 1, 0);
  }
  var row = rows[index];
  row.scrollIntoView({ block: "nearest" });
  var subject = row.querySelector(".tree-subject");
  var spoken = (row.dataset.sha !== undefined ? "Commit " : "") +
    (subject !== null ? subject.textContent : "") + ", " + (index + 1) + " of " + rows.length;
  if (row.dataset.sha !== undefined) {
    if (row.dataset.sha !== selectedCommitSha) {
      selectCommit(row.dataset.sha);
      announce(spoken);
    }
  } else if (row.dataset.pseudoBranch !== selectedBranchName ||
             selectedCommitSha !== null) {
    selectBranch(row.dataset.pseudoBranch);
    announce(spoken);
  }
});

/* ============================== Compare base ============================== */

// sha is a commit id, EMPTY_TREE_BASE ("compare from the beginning") or null.
function setBaseCommit(sha) {
  if (baseSha === sha) {
    return;
  }
  baseSha = sha;
  rememberViewInAddress();
  renderTreeIfChanged();
  renderHeader(); // the "stop comparing" pill appears right away
  // Run sends the base the page shows: its card names it right away
  updateRunCard();
  if (viewMode === "check") {
    renderCheckPanel();
  }
  if (hasSelection()) {
    loadDiff();
  }
}

function clearBase() {
  setBaseCommit(null);
}

/* ============================== Header bar ================================ */

function isNameCharacter(character) {
  return /[A-Za-z0-9._/-]/.test(character);
}

// Find where `name` occurs in `sentence`, preferring occurrences that stand
// alone (not glued to other name-like characters) and that do not overlap
// ranges already claimed. Returns -1 when there is no usable occurrence.
function findNameOccurrence(sentence, name, claimedRanges) {
  var fallback = -1;
  var searchFrom = 0;
  while (true) {
    var index = sentence.indexOf(name, searchFrom);
    if (index === -1) {
      return fallback;
    }
    var end = index + name.length;
    var overlaps = false;
    for (var i = 0; i < claimedRanges.length; i++) {
      if (index < claimedRanges[i].end && end > claimedRanges[i].start) {
        overlaps = true;
        break;
      }
    }
    if (!overlaps) {
      var before = index > 0 ? sentence.charAt(index - 1) : " ";
      var after = end < sentence.length ? sentence.charAt(end) : " ";
      if (!isNameCharacter(before) && !isNameCharacter(after)) {
        return index;
      }
      if (fallback === -1) {
        fallback = index;
      }
    }
    searchFrom = index + 1;
  }
}

// Build the explanation sentence with the branch/base names as chips,
// found by exact string match. Everything is DOM-built, never innerHTML.
function buildExplanationLine(sentence, branchName, baseName) {
  var container = document.createDocumentFragment();
  var names = [];
  if (branchName) {
    names.push(branchName);
  }
  if (baseName && baseName !== branchName) {
    names.push(baseName);
  }
  names.sort(function (a, b) { return b.length - a.length; });

  var ranges = [];
  for (var i = 0; i < names.length; i++) {
    var index = findNameOccurrence(sentence, names[i], ranges);
    if (index !== -1) {
      ranges.push({ start: index, end: index + names[i].length });
    }
  }
  ranges.sort(function (a, b) { return a.start - b.start; });

  var cursor = 0;
  for (var j = 0; j < ranges.length; j++) {
    if (ranges[j].start > cursor) {
      container.appendChild(
        document.createTextNode(sentence.slice(cursor, ranges[j].start)));
    }
    container.appendChild(
      makeText("span", "name-chip", sentence.slice(ranges[j].start, ranges[j].end)));
    cursor = ranges[j].end;
  }
  if (cursor < sentence.length) {
    container.appendChild(document.createTextNode(sentence.slice(cursor)));
  }
  return container;
}

// The one header input that comes from /api/state rather than /api/diff: the
// selected branch's "behind" count. handleNewState compares it to re-render
// the header when the diff answer did not change.
function headerRegionJson() {
  var branchInfo = findBranchInState(selectedBranchName);
  return JSON.stringify([branchInfo ? branchInfo.behind : null]);
}

/* --------------------------- Commit message pane -------------------------- */

// Messages longer than this are clipped until the reader opens them.
var COMMIT_MESSAGE_COLLAPSED_LINES = 6;

// Whether the reader opened the current commit's message.
var commitMessageExpanded = false;

// The Clipboard API exists only in a secure context: 127.0.0.1 counts as
// one, a plain-http LAN address does not.
function canCopyToClipboard() {
  return navigator.clipboard !== undefined &&
    typeof navigator.clipboard.writeText === "function";
}

function makeCopyMessageAction(message) {
  var action = makeText("button", "commit-message-action", "copy");
  action.type = "button";
  action.addEventListener("click", function () {
    navigator.clipboard.writeText(message).then(function () {
      action.textContent = "copied";
      window.setTimeout(function () { action.textContent = "copy"; }, 1200);
    }, function () {
      action.textContent = "copy failed";
    });
  });
  return action;
}

// The author wrote the commit; the committer last applied it. They differ
// after a rebase, an amend by someone else or a cherry-pick.
function commitAuthorLine(author, committer) {
  if (typeof author !== "string" || author === "") {
    return "";
  }
  if (typeof committer === "string" && committer !== "" && committer !== author) {
    return author + " (committed by " + committer + ")";
  }
  return author;
}

/* MESSAGE-EXTRACT-BEGIN (pure function, no DOM; test.sh runs it under node) */

// Splits "%B" output into its subject (first line) and its body, and counts
// the lines that will be on screen.
//
// Exactly one blank line is dropped: git's separator between subject and
// body. Further blank lines are the author's and stay, since the pane renders
// with white-space: pre-wrap. A message whose first line is blank has no
// subject, and nothing is dropped.
//
// lineCount counts rendered lines, not raw ones: it is the N in "show all N
// lines" and decides whether the pane is clipped.
function splitCommitMessage(message) {
  var firstBreak = message.indexOf("\n");
  if (firstBreak === -1) {
    return { subject: message, body: null, lineCount: 1 };
  }
  var subject = message.slice(0, firstBreak);
  if (subject === "") {
    // No subject line: keep the message exactly as the author wrote it.
    return { subject: null, body: message, lineCount: message.split("\n").length };
  }
  var body = message.slice(firstBreak + 1);
  if (body.charAt(0) === "\n") {
    body = body.slice(1); // the one conventional blank separator
  }
  if (body === "") {
    return { subject: subject, body: null, lineCount: 1 };
  }
  return {
    subject: subject,
    body: body,
    lineCount: 1 + body.split("\n").length
  };
}

/* MESSAGE-EXTRACT-END */

function appendMessageLines(textElement, parsed) {
  if (parsed.subject !== null) {
    textElement.appendChild(
      makeText("div", "commit-message-subject", parsed.subject));
  }
  if (parsed.body !== null) {
    textElement.appendChild(makeText("div", "commit-message-body", parsed.body));
  }
}

function renderCommitMessage() {
  clearNode(commitMessageElement);
  commitMessageElement.className = "";

  // Only a single selected commit has one message; a branch spans many.
  if (selectedCommitSha === null || currentDiff === null ||
      diffErrorText !== null ||
      typeof currentDiff.message !== "string" || currentDiff.message === "") {
    return;
  }
  commitMessageElement.className = "shown";

  var message = currentDiff.message;
  var parsed = splitCommitMessage(message);
  var lineCount = parsed.lineCount;
  var isLong = lineCount > COMMIT_MESSAGE_COLLAPSED_LINES;

  var textElement = makeElement("div", "commit-message-text");
  if (isLong && !commitMessageExpanded) {
    textElement.className = "commit-message-text collapsed";
  }
  appendMessageLines(textElement, parsed);
  commitMessageElement.appendChild(textElement);

  var footer = makeElement("div", "commit-message-footer");
  if (isLong) {
    var toggle = makeText("button", "commit-message-action",
      commitMessageExpanded ? "show less" : "show all " + lineCount + " lines");
    toggle.type = "button";
    toggle.addEventListener("click", function () {
      commitMessageExpanded = !commitMessageExpanded;
      renderCommitMessage();
      // the pane was rebuilt: focus goes to the new toggle, its first action,
      // without scrolling the page to it
      commitMessageElement.querySelector(".commit-message-action").focus({ preventScroll: true });
    });
    footer.appendChild(toggle);
  }
  if (canCopyToClipboard()) {
    footer.appendChild(makeCopyMessageAction(message));
  }

  var meta = makeElement("span", "commit-message-meta");
  var whoText = commitAuthorLine(currentDiff.author, currentDiff.committer);
  if (whoText !== "") {
    var who = makeText("span", "commit-message-author", whoText);
    who.title = whoText; // the ellipsis hides long names
    meta.appendChild(who);
  }
  meta.appendChild(makeText("span", "commit-message-sha mono", currentDiff.short));
  footer.appendChild(meta);
  commitMessageElement.appendChild(footer);
}

function makeStopComparingPill() {
  var pill = makeText("button", "stop-compare-pill", "× stop comparing");
  pill.type = "button";
  pill.addEventListener("click", clearBase);
  return pill;
}

// The tab title for the diff on screen. A running or just-finished
// security check can take the title instead (see updateDocumentTitle).
var diffTitle = "BranchLens";

function setDiffTitle(title) {
  diffTitle = title;
  updateDocumentTitle();
}

function renderHeader() {
  lastHeaderJson = headerRegionJson();
  clearNode(headerLine1Element);
  clearNode(headerLine2Element);
  // Guards on the selection itself, so this covers the early returns below.
  renderCommitMessage();

  if (!hasSelection()) {
    headerLine1Element.textContent = "Pick a branch on the left to see what it changes.";
    if (baseSha !== null) {
      headerLine1Element.appendChild(makeStopComparingPill());
    }
    setDiffTitle("BranchLens");
    return;
  }
  if (diffErrorText !== null || currentDiff === null) {
    if (diffErrorText === null) {
      headerLine1Element.appendChild(revealAfterDelay(makeText("span", "",
        selectedBranchName !== null ?
          "Reading the changes on " + selectedBranchName + "…" :
          "Reading the changes in this commit…")));
    }
    // even on errors the pill must stay reachable while a base is set
    if (baseSha !== null) {
      headerLine1Element.appendChild(makeStopComparingPill());
    }
    setDiffTitle("BranchLens");
    return;
  }

  // Under a custom base the sentence quotes a commit subject, so no base name
  // is turned into a chip.
  headerLine1Element.appendChild(
    buildExplanationLine(currentDiff.explanation || "",
      currentDiff.branch || null,
      currentDiff.base_override ? null : (diffBaseLabel(currentDiff) || null)));
  if (baseSha !== null) {
    headerLine1Element.appendChild(makeStopComparingPill());
  }

  var counted = countChangedEntries(currentDiff.files);
  var headText = pluralize(counted.files, "file", "files");
  if (counted.directories > 0) {
    headText = headText + " · " +
      pluralize(counted.directories, "directory", "directories");
  }
  headerLine2Element.appendChild(document.createTextNode(headText + " · "));
  headerLine2Element.appendChild(
    makeText("span", "mono adds", "+" + currentDiff.total_adds));
  headerLine2Element.appendChild(document.createTextNode(" "));
  headerLine2Element.appendChild(
    makeText("span", "mono dels", MINUS + currentDiff.total_dels));

  // The "newer commits" sentence belongs only to plain branch comparisons:
  // never in commit mode, never while a custom base overrides the fork point.
  var branchInfo = findBranchInState(selectedBranchName);
  if (selectedBranchName !== null && !currentDiff.base_override &&
      branchInfo && branchInfo.behind > 0) {
    headerLine2Element.appendChild(document.createTextNode(" · "));
    headerLine2Element.appendChild(makeText("span", "mono", diffBaseLabel(currentDiff)));
    var verb = branchInfo.behind === 1 ?
      " has 1 newer commit that isn't in this branch." :
      " has " + branchInfo.behind + " newer commits that aren't in this branch.";
    headerLine2Element.appendChild(document.createTextNode(verb));
  }

  var titleName = selectedBranchName !== null ? currentDiff.branch : currentDiff.short;
  setDiffTitle("+" + currentDiff.total_adds + " " + MINUS + currentDiff.total_dels +
    " · " + titleName + " - BranchLens");
}

/* ============================== File explorer ============================= */

// T: the file became a symbolic link or a submodule, or the other way round.
var STATUS_WORDS = { A: "new", M: "edited", D: "deleted", R: "moved", T: "type changed" };
// The chip's colour classes; a type change wears the edited colours.
var STATUS_CLASSES = { A: "new", M: "edited", D: "deleted", R: "moved", T: "edited typechanged" };

// 'git ls-files --others' names an embedded repository or a worktree as one
// "dir/" entry and stops there. It is a directory, not a new empty file, and
// its contents are neither counted nor shown.
var DIRECTORY_ENTRY_SENTENCE = "A directory with its own git repository " +
  "(another repository, or another checked-out copy of this one); git does " +
  "not look inside it, so nothing in it is counted or shown here.";

// The server marks a file whose name is not valid UTF-8 "unshowable": its
// row shows a stand-in name and its counts, and nothing opens it.
var UNSHOWABLE_SENTENCE = "This file name is not valid UTF-8, so BranchLens " +
  "cannot show its patch; the name above stands in for it.";

// The list entry for a path, or null when there is none or it cannot be opened.
function findShowableFileEntry(path) {
  var entry = findFileEntry(path);
  return entry !== null && entry.unshowable !== true ? entry : null;
}

// Directory entries are counted apart from files.
function countChangedEntries(files) {
  var fileCount = 0;
  var directoryCount = 0;
  for (var i = 0; i < files.length; i++) {
    if (isDirectoryEntry(files[i])) {
      directoryCount = directoryCount + 1;
    } else {
      fileCount = fileCount + 1;
    }
  }
  return { files: fileCount, directories: directoryCount };
}

// Status words for two commits on different lines of history: no commit added
// or deleted the file, it exists at one point and not at the other.
var COMPARISON_STATUS_WORDS = {
  A: "present", M: "differs", D: "absent", R: "moved", T: "type differs"
};

function isDivergentComparison() {
  return currentDiff !== null && currentDiff.base_override === true &&
    currentDiff.base_is_ancestor === false;
}

function statusWord(status) {
  if (isDivergentComparison()) {
    return hasOwnKey(COMPARISON_STATUS_WORDS, status) ?
      COMPARISON_STATUS_WORDS[status] : "differs";
  }
  return hasOwnKey(STATUS_WORDS, status) ? STATUS_WORDS[status] : "edited";
}

// The colour class never changes with the wording: green for the side that has
// the file, red for the side that does not.
function statusClass(status) {
  return hasOwnKey(STATUS_CLASSES, status) ? STATUS_CLASSES[status] : "edited";
}

function makeWordChip(status) {
  var chipColumn = makeElement("span", "chip-col");
  chipColumn.appendChild(
    makeText("span", "word-chip " + statusClass(status), statusWord(status)));
  return chipColumn;
}

// Directory prefix muted, filename emphasized. Only the directory shrinks,
// so a narrow row cuts the directory and keeps the filename whole.
function makePlainPath(path, struck) {
  var container = makeElement("span", "file-path mono" + (struck ? " struck" : ""));
  // A directory entry arrives as "dir/": the slash goes, or the name would be
  // empty.
  if (path.length > 1 && path.charAt(path.length - 1) === "/") {
    path = path.slice(0, path.length - 1);
  }
  var slashIndex = path.lastIndexOf("/");
  if (slashIndex >= 0) {
    container.appendChild(makeText("span", "path-dir", path.slice(0, slashIndex + 1)));
    container.appendChild(makeText("span", "path-name", path.slice(slashIndex + 1)));
  } else {
    container.appendChild(makeText("span", "path-name", path));
  }
  return container;
}

// Collapsed rename form: src/{c.py → c2.py} when a common directory exists.
function makeRenamePath(oldPath, newPath) {
  var container = makeElement("span", "file-path mono");
  var inner = makeElement("span", "rename-path");
  var oldParts = oldPath.split("/");
  var newParts = newPath.split("/");
  var commonCount = 0;
  while (commonCount < oldParts.length - 1 && commonCount < newParts.length - 1 &&
         oldParts[commonCount] === newParts[commonCount]) {
    commonCount = commonCount + 1;
  }
  if (commonCount > 0) {
    var prefix = oldParts.slice(0, commonCount).join("/") + "/";
    var oldRest = oldParts.slice(commonCount).join("/");
    var newRest = newParts.slice(commonCount).join("/");
    inner.appendChild(makeText("span", "path-dir", prefix));
    inner.appendChild(makeText("span", "path-old", "{" + oldRest + " → "));
    inner.appendChild(makeText("span", "path-name", newRest));
    inner.appendChild(makeText("span", "path-old", "}"));
  } else {
    inner.appendChild(makeText("span", "path-old", oldPath + " → "));
    inner.appendChild(makeText("span", "path-name", newPath));
  }
  container.appendChild(inner);
  return container;
}

function isDirectoryEntry(file) {
  return !!file && file.entry_kind === "directory";
}

function makeCountsSpan(file) {
  if (file.binary) {
    return makeText("span", "binary-pill", "binary");
  }
  if (isDirectoryEntry(file)) {
    var dirPill = makeText("span", "binary-pill", "directory");
    dirPill.title = DIRECTORY_ENTRY_SENTENCE;
    return dirPill;
  }
  if (typeof file.adds !== "number" || typeof file.dels !== "number") {
    var unknownPill = makeText("span", "binary-pill", "not counted");
    unknownPill.title = "git did not report line counts for this entry.";
    return unknownPill;
  }
  var counts = makeElement("span", "file-counts mono");
  counts.appendChild(makeText("span", "adds", "+" + file.adds));
  counts.appendChild(document.createTextNode(" "));
  counts.appendChild(makeText("span", "dels", MINUS + file.dels));
  return counts;
}

function makeFileRow(file) {
  var row = makeElement("div", "file-row");
  row.dataset.filePath = file.path;
  if (file.path === selectedFilePath) {
    row.classList.add("selected");
  }
  // The tooltip holds the full path, which a narrow row may cut.
  var tooltip = file.path;
  if (file.status === "R" && file.old_path) {
    tooltip = file.old_path + " → " + file.path;
  }
  if (isDirectoryEntry(file)) {
    tooltip = tooltip + "\n" + DIRECTORY_ENTRY_SENTENCE;
  } else if (file.entry_kind === "symlink") {
    tooltip = tooltip + "\nNew symlink: not yet committed; its one line is the path it points at";
  } else if (file.untracked) {
    tooltip = tooltip + "\nNew file: not yet committed";
  } else if (file.status === "T") {
    tooltip = tooltip + "\nIts type changed: a file, a symbolic link or a submodule became another one of these";
  }
  if (file.unshowable === true) {
    tooltip = tooltip + "\n" + UNSHOWABLE_SENTENCE;
  }
  row.title = tooltip;
  row.appendChild(makeWordChip(file.status));
  if (file.status === "R" && file.old_path) {
    row.appendChild(makeRenamePath(file.old_path, file.path));
  } else {
    row.appendChild(makePlainPath(file.path,
      file.status === "D" && !isDivergentComparison()));
  }
  row.appendChild(makeCountsSpan(file));
  if (file.unshowable === true) {
    row.classList.add("unshowable"); // counted and listed, never opened
    return row;
  }
  row.addEventListener("click", function () {
    selectFile(file.path);
  });
  return row;
}

function renderFileList() {
  if (!hasSelection() || currentDiff === null || diffErrorText !== null) {
    clearNode(fileListElement);
    fileListHeaderElement.textContent = "";
    previousFileRowJson = null;
    return;
  }

  var listCounted = countChangedEntries(currentDiff.files);
  var headerText = listCounted.files === 1 ?
    "1 FILE CHANGED" : listCounted.files + " FILES CHANGED";
  if (listCounted.directories > 0) {
    headerText = headerText + " · " + (listCounted.directories === 1 ?
      "1 DIRECTORY" : listCounted.directories + " DIRECTORIES");
  }
  fileListHeaderElement.textContent = headerText;

  // Rows whose data did not change are kept, badge included; only new and
  // changed rows are built. The key includes the kind of comparison, which
  // sets the status words and the strikethrough.
  var allowFlash = previousFileRowJson !== null;
  var divergent = isDivergentComparison();
  var oldRowsByKey = Object.create(null); // no inherited keys: any path is safe
  var oldRows = fileListElement.children;
  for (var r = 0; r < oldRows.length; r++) {
    oldRowsByKey[oldRows[r].listKey] = oldRows[r];
  }
  var newRowJson = Object.create(null);
  var pathCounts = Object.create(null);
  var nextOldRow = fileListElement.firstChild;
  for (var i = 0; i < currentDiff.files.length; i++) {
    var file = currentDiff.files[i];
    // Names that are not valid UTF-8 can share one stand-in path: the second
    // and later rows with that path get a numbered key.
    var listKey = file.path;
    if (pathCounts[file.path] === undefined) {
      pathCounts[file.path] = 1;
    } else {
      pathCounts[file.path] = pathCounts[file.path] + 1;
      listKey = file.path + "\u0000#" + pathCounts[file.path];
    }
    var rowJson = JSON.stringify(file);
    var rowKey = rowJson + "|" + divergent;
    newRowJson[listKey] = rowJson;
    var row = oldRowsByKey[listKey];
    if (row === undefined || row.dataset.rowKey !== rowKey) {
      row = makeFileRow(file);
      row.dataset.rowKey = rowKey;
      row.listKey = listKey;
      if (allowFlash && previousFileRowJson[listKey] !== rowJson) {
        flashRow(row);
      }
    } else {
      row.classList.toggle("selected", file.path === selectedFilePath);
    }
    if (row === nextOldRow) {
      nextOldRow = row.nextSibling;
    } else {
      fileListElement.insertBefore(row, nextOldRow);
    }
  }
  // What is left after the last row placed is no longer in the diff.
  while (nextOldRow !== null) {
    var leftover = nextOldRow;
    nextOldRow = nextOldRow.nextSibling;
    fileListElement.removeChild(leftover);
  }
  previousFileRowJson = newRowJson;
  // new rows have no badge yet; patch them in
  updateSecurityBadges();
}

function updateFileSelection() {
  var rows = fileListElement.children;
  for (var i = 0; i < rows.length; i++) {
    var isSelected = rows[i].dataset.filePath === selectedFilePath;
    rows[i].classList.toggle("selected", isSelected);
    if (isSelected) {
      rows[i].scrollIntoView({ block: "nearest" });
    }
  }
}

// Keyboard: ArrowUp / ArrowDown move the file selection when the list has focus.
fileListElement.addEventListener("keydown", function (event) {
  if (event.key !== "ArrowUp" && event.key !== "ArrowDown") {
    return;
  }
  event.preventDefault(); // stop the list from scrolling under the selection
  if (currentDiff === null || currentDiff.files.length === 0) {
    return;
  }
  // the files that can be opened, in list order
  var files = [];
  for (var i = 0; i < currentDiff.files.length; i++) {
    if (currentDiff.files[i].unshowable !== true) {
      files.push(currentDiff.files[i]);
    }
  }
  if (files.length === 0) {
    return;
  }
  var index = -1;
  for (var j = 0; j < files.length; j++) {
    if (files[j].path === selectedFilePath) {
      index = j;
    }
  }
  if (index === -1) {
    index = 0;
  } else if (event.key === "ArrowDown") {
    index = Math.min(index + 1, files.length - 1);
  } else {
    index = Math.max(index - 1, 0);
  }
  if (files[index].path !== selectedFilePath) {
    selectFile(files[index].path);
    announce("File " + files[index].path + ", " + statusWord(files[index].status) +
      ", " + (index + 1) + " of " + files.length);
  }
});

/* ============================== Unified diff parser ======================= */
/* PARSER-EXTRACT-BEGIN (pure function, no DOM; test.sh runs it under node) */

function parseUnifiedDiff(patchText) {
  var hunkHeaderPattern = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/;
  var lines = patchText.split("\n");
  if (lines.length > 0 && lines[lines.length - 1] === "") {
    lines.pop(); // a patch ending in a newline leaves one empty trailing entry
  }
  var hunks = [];
  var currentHunk = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var headerMatch = line.match(hunkHeaderPattern);
    if (headerMatch) {
      currentHunk = {
        oldStart: parseInt(headerMatch[1], 10),
        oldCount: headerMatch[2] === undefined ? 1 : parseInt(headerMatch[2], 10),
        newStart: parseInt(headerMatch[3], 10),
        newCount: headerMatch[4] === undefined ? 1 : parseInt(headerMatch[4], 10),
        lines: []
      };
      hunks.push(currentHunk);
      continue;
    }
    if (currentHunk === null) {
      continue; // still inside the file header part of the patch
    }
    var firstCharacter = line.charAt(0);
    if (firstCharacter === "+") {
      currentHunk.lines.push({ type: "add", text: line.slice(1) });
    } else if (firstCharacter === "-") {
      currentHunk.lines.push({ type: "del", text: line.slice(1) });
    } else if (firstCharacter === " ") {
      currentHunk.lines.push({ type: "ctx", text: line.slice(1) });
    } else if (firstCharacter === "\\") {
      // "\ No newline at end of file" is not a content line
    } else if (line === "") {
      // a bare empty line inside a hunk counts as empty context
      currentHunk.lines.push({ type: "ctx", text: "" });
    } else {
      currentHunk = null; // unknown header-like line: stop this hunk gracefully
    }
  }
  return hunks;
}

// The file modes a patch names, as {oldMode, newMode}, each a string such as
// "100644", or null when that side has none. Only the header lines of each
// section, before its first "@@", are read. A type change comes as two
// sections: the old file deleted, then the new one created. An "index" line
// carries the mode when it did not change.
function parsePatchModes(patchText) {
  var modes = { oldMode: null, newMode: null };
  var headerPattern = /^(old mode|new mode|new file mode|deleted file mode) ([0-7]{6})$/;
  var indexPattern = /^index [0-9a-f]+\.\.[0-9a-f]+ ([0-7]{6})$/;
  var lines = patchText.split("\n");
  var inHeader = true;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.indexOf("diff --git ") === 0) {
      inHeader = true; // a new section starts
      continue;
    }
    if (!inHeader) {
      continue;
    }
    if (line.indexOf("@@") === 0) {
      inHeader = false;
      continue;
    }
    var headerMatch = headerPattern.exec(line);
    if (headerMatch !== null) {
      if (headerMatch[1] === "old mode" || headerMatch[1] === "deleted file mode") {
        modes.oldMode = headerMatch[2];
      } else {
        modes.newMode = headerMatch[2];
      }
      continue;
    }
    var indexMatch = indexPattern.exec(line);
    if (indexMatch !== null) {
      modes.oldMode = indexMatch[1];
      modes.newMode = indexMatch[1];
    }
  }
  return modes;
}

// One line about the modes from parsePatchModes, or null when there is
// nothing to say. 100755 is an executable file, 120000 a symbolic link (its
// one line is the path it points at), 160000 a submodule (its line is the
// commit it points at).
function patchModeNote(modes) {
  var oldMode = modes.oldMode;
  var newMode = modes.newMode;
  if (oldMode !== null && newMode !== null && oldMode !== newMode) {
    var change = "mode " + oldMode + " → " + newMode;
    if (newMode === "120000") {
      return change + ": now a symbolic link; the added line is its target";
    }
    if (oldMode === "120000") {
      return change + ": no longer a symbolic link; the deleted line was its target";
    }
    if (newMode === "160000") {
      return change + ": now a submodule";
    }
    if (oldMode === "160000") {
      return change + ": no longer a submodule";
    }
    if (newMode === "100755") {
      return change + " (now executable)";
    }
    if (oldMode === "100755") {
      return change + " (no longer executable)";
    }
    return change;
  }
  if (newMode === "120000" || oldMode === "120000") {
    if (oldMode === null) {
      return "a new symbolic link; the added line is its target";
    }
    if (newMode === null) {
      return "a deleted symbolic link; the deleted line was its target";
    }
    return "a symbolic link; its lines are the path it points at";
  }
  if (newMode === "160000" || oldMode === "160000") {
    return "a submodule; its lines are the commits it points at";
  }
  if (oldMode === null && newMode === "100755") {
    return "a new executable file (mode 100755)";
  }
  return null;
}

/* PARSER-EXTRACT-END */

/* ============================== Diff pane ================================= */

function findFileEntry(path) {
  if (currentDiff === null) {
    return null;
  }
  for (var i = 0; i < currentDiff.files.length; i++) {
    if (currentDiff.files[i].path === path) {
      return currentDiff.files[i];
    }
  }
  return null;
}

// Build a centered card from a list of parts: strings become plain text,
// objects with mono:true become mono spans.
function makeCard(parts) {
  var holder = makeElement("div", "card-holder");
  var card = makeElement("div", "card");
  for (var i = 0; i < parts.length; i++) {
    if (typeof parts[i] === "string") {
      card.appendChild(document.createTextNode(parts[i]));
    } else if (parts[i].errorBlock) {
      card.appendChild(makeText("span", "mono error-text", parts[i].text));
    } else {
      card.appendChild(makeText("span", "mono", parts[i].text));
    }
  }
  holder.appendChild(card);
  return holder;
}

function renderDiffSticky() {
  clearNode(diffStickyElement);
  if (!hasSelection() || currentDiff === null || diffErrorText !== null) {
    return;
  }
  if (selectedFilePath === null || fileVanished) {
    return;
  }
  var entry = findFileEntry(selectedFilePath);
  if (entry === null) {
    return;
  }

  var miniHeader = makeElement("div", "mini-header");
  miniHeader.appendChild(makeWordChip(entry.status));
  if (entry.status === "R" && entry.old_path) {
    // full "old → new" form in the mini-header
    var renamed = makeElement("span", "file-path mono");
    var inner = makeElement("span", "rename-path");
    inner.appendChild(makeText("span", "path-old", entry.old_path + " → "));
    inner.appendChild(makeText("span", "path-name", entry.path));
    renamed.appendChild(inner);
    miniHeader.appendChild(renamed);
  } else {
    var plainPath = makePlainPath(entry.path,
      entry.status === "D" && !isDivergentComparison());
    plainPath.title = entry.path;
    miniHeader.appendChild(plainPath);
  }
  miniHeader.appendChild(makeCountsSpan(entry));
  diffStickyElement.appendChild(miniHeader);

  if (currentFile && currentFile.truncated) {
    diffStickyElement.appendChild(
      makeText("div", "banner amber", "Large change: showing only the first part."));
  }
  // an executable bit, a symbolic link or a submodule: the lines alone hide it
  var modeNote = currentFile ? patchModeNote(parsePatchModes(currentFile.patch || "")) : null;
  if (modeNote !== null) {
    diffStickyElement.appendChild(makeText("div", "banner",
      modeNote.charAt(0).toUpperCase() + modeNote.slice(1) + "."));
  }
  if (entry.status === "D") {
    if (isDivergentComparison()) {
      // A commit answer carries its subject; a branch answer names the branch.
      var targetWords = typeof currentDiff.subject === "string" ?
        'at "' + currentDiff.subject + '"' : "on " + (currentDiff.branch || "");
      // The base may be a later commit on the target's own line.
      var lineWords = currentDiff.base_is_descendant === true ?
        ", which is behind that commit on the same line of history, " :
        ". The two sit on different lines of history, ";
      diffStickyElement.appendChild(makeText("div", "banner",
        'This file exists at "' + (currentDiff.base_subject || "") +
        '" and not ' + targetWords + lineWords + "so no commit deleted it."));
    } else {
      diffStickyElement.appendChild(
        makeText("div", "banner", "This whole file was deleted."));
    }
  }
}

/* ---- The diff table, in chunks ---- */

// The rows are split into chunks of at most DIFF_CHUNK_ROWS rows and about
// DIFF_CHUNK_CHARACTERS characters, each a table of its own. The browser
// lays out only the chunks near the screen (content-visibility: auto), and
// a new answer rebuilds only the chunks whose rows changed.
var DIFF_CHUNK_ROWS = 300;
var DIFF_CHUNK_CHARACTERS = 50000;
var DIFF_ROW_HEIGHT_PX = 20; // an unwrapped row: td.code's line-height

var diffChunkHolder = null;  // the element holding the chunks on screen, or null
var diffChunkPath = null;    // the file those chunks show
var diffChunkKeys = [];      // each chunk's rows as JSON, in order

// The table's rows as plain data: {type: "sep", text} for a separator, else
// {type: "add" | "del" | "ctx", oldNumber, newNumber, text}, where a number
// the row does not have is "".
function buildDiffRows(hunks) {
  var rows = [];
  var previousHunk = null;
  for (var h = 0; h < hunks.length; h++) {
    var hunk = hunks[h];

    // Computed "unchanged lines" separators replace the raw hunk headers.
    if (previousHunk === null) {
      if (hunk.oldStart > 1) {
        var leading = hunk.oldStart - 1;
        rows.push({ type: "sep", text: leading === 1 ?
          "· first line unchanged ·" :
          "· first " + leading + " lines unchanged ·" });
      }
    } else {
      var gap = hunk.oldStart - (previousHunk.oldStart + previousHunk.oldCount);
      if (gap > 0) {
        rows.push({ type: "sep", text: gap === 1 ?
          "· 1 unchanged line ·" :
          "· " + gap + " unchanged lines ·" });
      }
    }
    // No trailing separator after the last hunk: the remaining
    // line count cannot be known from the patch alone.

    var oldLine = hunk.oldStart;
    var newLine = hunk.newStart;
    for (var i = 0; i < hunk.lines.length; i++) {
      var diffLine = hunk.lines[i];
      var row = { type: diffLine.type, oldNumber: "", newNumber: "", text: diffLine.text };
      if (diffLine.type !== "add") { // deleted and context lines have an old number
        row.oldNumber = String(oldLine);
        oldLine = oldLine + 1;
      }
      if (diffLine.type !== "del") { // added and context lines have a new number
        row.newNumber = String(newLine);
        newLine = newLine + 1;
      }
      rows.push(row);
    }
    previousHunk = hunk;
  }
  return rows;
}

function splitDiffRows(rows) {
  var chunks = [];
  var chunk = [];
  var characters = 0;
  for (var i = 0; i < rows.length; i++) {
    if (chunk.length > 0 && (chunk.length >= DIFF_CHUNK_ROWS ||
        characters + rows[i].text.length > DIFF_CHUNK_CHARACTERS)) {
      chunks.push(chunk);
      chunk = [];
      characters = 0;
    }
    chunk.push(rows[i]);
    characters = characters + rows[i].text.length;
  }
  if (chunk.length > 0) {
    chunks.push(chunk);
  }
  return chunks;
}

function makeDiffRowElement(rowData) {
  if (rowData.type === "sep") {
    var separator = makeElement("tr", "row-sep");
    var cell = makeText("td", "sep", rowData.text);
    cell.colSpan = 3;
    separator.appendChild(cell);
    return separator;
  }
  var row = makeElement("tr", "row-" + rowData.type);
  row.appendChild(makeText("td", "gutter mono", rowData.oldNumber));
  row.appendChild(makeText("td", "gutter mono", rowData.newNumber));
  row.appendChild(makeText("td", "code mono", rowData.text));
  return row;
}

// One chunk: a table with the same fixed columns as every other chunk.
function makeDiffChunk(rows, heightPx) {
  var chunk = makeElement("div", "diff-chunk");
  // the height assumed while the chunk is off screen and not laid out yet
  chunk.style.containIntrinsicHeight = "auto " + heightPx + "px";
  var table = makeElement("table", "diff-table");
  var columnGroup = makeElement("colgroup");
  var oldColumn = makeElement("col");
  oldColumn.style.width = "44px";
  var newColumn = makeElement("col");
  newColumn.style.width = "44px";
  columnGroup.appendChild(oldColumn);
  columnGroup.appendChild(newColumn);
  columnGroup.appendChild(makeElement("col"));
  table.appendChild(columnGroup);
  var tableBody = makeElement("tbody");
  for (var i = 0; i < rows.length; i++) {
    tableBody.appendChild(makeDiffRowElement(rows[i]));
  }
  table.appendChild(tableBody);
  chunk.appendChild(table);
  return chunk;
}

// Shows the file's table, keeping every chunk already on screen whose rows
// did not change.
function showDiffTable(hunks) {
  var chunks = splitDiffRows(buildDiffRows(hunks));
  var keys = [];
  for (var i = 0; i < chunks.length; i++) {
    keys.push(JSON.stringify(chunks[i]));
  }
  if (diffChunkHolder === null || diffChunkPath !== selectedFilePath) {
    showInDiffBody(makeElement("div", "diff-chunks"));
    diffChunkHolder = diffBodyElement.firstChild;
    diffChunkPath = selectedFilePath;
    diffChunkKeys = [];
  }
  var shown = diffChunkHolder.children;
  // Every height is read before anything changes (one layout). A new chunk
  // starts at the height of the one it replaces, so the text on screen stays.
  var oldHeights = [];
  for (i = 0; i < keys.length && i < shown.length; i++) {
    oldHeights.push(keys[i] === diffChunkKeys[i] ? 0 : shown[i].offsetHeight);
  }
  for (i = 0; i < keys.length; i++) {
    if (i < diffChunkKeys.length && keys[i] === diffChunkKeys[i]) {
      continue; // same rows: the chunk on screen stays
    }
    // 0 when the pane is hidden (the Network view): then the rows decide
    var heightPx = i < oldHeights.length ? oldHeights[i] : 0;
    if (heightPx === 0) {
      heightPx = chunks[i].length * DIFF_ROW_HEIGHT_PX;
    }
    var chunk = makeDiffChunk(chunks[i], heightPx);
    if (i < shown.length) {
      diffChunkHolder.replaceChild(chunk, shown[i]);
    } else {
      diffChunkHolder.appendChild(chunk);
    }
  }
  while (shown.length > keys.length) {
    diffChunkHolder.removeChild(diffChunkHolder.lastChild);
  }
  diffChunkKeys = keys;
}

// Replaces whatever the diff body shows with one element (null: nothing).
function showInDiffBody(element) {
  clearNode(diffBodyElement);
  diffChunkHolder = null;
  if (element !== null) {
    diffBodyElement.appendChild(element);
  }
}

function renderDiffBody() {
  if (stateErrorText !== null) {
    showInDiffBody(makeCard([
      "This repository can't be shown right now: ",
      { text: stateErrorText, errorBlock: true }
    ]));
    return;
  }
  if (!hasSelection()) {
    if (branchVanished) {
      showInDiffBody(makeCard(
        ["This branch no longer exists; it may have been merged or deleted."]));
    } else if (commitVanished) {
      showInDiffBody(makeCard(["This commit is no longer among the commits shown; " +
        "newer commits may have pushed it out, or the history was rewritten."]));
    } else {
      showInDiffBody(null);
    }
    return;
  }
  if (diffErrorText !== null) {
    if (selectedBranchName !== null) {
      showInDiffBody(makeCard([
        { text: selectedBranchName },
        " can't be compared: ",
        { text: diffErrorText, errorBlock: true }
      ]));
    } else {
      showInDiffBody(makeCard([
        "This commit can't be compared: ",
        { text: diffErrorText, errorBlock: true }
      ]));
    }
    return;
  }
  if (currentDiff === null) {
    showInDiffBody(revealAfterDelay(makeCard(["Reading the changes…"])));
    return;
  }
  if (currentDiff.files.length === 0) {
    if (selectedCommitSha !== null && baseSha === null &&
        commitIsShallowBoundary(selectedCommitSha)) {
      // the header holds the server's sentence about the missing parent
      showInDiffBody(makeCard(["No files are listed: this clone stops at this " +
        "commit, so there is nothing to compare it with."]));
    } else if (selectedCommitSha !== null && baseSha === null) {
      showInDiffBody(makeCard(["This commit changes no files, for example an empty " +
        "commit or a merge that brought nothing new."]));
    } else {
      showInDiffBody(makeCard(["There are no changes to show yet."]));
    }
    return;
  }
  if (selectedFilePath === null) {
    showInDiffBody(makeCard(
      ["Choose a file on the left to see exactly what changed in it."]));
    return;
  }
  if (fileVanished || findFileEntry(selectedFilePath) === null) {
    // name the comparison point the way the header does: a custom base by
    // its subject, a plain branch comparison by the base branch name
    var vanishedParts = [{ text: selectedFilePath }];
    if (currentDiff.whole_history === true) {
      vanishedParts.push(" is no longer among the files a push would publish.");
    } else if (currentDiff.base_empty_tree === true) {
      vanishedParts.push(" is no longer among the files; it may have been deleted or moved.");
    } else if (currentDiff.base_override) {
      vanishedParts.push(' no longer differs from "' +
        (currentDiff.base_subject || "") +
        '"; the change may have been committed or undone.');
    } else if (diffBaseLabel(currentDiff) !== null) {
      vanishedParts.push(" no longer differs from ");
      vanishedParts.push({ text: diffBaseLabel(currentDiff) });
      vanishedParts.push("; the change may have been committed or undone.");
    } else {
      vanishedParts.push(" no longer appears in this comparison" +
        "; the change may have been committed or undone.");
    }
    showInDiffBody(makeCard(vanishedParts));
    return;
  }
  if (fileErrorText !== null) {
    showInDiffBody(makeCard([
      { text: selectedFilePath },
      " can't be shown right now: ",
      { text: fileErrorText, errorBlock: true }
    ]));
    return;
  }
  if (currentFile === null) {
    showInDiffBody(revealAfterDelay(makeCard([
      "Reading the changes in ", { text: selectedFilePath }, "…"
    ])));
    return;
  }
  if (currentFile.binary) {
    showInDiffBody(makeCard([
      { text: currentFile.path },
      " is a binary file: no text preview."
    ]));
    return;
  }

  var selectedEntry = findFileEntry(selectedFilePath);
  if (isDirectoryEntry(currentFile) || isDirectoryEntry(selectedEntry)) {
    showInDiffBody(makeCard([
      { text: selectedFilePath },
      " is " + DIRECTORY_ENTRY_SENTENCE.charAt(0).toLowerCase() +
      DIRECTORY_ENTRY_SENTENCE.slice(1)
    ]));
    return;
  }

  var hunks = parseUnifiedDiff(currentFile.patch || "");
  if (hunks.length === 0) {
    var entry = selectedEntry;
    var modeNote = patchModeNote(parsePatchModes(currentFile.patch || ""));
    if (entry && entry.status === "R" && entry.old_path) {
      showInDiffBody(makeCard([
        "File moved from ",
        { text: entry.old_path },
        "; contents unchanged."
      ]));
    } else if (modeNote !== null) {
      showInDiffBody(makeCard(["The contents did not change. " +
        modeNote.charAt(0).toUpperCase() + modeNote.slice(1) + "."]));
    } else {
      showInDiffBody(makeCard(
        ["There are no line-by-line changes to show for this file."]));
    }
    return;
  }
  showDiffTable(hunks);
}

function renderDiffPane() {
  renderDiffSticky();
  renderDiffBody();
}

/* ============================== Copy on select =========================== */

// Selecting code in the diff copies it when the gesture ends (mouse button
// up, or Shift released for a keyboard selection): the selected part of each
// code cell, one line per row, without gutters, +/− signs or separators.
// Cmd+C / Ctrl+C on such a selection gives the same text. The page never
// reads the clipboard.

var COPY_NOTICE_MS = 1500;
var copyNoticeElement = document.getElementById("copy-notice");
var copyNoticeTimer = null;
// The last text copied: a gesture that ends twice (mouse button, then
// Shift) copies once.
var lastCopiedSelection = "";

// The code lines the current selection covers, or null when there is no
// selection or it reaches outside the diff body.
function selectedDiffLines() {
  var selection = window.getSelection();
  if (selection === null || selection.rangeCount === 0 || selection.isCollapsed) {
    return null;
  }
  var range = selection.getRangeAt(0);
  if (!diffBodyElement.contains(range.commonAncestorContainer)) {
    return null;
  }
  var cells = diffBodyElement.querySelectorAll("td.code");
  var lines = [];
  for (var i = 0; i < cells.length; i++) {
    if (!range.intersectsNode(cells[i])) {
      continue;
    }
    var cellRange = document.createRange();
    cellRange.selectNodeContents(cells[i]);
    // A selection ending where a cell starts, or starting after it ends,
    // takes nothing from it.
    if (range.compareBoundaryPoints(Range.START_TO_END, cellRange) <= 0 ||
        range.compareBoundaryPoints(Range.END_TO_START, cellRange) > 0) {
      continue;
    }
    // The selected part of this cell: the whole cell, cut where the
    // selection starts or ends inside it.
    var startsInside = range.compareBoundaryPoints(Range.START_TO_START, cellRange) > 0;
    var endsInside = range.compareBoundaryPoints(Range.END_TO_END, cellRange) < 0;
    if (startsInside) {
      cellRange.setStart(range.startContainer, range.startOffset);
    }
    if (endsInside) {
      cellRange.setEnd(range.endContainer, range.endOffset);
    }
    var text = cellRange.toString();
    // A cut that leaves nothing of a line drops it; an empty line lying
    // inside the selection is kept.
    if (text === "" && (startsInside || endsInside)) {
      continue;
    }
    lines.push(text);
  }
  return lines.length === 0 ? null : lines;
}

function showCopyNotice(text) {
  copyNoticeElement.textContent = text;
  copyNoticeElement.hidden = false;
  if (copyNoticeTimer !== null) {
    window.clearTimeout(copyNoticeTimer);
  }
  copyNoticeTimer = window.setTimeout(function () {
    copyNoticeElement.hidden = true;
    copyNoticeTimer = null;
  }, COPY_NOTICE_MS);
}

// Copies the selected code, if any, when a selection gesture ends.
function copySelectedDiffText() {
  var lines = selectedDiffLines();
  if (lines === null) {
    lastCopiedSelection = ""; // the next selection is new, even if identical
    return;
  }
  var text = lines.join("\n");
  if (text === lastCopiedSelection) {
    return;
  }
  lastCopiedSelection = text;
  if (!canCopyToClipboard()) {
    showCopyNotice("Not copied: the browser gives this page no clipboard access");
    return;
  }
  navigator.clipboard.writeText(text).then(function () {
    showCopyNotice(lines.length === 1 ? "Copied" : "Copied " + lines.length + " lines");
  }, function () {
    showCopyNotice("Not copied: the browser refused; use Cmd+C or Ctrl+C");
  });
}

// Copied inside the event: the clipboard accepts a write only close to the
// user's own gesture.
document.addEventListener("mouseup", copySelectedDiffText);
document.addEventListener("keyup", function (event) {
  if (event.key === "Shift") {
    copySelectedDiffText();
  }
});
// Cmd+C / Ctrl+C on a selection inside the diff: the same clean text.
document.addEventListener("copy", function (event) {
  var lines = selectedDiffLines();
  if (lines === null || !event.clipboardData) {
    return; // the browser's own copy
  }
  event.clipboardData.setData("text/plain", lines.join("\n"));
  event.preventDefault();
});

/* ============================== Selection & loading ======================= */

function pickLargestFile(files) {
  var best = null;
  var bestScore = -1;
  for (var i = 0; i < files.length; i++) {
    if (files[i].unshowable === true) {
      continue; // it has no patch to open
    }
    var score = (files[i].adds || 0) + (files[i].dels || 0);
    if (score > bestScore) { // strictly greater: ties keep the first in path order
      best = files[i];
      bestScore = score;
    }
  }
  return best;
}

function selectBranch(branchName) {
  if (branchName === selectedBranchName && selectedCommitSha === null) {
    // Clicking the open branch again refreshes it and keeps the open file.
    loadDiff();
    return;
  }
  selectedBranchName = branchName;
  selectedCommitSha = null;
  openSelection();
}

function selectCommit(sha) {
  selectedCommitSha = sha;
  selectedBranchName = null;
  openSelection();
}

// What selecting a branch or a commit shares, once the selection is set:
// everything the previous one opened is forgotten, then the view redraws.
function openSelection() {
  selectedFilePath = null;
  pendingLineJump = null;
  branchVanished = false;
  commitVanished = false;
  fileVanished = false;
  fileReloadDeferred = false;
  fileToRestore = null;
  restoringCommit = false;
  currentDiff = null;
  lastDiffJson = null;
  diffErrorText = null;
  currentFile = null;
  lastFileJson = null;
  fileErrorText = null;
  previousFileRowJson = null; // a fresh selection: no flash on its first file list
  commitMessageExpanded = false; // a fresh selection starts clipped
  rememberViewInAddress();
  updateSidebarSelection();
  updateTreeSelection();
  renderHeader();
  renderFileList();
  renderDiffPane();
  renderNetworkPane();
  loadDiff();
}

function selectFile(path) {
  if (pendingLineJump !== null && pendingLineJump.path !== path) {
    pendingLineJump = null; // another file was picked meanwhile
  }
  selectedFilePath = path;
  fileVanished = false;
  currentFile = null;
  lastFileJson = null;
  fileErrorText = null;
  rememberViewInAddress();
  updateFileSelection();
  renderDiffSticky();
  renderDiffBody(); // the old file's table goes; "Reading…" shows after 400 ms
  if (viewMode === "network") {
    fileReloadDeferred = true; // the diff pane is hidden: load when it shows
  } else {
    fileReloadDeferred = false;
    loadFile();
  }
}

// The diff and file a vanished branch or commit had open.
function forgetOpenedContent() {
  currentDiff = null;
  lastDiffJson = null;
  diffErrorText = null;
  currentFile = null;
  lastFileJson = null;
  fileErrorText = null;
  fileVanished = false;
  previousFileRowJson = null;
}

function handleBranchVanished() {
  selectedBranchName = null;
  selectedFilePath = null;
  branchVanished = true;
  fileReloadDeferred = false;
  rememberViewInAddress();
  forgetOpenedContent();
  updateSidebarSelection();
  updateTreeSelection();
  renderHeader();
  renderFileList();
  renderDiffPane();
  renderNetworkPane();
}

function handleCommitVanished() {
  // A commit named in the address that is gone: open a branch instead.
  var fallbackBranch = restoringCommit ? autoSelectBranch() : null;
  restoringCommit = false;
  if (fallbackBranch !== null) {
    selectBranch(fallbackBranch);
    return;
  }
  selectedCommitSha = null;
  selectedFilePath = null;
  commitVanished = true;
  fileReloadDeferred = false;
  rememberViewInAddress();
  forgetOpenedContent();
  updateTreeSelection();
  renderHeader();
  renderFileList();
  renderDiffPane();
  renderNetworkPane();
}
