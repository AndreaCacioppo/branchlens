      container.insertBefore(wanted[j], current);
    }
  }
}

function gateRowItem(check, view) {
  return rowItem("gate\u0000" + check.name, check, view.inProgress, function () {
    return makeGateRow(check, view);
  });
}

// What an LLM review row's look depends on besides its own data.
function reviewRowContext(view) {
  return [view.inProgress, reviewMerged(view.feed)];
}

function reviewerRowItem(reviewer, view) {
  return rowItem("review\u0000" + reviewerKey(reviewer.name), reviewer, reviewRowContext(view),
    function () {
      return makeReviewerRow(reviewer, view);
    });
}

function diveRowItem(path, entry, view) {
  return rowItem("file\u0000" + path, entry, reviewRowContext(view), function () {
    return makeDiveRow(path, entry, view);
  });
}

function stepRowItem(keyPrefix, step, view, runningWord) {
  return rowItem(keyPrefix + "\u0000" + step.name, step, reviewRowContext(view), function () {
    return makeStepRow(step, view, runningWord);
  });
}

/* ---- The timeline ---- */

function stageIsOpen(stage) {
  if (stage.rowCount === 0) {
    return true; // nothing to fold away
  }
  if (hasOwnKey(stageOpenChoice, stage.key)) {
    return stageOpenChoice[stage.key];
  }
  return stage.autoOpen;
}

// The frame every stage shares, built once: marker, head (a button that
// folds the stage), detail line, and a body. updateStageShell() fills it.
function makeStageShell(key) {
  var element = makeElement("section", "stage");
  element.tabIndex = -1; // focus can be put here, Tab never stops here
  var marker = makeText("span", "stage-marker", "");
  element.appendChild(marker);
  var head = makeElement("button", "stage-head");
  head.type = "button";
  var title = makeText("span", "stage-title", "");
  var status = makeElement("span", "stage-status");
  var caret = makeText("span", "stage-caret", "▾");
  head.appendChild(title);
  head.appendChild(status);
  head.appendChild(caret);
  element.appendChild(head);
  var detail = makeText("div", "stage-detail", "");
  element.appendChild(detail);
  var body = makeElement("div", "stage-body");
  element.appendChild(body);
  var shell = {
    element: element,
    marker: marker,
    head: head,
    title: title,
    status: status,
    caret: caret,
    detail: detail,
    body: body,
    stage: null,       // the stage last drawn
    statusKey: null,   // the status text and clock last drawn
    bodyKey: null      // the verdict body's inputs last drawn
  };
  head.addEventListener("click", function () {
    if (shell.stage === null || shell.stage.rowCount === 0) {
      return;
    }
    stageOpenChoice[key] = !stageIsOpen(shell.stage);
    renderCheckPanel();
  });
  return shell;
}

function updateStageShell(shell, stage) {
  var wasRunning = shell.stage !== null && shell.stage.state === "running";
  shell.stage = stage;
  var collapsible = stage.rowCount > 0;
  var open = stageIsOpen(stage);
  var className = "stage " + stage.state + (open ? "" : " collapsed");
  if (shell.element.className !== className) {
    shell.element.className = className;
  }
  setTextIfChanged(shell.marker, String(stage.number));
  if (stage.state === "running" && !wasRunning) {
    setSpinPhase(shell.marker);
  }
  shell.head.disabled = !collapsible;
  if (collapsible) {
    shell.head.setAttribute("aria-expanded", open ? "true" : "false");
  } else {
    shell.head.removeAttribute("aria-expanded");
  }
  shell.caret.hidden = !collapsible;
  setTextIfChanged(shell.title, stage.title);

  // The status text, then the stage's clock, counted up by tickLiveElapsed().
  var statusKey = stage.statusText + "\u0000" + String(stage.liveSince);
  if (shell.statusKey !== statusKey) {
    shell.statusKey = statusKey;
    clearNode(shell.status);
    shell.status.appendChild(document.createTextNode(stage.statusText));
    if (stage.liveSince !== null) {
      if (stage.statusText !== "") {
        shell.status.appendChild(document.createTextNode(" · "));
      }
      shell.status.appendChild(makeLiveElapsed(stage.liveSince));
    }
  }

  setTextIfChanged(shell.detail, stage.detail);
  if (shell.detail.title !== stage.detail) {
    shell.detail.title = stage.detail;
  }
  shell.detail.hidden = stage.detail === "";
}

function gateStageItems(stage, view) {
  var items = [];
  for (var i = 0; i < stage.rows.length; i++) {
    items.push(gateRowItem(stage.rows[i], view));
  }
  if (stage.rows.length === 0 && view.feed !== null && !view.inProgress) {
    items.push(textItem("empty", "stage-empty",
      "This run reported no individual checks."));
  }
  return items;
}

function reviewStageItems(stage, view) {
  var items = [];
  var i;

  if (stage.reviewers.length > 0) {
    items.push(textItem("reviewers", "stage-subhead", "CHECKLIST REVIEWERS · " +
      stage.reviewersDone + " OF " + stage.reviewers.length));
    items.push(textItem("candidates", "stage-note",
      "Reviewers and deep dives report candidates; up to 20 are verified " +
      "before the verdict, and the rest reach it unverified."));
    for (i = 0; i < stage.reviewers.length; i++) {
      items.push(reviewerRowItem(stage.reviewers[i], view));
    }
  }

  if (stage.filePaths.length > 0) {
    // The heading says how many files were reviewed when not all were.
    var reviewedCount = 0;
    for (i = 0; i < stage.filePaths.length; i++) {
      var status = view.feed.files[stage.filePaths[i]].status;
      if (status === "clean" || status === "findings") {
        reviewedCount = reviewedCount + 1;
      }
    }
    var label = "DEEP DIVES · " + stage.filePaths.length +
      (stage.filePaths.length === 1 ? " FILE" : " FILES");
    if (!view.inProgress && reviewedCount === 0) {
      label = label + " · NONE REVIEWED INDIVIDUALLY";
    } else if (!view.inProgress && reviewedCount < stage.filePaths.length) {
      label = label + " · " + reviewedCount + " REVIEWED";
    } else if (view.inProgress) {
      label = label + " · " + stage.filesRead + " READ";
      if (stage.filesSkipped > 0) {
        label = label + " · " + stage.filesSkipped + " NOT REVIEWED";
      }
    }
    items.push(textItem("files", "stage-subhead", label));
    for (i = 0; i < stage.filePaths.length; i++) {
      var path = stage.filePaths[i];
      items.push(diveRowItem(path, view.feed.files[path], view));
    }
  }

  // "dive" step events go under the file rows' heading.
  if (stage.diveSteps.length > 0) {
    if (stage.filePaths.length === 0) {
      items.push(textItem("dives", "stage-subhead",
        "DEEP DIVES · " + stage.diveSteps.length));
    }
    for (i = 0; i < stage.diveSteps.length; i++) {
      items.push(stepRowItem("dive", stage.diveSteps[i], view, "reading"));
    }
  }

  if (stage.verifications.length > 0) {
    items.push(textItem("verifications", "stage-subhead",
      "VERIFICATIONS · " + stage.verificationsDone + " OF " + stage.verifications.length));
    for (i = 0; i < stage.verifications.length; i++) {
      items.push(stepRowItem("verify", stage.verifications[i], view, "verifying"));
    }
  }

  if (stage.otherSteps.length > 0) {
    items.push(textItem("other", "stage-subhead", "OTHER STEPS"));
    for (i = 0; i < stage.otherSteps.length; i++) {
      var step = stage.otherSteps[i];
      items.push(stepRowItem("other\u0000" + String(step.stage), step, view, "running"));
    }
  }
  return items;
}

function nonEmptyString(value) {
  return typeof value === "string" && value !== "" ? value : null;
}

// What the shown run judged, as {branch, commit} (either may be null), or
// null when nothing is known. It comes from the server's "judged"; a run
// this server started that left no verdict.json still has its branch.
function judgedRun(view) {
  var judged = securityState !== null ? securityState.judged : null;
  if (judged) {
    var branch = nonEmptyString(judged.branch);
    var commit = nonEmptyString(judged.commit);
    if (branch !== null || commit !== null) {
      return { branch: branch, commit: commit };
    }
  }
  if (view.relation === "same" && view.runner.branch !== null) {
    return { branch: view.runner.branch, commit: null };
  }
  return null;
}

// The branch the shown run judged, when it is known.
function judgedBranchName(view) {
  var judged = judgedRun(view);
  return judged !== null ? judged.branch : null;
}

// True when the judged branch's tip is no longer the commit the run judged.
function judgedRunIsOutOfDate(view) {
  var judged = judgedRun(view);
  if (judged === null || judged.branch === null || judged.commit === null) {
    return false;
  }
  var branch = findBranchInState(judged.branch);
  return branch !== null && typeof branch.commit === "string" &&
    branch.commit !== judged.commit;
}

// A summary built from the run's data, not by parsing the pipeline's
// sentence: the numbers that decide whether to trust this run.
function verdictSummaryText(feed, gateStage, reviewStage) {
  var findings = feed.findings || [];
  var areas = feed.areas || [];
  var blockingFindings = countBlocking(findings);
  var blockingChecks = gateStage.blockingRows.length;
  // New non-blocking findings of the scanners, from verdict.json
  var checkAdvisory = typeof feed.mechanical_advisory === "number" ?
    feed.mechanical_advisory : 0;
  var parts = [];
  // PASSED is the mechanical checks' own word: no LLM review is in it.
  var mechanicalOnly = feed.verdict_word === "PASSED" || reviewStage.state === "skipped";
  if (mechanicalOnly) {
    parts.push("Mechanical checks only");
  }
  if (reviewStage.incomplete) {
    parts.push("LLM review incomplete");
  }
  if (blockingFindings > 0) {
    parts.push(pluralize(blockingFindings, "blocking finding", "blocking findings"));
  }
  if (blockingChecks > 0) {
    parts.push(pluralize(blockingChecks, "blocking check", "blocking checks"));
  }
  var reviewUnfinished = (reviewStage.state === "warn" && !reviewStage.incomplete) ||
    reviewStage.state === "stopped";
  if (blockingFindings === 0 && blockingChecks === 0) {
    if (findings.length > 0) {
      parts.push(pluralize(findings.length, "advisory finding", "advisory findings") +
        (checkAdvisory > 0 ? " from the LLM review" : ""));
    } else if (reviewUnfinished) {
      // The rows above may show candidate findings: none of them reached
      // the verdict.
      parts.push("review unfinished, its findings were not counted");
    } else if (checkAdvisory === 0) {
      parts.push("no findings");
    } else if (!mechanicalOnly) {
      parts.push("no review findings");
    }
    if (checkAdvisory > 0) {
      parts.push(pluralize(checkAdvisory, "advisory finding", "advisory findings") +
        " from the mechanical checks");
    }
  }
  // A PARTIAL area was examined in part; a NOT POSSIBLE one was not examined.
  var partialAreas = 0;
  for (var i = 0; i < areas.length; i++) {
    if (areas[i].status === "PARTIAL") {
      partialAreas = partialAreas + 1;
    }
  }
  var missedAreas = areas.length - partialAreas;
  if (missedAreas > 0) {
    parts.push(missedAreas === 1 ? "1 area not examined" :
      missedAreas + " areas not examined");
  }
  if (partialAreas > 0) {
    parts.push(partialAreas === 1 ? "1 area only partly examined" :
      partialAreas + " areas only partly examined");
  }
  var text = parts.join(" · ");
  return text.charAt(0).toUpperCase() + text.slice(1);
}

// Where a run that ended early stopped: "gate" (during the mechanical
// checks), "review" (during the LLM review), or null. A step still running
// after the run is over never finished, unless the LLM review merged: its
// step rows then only sent no final report. The toolkit records an
// interrupted or crashed gate as an area named exactly "Gate crash".
function endedEarlyStage(view, stages) {
  var areas = view.feed.areas || [];
  for (var i = 0; i < areas.length; i++) {
    if (areas[i].name === "Gate crash") {
      return "gate";
    }
  }
  if (stages.gate.state === "stopped" || hasRunningRow(stages.gate.rows)) {
    return "gate";
  }
  if (stages.review.state === "stopped") {
    return "review";
  }
  var reviewStepRunning = hasRunningRow(stages.review.reviewers) ||
    hasRunningRow(stages.review.diveSteps) || hasRunningRow(stages.review.verifications);
  if (reviewStepRunning && !reviewMerged(view.feed)) {
    return "review";
  }
  return null;
}

function hasRunningRow(rows) {
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].status === "running") {
      return true;
    }
  }
  return false;
}

// The amber note under the summary: why the LLM review is missing, or why
// the verdict covers less than it seems, and what to do next. Empty when
// there is nothing to add.
function verdictNoteText(view, stages) {
  var endedEarly = endedEarlyStage(view, stages);
  if (endedEarly === "gate") {
    return "This run ended during the mechanical checks, so the LLM review " +
      "did not run. The verdict covers only the checks that finished: run " +
      "the check again.";
  }
  if (endedEarly === "review") {
    return "This run ended during the LLM review. The verdict does not " +
      "cover the steps marked stopped: run the check again.";
  }
  if (stages.review.incomplete) {
    return "The LLM review did not cover everything (" +
      (view.feed.review_incomplete || "no reason recorded") + "), so this " +
      "verdict cannot unlock Push. Run the check again.";
  }
  if (stages.review.state !== "skipped") {
    return "";
  }
  // The pipeline closes the review with "not run: ..." when the mechanical
  // checks did not pass.
  if (phaseSaysNotRun(findPhase(view.feed, "review"))) {
    if (stages.gate.state === "blocked") {
      return "The LLM review did not run because a mechanical check blocks. " +
        "Fix what the blocking rows report, then run the check again.";
    }
    if (stages.gate.state === "warn") {
      return "The LLM review did not run because the mechanical checks were " +
        "inconclusive: something could not be fully examined (see NOT FULLY " +
        "EXAMINED below; edits not yet committed are one cause). Fix it, " +
        "then run the check again.";
    }
    return "The LLM review did not run because the mechanical checks did " +
      "not pass. Fix what they report, then run the check again.";
  }
  // A run of the mechanical checks alone, for example preflight.sh check.
  var nextStep = view.runner.available ?
    "Run security check runs the full pipeline, both stages." :
    "Run the full pipeline before publishing.";
  return "Only the mechanical checks ran: the LLM review did not, so " +
    "nothing read this code the way a reviewer would, and only READY TO " +
    "PUBLISH unlocks Push. " + nextStep;
}

// pushArea, when given, goes right under the summary.
function makeVerdictCard(view, stages, pushArea) {
  var feed = view.feed;
  var card = makeElement("div", "verdict-card " + stages.verdict.kind);

  // What was judged, against what, how long it took and when.
  var context = makeElement("div", "verdict-context");
  var branchName = judgedBranchName(view);
  if (branchName !== null) {
    context.appendChild(makeText("span", "mono", branchName));
    context.appendChild(document.createTextNode(feed.base ? " compared with " : ""));
  } else if (feed.base) {
    context.appendChild(document.createTextNode("Compared with "));
  }
  if (feed.base) {
    appendRunBase(context, feed.base, branchName);
  }
  var startedMs = parseUtcMs(feed.started_utc);
  var lastMs = parseUtcMs(feed.last_utc);
  if (startedMs !== null && lastMs !== null && lastMs >= startedMs) {
    context.appendChild(document.createTextNode(
      " · took " + formatDuration(Math.floor((lastMs - startedMs) / 1000))));
  }
  if (typeof feed.last_utc === "string") {
    context.appendChild(document.createTextNode(" · "));
    var when = makeText("span", "rel-time", relativeTime(feed.last_utc));
    when.setAttribute("data-when", feed.last_utc);
    context.appendChild(when);
  }
  card.appendChild(context);

  // The branch has moved since: this verdict is about an older commit.
  var judged = judgedRun(view);
  if (judgedRunIsOutOfDate(view)) {
    var nowBranch = findBranchInState(judged.branch);
    card.appendChild(makeText("div", "console-note",
      "Out of date: " + judged.branch + " has moved since this check " +
      "(checked " + judged.commit.slice(0, 7) + ", now " +
      nowBranch.commit.slice(0, 7) + "). Run the check again."));
  }

  card.appendChild(makeText("div", "verdict-word", feed.verdict_word || "Finished"));
  card.appendChild(makeText("div", "verdict-summary",
    verdictSummaryText(feed, stages.gate, stages.review)));
  if (pushArea) {
    card.appendChild(pushArea);
  }

  var noteText = verdictNoteText(view, stages);
  if (noteText !== "") {
    card.appendChild(makeText("div", "console-note", noteText));
  }

  if (feed.verdict) {
    // the pipeline's own sentence, verbatim, below the summary
    card.appendChild(makeText("div", "verdict-line", feed.verdict));
  }

  // What blocks: findings from the review, and gate checks that block
  // (a gate failure has no findings at all, only checks).
  var findings = feed.findings || [];
  var blockingTotal = countBlocking(findings) + stages.gate.blockingRows.length;
  if (blockingTotal > 0) {
    card.appendChild(makeText("div", "verdict-section-label",
      "BLOCKING · " + blockingTotal));
    for (var i = 0; i < findings.length; i++) {
      if (findings[i].blocking === true) {
        card.appendChild(makeFindingRow(findings[i], i));
      }
    }
    for (var j = 0; j < stages.gate.blockingRows.length; j++) {
      card.appendChild(makeGateRow(stages.gate.blockingRows[j], view));
    }
  }
  var advisoryCount = findings.length - countBlocking(findings);
  if (advisoryCount > 0) {
    card.appendChild(makeText("div", "verdict-section-label",
      "ADVISORY · " + advisoryCount));
    for (var k = 0; k < findings.length; k++) {
      if (findings[k].blocking !== true) {
        card.appendChild(makeFindingRow(findings[k], k));
      }
    }
  }

  // Areas that could not be examined, or only in part.
  var areas = feed.areas || [];
  if (areas.length > 0) {
    card.appendChild(makeText("div", "verdict-section-label", "NOT FULLY EXAMINED"));
    var toggle = makeText("button", "console-link",
      (areasExpanded ? "▴ hide " : "▾ show ") + pluralize(areas.length, "area", "areas"));
    toggle.type = "button";
    toggle.setAttribute("data-focus-key", "areas");
    toggle.setAttribute("aria-expanded", areasExpanded ? "true" : "false");
    toggle.addEventListener("click", function () {
      areasExpanded = !areasExpanded;
      renderCheckPanel();
    });
    card.appendChild(toggle);
    if (areasExpanded) {
      for (var a = 0; a < areas.length; a++) {
        var areaRow = makeElement("div", "check-area-row");
        areaRow.appendChild(makeText("span", "check-area-name", areas[a].name));
        // "partial" or "not examined", with the gate rows' chip
        areaRow.appendChild(makeResultChip({ result: areas[a].status }));
        card.appendChild(areaRow);
        card.appendChild(makeText("div", "check-area-reason",
          areas[a].reason || "(no reason recorded)"));
      }
    }
  }
  return card;
}

// True when this server's last push sent the commit the check judged and
// the branch is still at that commit.
function pushedJudgedCommit(view, push) {
  var judged = judgedRun(view);
  return push.pushed === true && push.allowed !== true && judged !== null &&
    judged.commit !== null && push.commit === judged.commit;
}

function makePushArea(view) {
  var push = securityState !== null && securityState.push ? securityState.push : null;
  if (push === null) {
    return null;
  }
  var branchName = typeof push.branch === "string" && push.branch !== "" ?
    push.branch : null;
  var remoteName = typeof push.remote === "string" && push.remote !== "" ?
    push.remote : null;
  var area = makeElement("div", "push-area");

  var button = makeElement("button", "console-button primary wide");
  button.type = "button";
  button.setAttribute("data-focus-key", "push");
  if (pendingAction === "push") {
    button.appendChild(document.createTextNode("Pushing…"));
  } else if (branchName !== null && pushedJudgedCommit(view, push)) {
    button.appendChild(document.createTextNode("Pushed "));
    button.appendChild(makeText("span", "mono", branchName));
    button.appendChild(document.createTextNode(" to " + (remoteName || "its remote")));
  } else if (branchName !== null) {
    button.appendChild(document.createTextNode("Push "));
    button.appendChild(makeText("span", "mono", branchName));
    button.appendChild(document.createTextNode(" to " + (remoteName || "its remote")));
  } else {
    button.appendChild(document.createTextNode("Push"));
  }
  button.disabled = serverRestarted || securityUnreadable() ||
    !(push.allowed === true && pendingAction === null && !view.inProgress &&
      branchName !== null);
  button.addEventListener("click", function () {
    pushBranch(branchName, remoteName);
  });
  area.appendChild(button);

  // Why the button is disabled, or what a click will do. When the server
  // allows the push but a check is starting or running, its "Will run git
  // push ..." line is replaced.
  var reasonText = typeof push.reason === "string" ? push.reason : "";
  if (serverRestarted) {
    reasonText = RESTARTED_REASON;
  } else if (securityUnreadable() && pendingAction !== "push") {
    reasonText = securityUnreadableText();
  } else if (push.allowed === true && button.disabled && pendingAction !== "push") {
    reasonText = "A security check is running: push once it has finished.";
  }
  if (reasonText !== "") {
    area.appendChild(makeText("div", "push-reason", reasonText));
  }
  if (pushMessage !== "") {
    area.appendChild(makeText("div", "console-message", pushMessage));
  }
  // After a push: a failure shows git's words at once; a success keeps
  // them folded under a link.
  if (push.pushed === false) {
    area.appendChild(makeText("div", "push-result", "The push did not go through."));
  }
  if (typeof push.pushed === "boolean" && push.output) {
    var outputOpen = push.pushed === false || pushOutputOpen;
    if (push.pushed === true) {
      var toggle = makeText("button", "console-link push-output-toggle",
        outputOpen ? "▴ hide git's output" : "▾ show git's output");
      toggle.type = "button";
      toggle.setAttribute("data-focus-key", "push-output");
      toggle.setAttribute("aria-expanded", outputOpen ? "true" : "false");
      toggle.addEventListener("click", function () {
        pushOutputOpen = !pushOutputOpen;
        renderCheckPanel();
      });
      area.appendChild(toggle);
    }
    if (outputOpen) {
      area.appendChild(makeText("pre", "console-log", String(push.output)));
    }
  }
  return area;
}

// The verdict stage's body: the verdict card or a line saying where it
// will be, and the push area.
function fillVerdictBody(body, stages, view) {
  var stage = stages.verdict;
  var pushArea = makePushArea(view);
  // A push that can be made, or was just made, sits under the summary; one
  // that cannot stays below the findings that explain why.
  var push = securityState !== null ? securityState.push : null;
  var pushOnTop = pushArea !== null && stage.hasVerdict &&
    (push.allowed === true || pushedJudgedCommit(view, push));
  if (stage.hasVerdict) {
    body.appendChild(makeVerdictCard(view, stages, pushOnTop ? pushArea : null));
  } else if (view.stopped) {
    body.appendChild(makeText("div", "stage-empty",
      "The run stopped before reaching a verdict."));
  } else if (view.inProgress && stage.state === "running") {
    body.appendChild(makeText("div", "stage-empty",
      "The review has finished; the verdict appears here once the pipeline " +
      "has checked it."));
  } else if (view.inProgress) {
    body.appendChild(makeText("div", "stage-empty",
      "The verdict appears here when the review finishes."));
  }
  if (pushArea !== null && !pushOnTop) {
    body.appendChild(pushArea);
  }
}

// Builds the verdict body again when bodyKey (what it is drawn from) has
// changed, and gives focus back to the control that had it.
function updateVerdictBody(shell, stages, view, bodyKey) {
  if (shell.bodyKey === bodyKey) {
    return;
  }
  shell.bodyKey = bodyKey;
  var focused = document.activeElement;
  var hadFocus = focused !== null && shell.body.contains(focused);
  var focusKey = hadFocus ? focused.getAttribute("data-focus-key") : null;
  clearNode(shell.body);
  fillVerdictBody(shell.body, stages, view);
  if (!hadFocus) {
    return;
  }
  // the rebuilt finding rows become focusable here
  refreshCheckFileLinks();
  var again = focusKey !== null ?
    shell.body.querySelector("[data-focus-key=\"" + focusKey + "\"]") : null;
  if (again !== null) {
    again.focus();
  }
  if (again === null || document.activeElement !== again) {
    // gone, or disabled (Push while it runs): the stage keeps the focus
    shell.element.focus();
  }
}

// What the verdict body shows while a run is going: the waiting line and
// the push area. Once the run is over, the whole timeline key is used.
function runningVerdictBodyKey(view, stages) {
  return JSON.stringify([
    view.inProgress, view.stopped, stages.verdict.hasVerdict, stages.verdict.state,
    securityState !== null ? securityState.push : null,
    pendingAction, pushMessage, pushOutputOpen, serverRestarted, judgedRun(view),
    securityUnreadable() ? securityMissText : null
  ]);
}

// The line over a finished run's stages: "Last check of feature, 3 hours
// ago", and whether that is another branch than the Run card's.
function updateLastCheckLine(line, view) {
  line.hidden = !(view.feed !== null && !view.inProgress);
  if (line.hidden) {
    return;
  }
  var branchName = judgedBranchName(view);
  var target = targetBranch();
  var lineKey = JSON.stringify([branchName, view.feed.last_utc,
    target !== null ? target.name : null]);
  if (line.lineKey === lineKey) {
    return;
  }
  line.lineKey = lineKey;
  clearNode(line);
  line.appendChild(document.createTextNode("Last check"));
  if (branchName !== null) {
    line.appendChild(document.createTextNode(" of "));
    line.appendChild(makeText("span", "mono", branchName));
  }
  if (typeof view.feed.last_utc === "string") {
    line.appendChild(document.createTextNode(", "));
    var when = makeText("span", "rel-time", relativeTime(view.feed.last_utc));
    when.setAttribute("data-when", view.feed.last_utc);
    line.appendChild(when);
  }
  if (branchName !== null && target !== null && target.name !== branchName) {
    line.appendChild(makeText("span", "check-last-other",
      " (not the branch selected above)"));
  }
}

// The feed this server watches, at all times: "Watching <feed path>.", or
// "Watching <feed path>: no run recorded there yet." while it holds no run.
function updateFeedLine(line, view) {
  var feedPath = securityState !== null ? securityState.feed_path : null;
  line.hidden = typeof feedPath !== "string";
  if (line.hidden) {
    return;
  }
  var holdsNoRun = view.feed === null && !view.inProgress;
  var lineKey = JSON.stringify([feedPath, holdsNoRun]);
  if (line.lineKey === lineKey) {
    return;
  }
  line.lineKey = lineKey;
  clearNode(line);
  line.appendChild(document.createTextNode("Watching "));
  line.appendChild(makeText("span", "mono", feedPath));
  line.appendChild(document.createTextNode(holdsNoRun ? ": no run recorded there yet." : "."));
}

// The timeline's lasting parts, built once under the Run card.
function buildTimelineParts(timeline) {
  var parts = {
    empty: makeText("div", "check-empty",
      "No security check has run for this repository yet. When one runs, its " +
      "progress and results appear here."),
    feedLine: makeElement("div", "check-feed"),
    lastLine: makeElement("div", "check-last"),
    gate: makeStageShell("gate"),
    review: makeStageShell("review"),
    verdict: makeStageShell("verdict")
  };
  timeline.appendChild(parts.empty);
  timeline.appendChild(parts.feedLine);
  timeline.appendChild(parts.lastLine);
  timeline.appendChild(parts.gate.element);
  timeline.appendChild(parts.review.element);
  timeline.appendChild(parts.verdict.element);
  return parts;
}

// Brings the timeline up to date in place. timelineKey is everything it is
// drawn from (see renderCheckPanel).
function updateCheckTimeline(view, stages, timelineKey) {
  var parts = timelineParts;
  var nothingYet = view.feed === null && !view.inProgress && !view.runner.available;
  parts.empty.hidden = !nothingYet;
  parts.gate.element.hidden = nothingYet;
  parts.review.element.hidden = nothingYet;
  parts.verdict.element.hidden = nothingYet;
  updateFeedLine(parts.feedLine, view);
  if (nothingYet) {
    parts.lastLine.hidden = true;
    return;
  }
  // A new run starts from empty bodies, so none of its rows flashes.
  if (timelineRunKey !== currentRunKey) {
    timelineRunKey = currentRunKey;
    clearNode(parts.gate.body);
    clearNode(parts.review.body);
  }
  updateLastCheckLine(parts.lastLine, view);
  updateStageShell(parts.gate, stages.gate);
  syncRows(parts.gate.body, gateStageItems(stages.gate, view));
  updateStageShell(parts.review, stages.review);
  syncRows(parts.review.body, reviewStageItems(stages.review, view));
  updateStageShell(parts.verdict, stages.verdict);
  updateVerdictBody(parts.verdict, stages, view,
    view.inProgress ? runningVerdictBodyKey(view, stages) : timelineKey);
}

/* ---- The Run card ---- */

function findBranchInState(name) {
  if (!currentState || name === null) {
    return null;
  }
  for (var i = 0; i < currentState.branches.length; i++) {
    if (currentState.branches[i].name === name) {
      return currentState.branches[i];
    }
  }
  return null;
}

// The branch a click on Run would check: the one selected in the Branches
// list, else the one checked out where BranchLens was started.
function targetBranch() {
  if (!currentState) {
    return null;
  }
  var selected = findBranchInState(selectedBranchName);
  if (selected !== null) {
    return selected;
  }
  for (var i = 0; i < currentState.branches.length; i++) {
    if (currentState.branches[i].is_current) {
      return currentState.branches[i];
    }
  }
  return null;
}

/* CHECK-EXTRACT-BEGIN (pure function, no DOM; test.sh runs it under node) */

// One word for a POSIX shell: bare when every character is safe, else in
// single quotes. "=" is not bare: zsh expands a word that starts with it.
function shellWord(text) {
  if (/^[A-Za-z0-9._\/@+,-]+$/.test(text)) {
    return text;
  }
  return "'" + text.replace(/'/g, "'\\''") + "'";
}

/* CHECK-EXTRACT-END */

// After this long without a feed event, a check started outside the page
// no longer blocks Run: Run asks first, then starts a new check.
var STALLED_FEED_MINUTES = 10;

// Whole minutes since the feed's last event, or null without a stamp.
function feedSilentMinutes(feed) {
  var lastMs = feed !== null ? parseUtcMs(feed.last_utc) : null;
  if (lastMs === null) {
    return null;
  }
  return Math.max(0, Math.floor((Date.now() - lastMs) / 60000));
}

// Whether Run can be clicked and, when not, the one line that says why.
// stalledMinutes is set when Run would start a check while one started
// outside the page has gone silent.
function runButtonState(view, target) {
  if (serverRestarted) {
    return { enabled: false, reason: RESTARTED_REASON };
  }
  if (securityUnreadable()) {
    return { enabled: false, reason: "" }; // the Run card's message says why
  }
  if (!view.runner.available) {
    return { enabled: false,
             reason: view.runner.unavailableReason ||
               "Running a check needs the toolkit: start BranchLens with --toolkit PATH." };
  }
  var stalledMinutes = null;
  if (view.inProgress) {
    // This server's own run shows Cancel, so a run here was started
    // elsewhere, for example from a terminal.
    if (view.runner.active) {
      return { enabled: false, reason: "A check is already running." };
    }
    stalledMinutes = feedSilentMinutes(view.feed);
    if (stalledMinutes === null || stalledMinutes < STALLED_FEED_MINUTES) {
      return { enabled: false,
               reason: "A check started outside this page is running: wait for it to finish." };
    }
  }
  if (pendingAction === "push") {
    return { enabled: false, reason: "A push is in progress." };
  }
  if (pendingAction === "cancel") {
    return { enabled: false, reason: "Stopping the check…" };
  }
  if (pendingAction === "run") {
    return { enabled: false, reason: "" }; // the button itself reads "Starting…"
  }
  if (target === null) {
    return { enabled: false, reason: "Pick a branch in the Branches tab first." };
  }
  if (target.worktree_path === null) {
    // command: shown after the reason, in monospace; a branch name can hold
    // characters a shell would run
    return { enabled: false,
             reason: "This branch is not open in any folder, and the check runs " +
               "in one. From the repository, open it with:",
             command: "git worktree add " +
               shellWord("../" + target.name.replace(/\//g, "-")) + " " +
               shellWord(target.name) };
  }
  if (stalledMinutes !== null) {
    return { enabled: true, stalledMinutes: stalledMinutes,
             reason: "A check started outside this page has reported nothing for " +
               stalledMinutes + " min. Run starts a new one; it asks first." };
  }
  return { enabled: true, reason: "" };
}

// The Run card's hint when Run would find nothing to judge: the default
// branch, with no commit that its online copy lacks and no base picked in
// the Tree, is checked against that copy. "" when that is not the case.
function emptyRangeHint(target) {
  if (target === null || baseSha !== null || !target.is_default || currentState === null) {
    return "";
  }
  if (currentState.default_synced_online !== true || currentState.first_publish === true) {
    return "";
  }
  // ahead counts against origin's copy; Run's default is the push remote's
  if (typeof currentState.push_remote === "string" && currentState.push_remote !== "origin") {
    return "";
  }
  if (target.ahead !== 0) {
    return "";
  }
  return target.name + " has no commits that " + defaultRunBase(target) + " lacks, so " +
    "a check against it has nothing to judge. To check the whole history of " +
    target.name + ", pick “compare from the beginning” at the bottom of the Tree.";
}

function buildRunCard() {
  var card = makeElement("section", "run-card");

  var top = makeElement("div", "run-card-top");
  var lead = makeText("span", "run-card-lead", "");
  var branch = makeText("span", "run-card-branch mono", "");
  var change = makeText("button", "console-link", "change");
  change.type = "button";
  change.title = "Pick another branch in the Branches tab; this tab comes back after the pick";
  change.addEventListener("click", function () {
    switchView("branches");
    returnToCheckAfterPick = true;
    branchListElement.focus(); // this button is now hidden
  });
  top.appendChild(lead);
  top.appendChild(branch);
  top.appendChild(change);
  card.appendChild(top);

  var base = makeElement("div", "run-card-base");
  card.appendChild(base);
  // The gate records uncommitted files (untracked ones too) as work it
  // could not examine: the verdict is INCONCLUSIVE and the LLM review is
  // skipped.
  var note = makeText("div", "console-note",
    "This branch has edits that are not committed. The check judges commits " +
    "only: while such edits exist it ends INCONCLUSIVE, skips the LLM review " +
    "and cannot unlock Push. Commit them (or move them aside) first.");
  note.hidden = true;
  card.appendChild(note);
  // Shown when the default branch has nothing its online copy lacks (emptyRangeHint).
  var emptyRangeNote = makeText("div", "console-note", "");
  emptyRangeNote.hidden = true;
  card.appendChild(emptyRangeNote);

  var actions = makeElement("div", "run-card-actions");
  var runButton = makeText("button", "console-button primary", "Run security check");
  runButton.type = "button";
  runButton.addEventListener("click", startRun);
  var cancelButton = makeText("button", "console-button secondary", "Cancel");
  cancelButton.type = "button";
  cancelButton.hidden = true;
  cancelButton.addEventListener("click", cancelRun);
  var clock = makeText("span", "run-card-clock", "");
  actions.appendChild(runButton);
  actions.appendChild(cancelButton);
  actions.appendChild(clock);
  card.appendChild(actions);
  var reason = makeText("div", "run-card-reason", "");
  reason.hidden = true;
  card.appendChild(reason);

  var message = makeText("div", "console-message", "");
  message.hidden = true;
  card.appendChild(message);

  var meter = makeElement("div", "run-meter");
  meter.hidden = true;
  var segments = {};
  var segmentKeys = ["gate", "review", "verdict"];
  for (var i = 0; i < segmentKeys.length; i++) {
    var segment = makeElement("div", "run-meter-segment " + segmentKeys[i]);
    var fill = makeElement("div", "run-meter-fill");
    segment.appendChild(fill);
    meter.appendChild(segment);
    segments[segmentKeys[i]] = { key: segmentKeys[i], element: segment, fill: fill };
  }
  card.appendChild(meter);

  var logToggle = makeText("button", "console-link run-card-log-toggle", "");
  logToggle.type = "button";
  logToggle.hidden = true;
  logToggle.addEventListener("click", function () {
    runLogOpen = !runCard.logIsOpen;
    updateRunCard();
  });
  card.appendChild(logToggle);
  var log = makeElement("pre", "console-log");
  log.hidden = true;
  card.appendChild(log);

  var timeline = makeElement("div", "check-timeline");
  timelineParts = buildTimelineParts(timeline);
  checkListElement.appendChild(card);
  checkListElement.appendChild(timeline);

  runCard = {
    lead: lead,
    branch: branch,
    change: change,
    base: base,
    note: note,
    emptyRangeNote: emptyRangeNote,
    runButton: runButton,
    cancelButton: cancelButton,
    reason: reason,
    clock: clock,
    message: message,
    meter: meter,
    segments: segments,
    logToggle: logToggle,
    log: log,
    logIsOpen: false,
    timeline: timeline
  };
}

// Text and attributes are only written when they differ, so an update
// that changes nothing leaves the card, its focus and its animations alone.
function setTextIfChanged(element, text) {
  if (element.textContent !== text) {
    element.textContent = text;
  }
}

function setMeterSegment(segment, stage) {
  var className = "run-meter-segment " + segment.key + " " + stage.state;
  if (segment.element.className !== className) {
    segment.element.className = className;
  }
  var fraction = Math.max(0, Math.min(1, stage.fraction));
  var width = Math.round(fraction * 100) + "%";
  if (segment.fill.style.width !== width) {
    segment.fill.style.width = width;
  }
  var title = stage.title + (stage.statusText ? ": " + stage.statusText : "");
  if (segment.element.title !== title) {
    segment.element.title = title;
  }
}

function updateRunCard() {
  if (runCard === null) {
    return;
  }
  var view = buildRunView();
  updateRunCardWith(view, buildStages(view));
}

function updateRunCardWith(view, stages) {
  forgetChoicesIfNewRun(view);
  var runner = view.runner;
  var target = targetBranch();
  var shownBranch;
  var baseLabel;

  if (view.inProgress) {
    // While a check runs the card follows the run, not the selection.
    var runningName = runner.active ? runner.branch : null;
    setTextIfChanged(runCard.lead, runningName !== null ? "Checking" : "A check is running");
    setTextIfChanged(runCard.branch, runningName || "");
    runCard.branch.title = runningName || "";
    runCard.branch.className = "run-card-branch mono";
    runCard.change.hidden = true;
    shownBranch = findBranchInState(runningName);
    if (view.feed !== null && view.feed.base) {
      baseLabel = view.feed.base;
    } else if (runner.active) {
      // before the run's first feed event: the base the server started it with
      baseLabel = runner.base !== null ? runner.base : defaultRunBase(shownBranch);
    } else {
      baseLabel = "";
    }
  } else {
    setTextIfChanged(runCard.lead, "");
    setTextIfChanged(runCard.branch, target !== null ? target.name : "No branch selected");
    runCard.branch.title = target !== null ? target.name : "";
    runCard.branch.className = target !== null ? "run-card-branch mono" : "run-card-branch none";
    runCard.change.hidden = false;
    shownBranch = target;
    baseLabel = defaultRunBase(target);
    if (baseSha !== null) {
      baseLabel = baseSha; // Run sends the base picked in the Tree
    }
  }
  runCard.lead.hidden = runCard.lead.textContent === "";

  var shownBranchName = shownBranch !== null ? shownBranch.name : null;
  var baseKey = baseLabel || "";
  // The words also change with the branch (a first publish) and once the
  // graph knows a picked commit's subject.
  var baseCardKey = baseKey === "" ? "" : baseKey + "\u0000" + runBaseText(baseKey, shownBranchName);
  if (runCard.base.dataset.label !== baseCardKey) {
    runCard.base.dataset.label = baseCardKey;
    clearNode(runCard.base);
    if (baseKey !== "") {
      runCard.base.appendChild(document.createTextNode("compared with "));
      appendRunBase(runCard.base, baseKey, shownBranchName);
      runCard.base.title = "compared with " + runBaseText(baseKey, shownBranchName);
    } else {
      runCard.base.title = "";
    }
    if (baseKey === EMPTY_TREE_BASE && isFirstPublishRun(shownBranchName)) {
      runCard.base.appendChild(document.createTextNode(": the whole history is checked"));
    }
  }
  runCard.note.hidden = !(shownBranch !== null && shownBranch.has_uncommitted);
  var emptyRangeText = view.inProgress ? "" : emptyRangeHint(target);
  setTextIfChanged(runCard.emptyRangeNote, emptyRangeText);
  runCard.emptyRangeNote.hidden = emptyRangeText === "";

  // Run while idle; Cancel while this server's own run is going. A run
  // started elsewhere cannot be cancelled from here, so Run stays, disabled.
  var showCancel = runner.active;
  var runState = runButtonState(view, target);
  runCard.runButton.hidden = showCancel;
  runCard.runButton.disabled = !runState.enabled;
  setTextIfChanged(runCard.runButton,
    pendingAction === "run" ? "Starting…" : "Run security check");
  runCard.cancelButton.hidden = !showCancel;
  runCard.cancelButton.disabled = pendingAction !== null;
  setTextIfChanged(runCard.cancelButton,
    pendingAction === "cancel" ? "Cancelling…" : "Cancel");
  var reasonKey = showCancel ? "" : runState.reason + "\u0000" + (runState.command || "");
  if (runCard.reasonKey !== reasonKey) {
    runCard.reasonKey = reasonKey;
    clearNode(runCard.reason);
    if (!showCancel) {
      runCard.reason.appendChild(document.createTextNode(runState.reason));
      if (runState.command) {
        runCard.reason.appendChild(document.createTextNode(" "));
        runCard.reason.appendChild(makeText("span", "mono", runState.command));
      }
    }
  }
  runCard.reason.hidden = runCard.reason.textContent === "";

  // The elapsed time, counted up by tickLiveElapsed().
  var sinceMs = null;
  if (view.inProgress) {
    sinceMs = runner.active && runner.startedMs !== null ? runner.startedMs :
      (view.feed !== null ? parseUtcMs(view.feed.started_utc) : null);
  }
  if (sinceMs !== null) {
    runCard.clock.className = "run-card-clock live-elapsed";
    runCard.clock.dataset.since = String(sinceMs);
    runCard.clock.title = "Time since the check started";
    setTextIfChanged(runCard.clock, formatElapsedSince(sinceMs));
  } else {
    runCard.clock.className = "run-card-clock";
    runCard.clock.removeAttribute("data-since");
    runCard.clock.title = "";
    setTextIfChanged(runCard.clock, "");
  }

  var exitText = runner.exitCode !== null ? " (exit code " + runner.exitCode + ")" : "";
  var message = runMessage;
  if (message === "" && securityUnreadable()) {
    message = securityUnreadableText();
  } else if (message === "" && view.failedEarly) {
    message = "The last run stopped before its first check" + exitText +
      ". Its output is below.";
  } else if (message === "" && view.stopped && view.relation === "same") {
    message = "The run stopped before reaching a verdict" + exitText + ".";
  } else if (message === "" && view.stopped) {
    // Not this server's run: the exit code above belongs to another one.
    message = "The last check, started outside this page, stopped reporting " +
      "without a verdict.";
  }
  setTextIfChanged(runCard.message, message);
  runCard.message.hidden = message === "";

  runCard.meter.hidden = !(view.inProgress || view.feed !== null);
  setMeterSegment(runCard.segments.gate, stages.gate);
  setMeterSegment(runCard.segments.review, stages.review);
  setMeterSegment(runCard.segments.verdict, stages.verdict);

  // The run's own output: folded away unless the run went wrong.
  var logText = runner.logText;
  // Opened on its own only when the output is from the run that went wrong.
  var logOpen = runLogOpen !== null ? runLogOpen :
    (view.failedEarly || (view.stopped && view.relation === "same"));
  runCard.logIsOpen = logOpen;
  runCard.logToggle.hidden = logText === "";
  setTextIfChanged(runCard.logToggle,
    logOpen ? "▴ hide the run's output" : "▾ show the run's output");
  runCard.logToggle.setAttribute("aria-expanded", logOpen ? "true" : "false");
  var logWasHidden = runCard.log.hidden;
  var logWasAtBottom = runCard.log.scrollHeight - runCard.log.scrollTop -
    runCard.log.clientHeight < 4;
  runCard.log.hidden = !logOpen || logText === "";
  var logChanged = runCard.log.textContent !== logText;
  if (logChanged) {
    runCard.log.textContent = logText;
  }
  // It is a tail: it opens at its end, and new lines keep it there unless
  // the reader has scrolled up.
  if (!runCard.log.hidden && (logWasHidden || (logChanged && logWasAtBottom))) {
    runCard.log.scrollTop = runCard.log.scrollHeight;
  }
}

/* ---- Actions: Run, Cancel, Push ---- */

function requestErrorText(result) {
  if (result.body && result.body.error) {
    return String(result.body.error);
  }
  return "the server answered with status " + result.status + ".";
}

// Called when an action's POST has returned. A failure ends the pending
// state right away; a success waits for the next /api/security answer.
function finishAction(succeeded) {
  if (succeeded) {
    pendingActionDoneAt = Date.now();
  } else {
    pendingAction = null;
    pendingActionDoneAt = null;
  }
  updateRunCard();
  if (viewMode === "check") {
    renderCheckPanel();
  }
  pollSecurity();
}

// What Run does, shown in its confirm dialog.
var RUN_CONSENT_LINES = [
  "- It runs this branch's own build and tests on this machine, with your rights.",
  "- It starts a Claude Code session with shell access, on your Claude account.",
  "- It takes about 5 to 15 minutes and costs money (Claude usage).",
  "- It sends the diff and every file the review reads to Claude.",
  "- You can cancel it at any time."
];

// More lines for Run's confirm dialog when the base needs them: what judging
// from nothing means, and how a commit on another line of history is used.
function runBaseConsentLines(base, target) {
  if (base === EMPTY_TREE_BASE) {
    return "\n- Compared with nothing, every commit and every file of " + target.name +
      " counts as new: the run takes longer and also reports problems older " +
      "work left behind.";
  }
  if (COMMIT_ID_PATTERN.test(base) && selectedBranchName === target.name &&
      currentDiff !== null && currentDiff.base_override === true &&
      currentDiff.base_is_ancestor === false) {
    return "\n- " + base.slice(0, 7) + " is not on the line of history of " + target.name +
      ": the check judges the commits of " + target.name + " since the point where " +
      "the two lines meet.";
  }
  return "";
}

function startRun() {
  var view = buildRunView();
  var target = targetBranch();
  var state = runButtonState(view, target);
  if (!state.enabled) {
    return;
  }
  // The base the page shows: a commit or the empty tree picked in the Tree,
  // else the default the Run card names.
  var base = baseSha !== null ? baseSha : defaultRunBase(target);
  var comparedWith = "compared with " + runBaseText(base, target.name);
  // asks first, so a click begun on another page cannot start a run
  var question = typeof state.stalledMinutes === "number" ?
    "A check started outside this page has reported nothing for " +
      state.stalledMinutes + " min. Start a new security check on " +
      target.name + ", " + comparedWith + ", anyway?" :
    "Run the security check on " + target.name + ", " + comparedWith + "?";
  question = question + "\n\n" + RUN_CONSENT_LINES.join("\n") +
    runBaseConsentLines(base, target);
  if (!window.confirm(question)) {
    return;
  }
  pendingAction = "run";
  pendingActionDoneAt = null;
  runMessage = "";
  updateRunCard();
  // Only a base picked in the Tree is sent; without one, the server picks
  // the default that defaultRunBase names.
  var body = { branch: target.name };
  if (baseSha !== null) {
    body.base = baseSha;
  }
  if (typeof state.stalledMinutes === "number") {
    // the user confirmed; the server measures the silence again itself
    body.override_stalled = true;
  }
  postJson("/api/run", body).then(function (result) {
    if (!result.ok) {
      runMessage = "Could not start the check: " + requestErrorText(result);
      announce(runMessage);
    }
    finishAction(result.ok);
  }).catch(function () {
    runMessage = "Could not reach the local server to start the check.";
    announce(runMessage);
    finishAction(false);
  });
}

function cancelRun() {
  if (pendingAction !== null) {
    return;
  }
  var runner = runnerInfo();
  var question = "Stop the security check" +
    (runner.branch !== null ? " running on " + runner.branch : "") + "?";
  if (!window.confirm(question)) {
    return;
  }
  pendingAction = "cancel";
  pendingActionDoneAt = null;
  runMessage = "";
  updateRunCard();
  postJson("/api/cancel", {}).then(function (result) {
    if (!result.ok) {
      runMessage = "Could not cancel the check: " + requestErrorText(result);
    } else if (result.body && result.body.cancelled === false) {
      runMessage = "There was nothing to cancel: the check had already ended.";
    }
    if (runMessage !== "") {
      announce(runMessage);
    }
    finishAction(result.ok);
  }).catch(function () {
    runMessage = "Could not reach the local server to cancel the check.";
    announce(runMessage);
    finishAction(false);
  });
}

// The one action that writes, so it asks first. The server checks every
// condition again.
function pushBranch(branchName, remoteName) {
  if (pendingAction !== null || branchName === null) {
    return;
  }
  var question = "Push " + branchName + " to " + (remoteName || "its remote") +
    "?\n\nThis publishes the branch's commits. It is the one thing " +
    "BranchLens ever writes.";
  if (!window.confirm(question)) {
    return;
  }
  pendingAction = "push";
  pendingActionDoneAt = null;
  pushMessage = "";
  renderCheckPanel();
  postJson("/api/push", { branch: branchName }).then(function (result) {
    if (!result.ok) {
      pushMessage = "Could not push: " + requestErrorText(result);
      announce(pushMessage);
    } else if (result.body && result.body.pushed === true) {
      announce("Pushed " + branchName + " to " + (remoteName || "its remote") + ".");
    } else {
      announce("The push did not go through.");
    }
    finishAction(result.ok);
  }).catch(function () {
    pushMessage = "Could not reach the local server to push.";
    announce(pushMessage);
    finishAction(false);
  });
}

/* ---- Rendering and polling ---- */

// Choices made for one run (folded stages, the log, the areas list) do not
// carry over to the next one, and neither do the Run and Push error lines.
function forgetChoicesIfNewRun(view) {
  var runKey = "none";
  if (view.starting) {
    runKey = "starting";
  } else if (view.feed !== null) {
    runKey = view.feed.run_id;
  }
  if (runKey === currentRunKey) {
    return;
  }
  if (currentRunKey !== null) {
    stageOpenChoice = {};
    areasExpanded = false;
    pushOutputOpen = false;
    runLogOpen = null;
    runMessage = "";
    pushMessage = "";
  }
  currentRunKey = runKey;
}

function renderCheckPanel() {
  if (runCard === null) {
    return;
  }
  var view = buildRunView();
  var stages = buildStages(view);
  updateRunCardWith(view, stages);
  // Everything the timeline shows, from /api/security and /api/state. The
  // run's output tail is left out: only the Run card shows it.
  var target = targetBranch();
  var judged = judgedRun(view);
  var judgedBranch = judged !== null ? findBranchInState(judged.branch) : null;
  var timelineKey = JSON.stringify([
    JSON.stringify(securityState, function (key, value) {
      return key === "log_tail" ? undefined : value;
    }),
    pendingAction, pushMessage, stageOpenChoice, areasExpanded, pushOutputOpen,
    view.inProgress, view.stopped, serverRestarted,
    securityUnreadable() ? securityMissText : null,
    target !== null ? target.name : null,
    judgedBranch !== null ? judgedBranch.commit : null
  ]);
  if (timelineKey !== lastTimelineKey) {
    lastTimelineKey = timelineKey;
    preserveScroll(checkListElement, function () {
      updateCheckTimeline(view, stages, timelineKey);
    });
  }
  refreshCheckFileLinks();
}

// /api/security has its own loop: every second while a run started here is
// going, every two seconds otherwise. While the tab is hidden it asks only
// while a run started here is going, every ten seconds, so the tab title can
// say when the run ends.
var securityTimerId = null;
var securityRequestPending = false;
var securityPollAgain = false;    // asked for while a request was in flight
// /api/security answers missed in a row, and what the last miss said. From
// SECURITY_MISSES_SHOWN on, the Run card says so and Run and Push wait.
var securityMissCount = 0;
var securityMissText = "";
var SECURITY_MISSES_SHOWN = 3;

function securityUnreadable() {
  return securityMissCount >= SECURITY_MISSES_SHOWN;
}

function securityUnreadableText() {
  return "Cannot read the security check's state right now: " + securityMissText;
}

function noticeSecurityMiss(text) {
  securityMissCount = securityMissCount + 1;
  securityMissText = text;
  if (!securityUnreadable()) {
    return;
  }
  lastSecurityJson = null; // the next good answer is drawn even if unchanged
  if (viewMode === "check") {
    renderCheckPanel();
  } else {
    updateRunCard();
  }
}

function stopSecurityPolling() {
  if (securityTimerId !== null) {
    window.clearTimeout(securityTimerId);
    securityTimerId = null;
  }
}

function scheduleSecurityPoll() {
  stopSecurityPolling();
  if (securityEnabled === false) {
    return;
  }
  var runActive = runnerInfo().active;
  if (document.hidden && !runActive) {
    return;
  }
  var delay = 2000;
  if (document.hidden) {
    delay = 10000;
  } else if (runActive) {
    delay = 1000;
  }
  securityTimerId = window.setTimeout(function () {
    securityTimerId = null;
    pollSecurity();
  }, delay);
}

function afterSecurityPoll() {
  if (securityPollAgain) {
    securityPollAgain = false;
    pollSecurity();
    return;
  }
  scheduleSecurityPoll();
}

function pollSecurity() {
  if (securityEnabled === false) {
    return; // the server said the feature is off: never ask again
  }
  if (securityRequestPending) {
    securityPollAgain = true;
    return;
  }
  stopSecurityPolling();
  securityRequestPending = true;
  var requestedAt = Date.now();
  fetchJson("/api/security", TIMEOUT_STATE_MS).then(function (result) {
    securityRequestPending = false;
    handleSecurityResult(result, requestedAt);
    afterSecurityPoll();
  }).catch(function () {
    securityRequestPending = false;
    noticeSecurityMiss("the local server did not answer.");
    afterSecurityPoll();
  });
}

function handleSecurityResult(result, requestedAt) {
  if (!result.ok || result.body === null) {
    noticeSecurityMiss(requestErrorText(result)); // the next poll retries
    return;
  }
  securityMissCount = 0;
  var body = result.body;
  var runnerAvailable = !!(body.runner && body.runner.available === true);
  if (body.enabled === false && !runnerAvailable) {
    securityEnabled = false;
    // A restarted server may have neither: the Check tab goes away, and so
    // do the banner, the badges and a title about a check.
    appElement.classList.remove("has-security");
    if (viewMode === "check") {
      switchView("branches");
    }
    securityState = null;
    lastSecurityJson = null;
    renderSecurityBanner();
    updateSecurityBadges();
    updateDocumentTitle();
    return;
  }
  if (securityEnabled !== true) {
    // First successful probe: reveal the Check tab. With neither a feed nor
    // a toolkit this never happens, so the tab does not exist at all.
    appElement.classList.add("has-security");
  }
  securityEnabled = true;
  var actionSettled = false;
  if (pendingAction !== null && pendingActionDoneAt !== null &&
      requestedAt >= pendingActionDoneAt) {
    pendingAction = null;
    pendingActionDoneAt = null;
    actionSettled = true;
  }
  // A run going quiet changes the page without changing the answer, so it
  // is part of the comparison.
  var json = JSON.stringify(body);
  if (body.running === true && feedWentQuiet(body)) {
    json = json + " quiet";
  }
  // so is each minute of "no progress for N min"
  var silent = body.running === true ? feedSilentMinutes(body) : null;
  if (silent !== null && silent >= STALLED_FEED_MINUTES) {
    json = json + " silent " + silent;
  }
  if (json === lastSecurityJson && !actionSettled) {
    return; // nothing changed: leave the DOM completely alone
  }
  lastSecurityJson = json;
  securityState = body;
  renderSecurityBanner();
  updateSecurityBadges();
  var view = buildRunView();
  noticeCheckEnd(view);
  announceCheckChange(view);
  updateDocumentTitle();
  if (viewMode === "check") {
    renderCheckPanel();
  } else {
    updateRunCard();
  }
}

/* ============================== Polling =================================== */

// Retries loads that never completed, ended in an error, or were asked for by
// a poll while a request failed. It runs whether or not the state token moved:
// the connection can heal while the repository stays the same.
function healIncompleteLoads() {
  if (graphInUse() && !graphRequestPending &&
      (currentGraph === null || graphReloadWanted)) {
    loadGraph();
  }
  // A network fetch that died on its way is asked for again; an answered
  // error is not.
  if (viewMode === "network" && networkCommitSha() !== null && currentNetwork === null &&
      networkErrorText === null && networkRequestSha === null) {
    renderNetworkPane();
  }
  if (!hasSelection()) {
    return;
  }
  // A comparison that failed is asked for again: the error may have passed.
  if (currentDiff === null || diffReloadWanted) {
    if (!diffRequestPending) {
      loadDiff();
    }
    return;
  }
  if (selectedFilePath !== null && !fileVanished && viewMode !== "network" &&
      !fileRequestPending &&
      (currentFile === null || fileErrorText !== null || fileReloadWanted)) {
    loadFile();
  }
}

// The token that moves whenever the selection's /api/diff answer can
// change: a branch's own content_token, or the refs for a commit (its
// changes are fixed, but it can leave the history).
function selectionToken(stateBody) {
  if (stateBody === null) {
    return null;
  }
  if (selectedCommitSha !== null) {
    return stateBody.refs_token;
  }
  for (var i = 0; i < stateBody.branches.length; i++) {
    if (stateBody.branches[i].name === selectedBranchName) {
      return stateBody.branches[i].content_token;
    }
  }
  return null;
}

function handleNewState(stateBody) {
  var previousState = currentState;
  var tokenChanged = stateBody.state_token !== lastStateToken;
  lastStateToken = stateBody.state_token;
  currentState = stateBody;
  noticeServerRestart(stateBody);
  if (!tokenChanged) {
    healIncompleteLoads();
    return;
  }
  pulseLiveDot();

  var sidebarJson = sidebarRegionJson(stateBody);
  if (sidebarJson !== lastSidebarJson) {
    lastSidebarJson = sidebarJson;
    preserveScroll(branchListElement, renderSidebar);
  }

  // The badges, banner and Check tab compare the judged commit with the
  // branch tips and edits.
  if (securityState !== null) {
    renderSecurityBanner();
    updateSecurityBadges();
    if (viewMode === "check") {
      renderCheckPanel();
    }
  }

  if (graphInUse()) {
    // The graph is built from the refs alone, so an edit leaves it as it is.
    if (previousState === null || stateBody.refs_token !== previousState.refs_token) {
      refreshGraph(); // its refresh handler re-renders the tree if anything moved
    } else if (currentGraph !== null) {
      renderTreeIfChanged(); // an "edits not yet committed" row may come or go
    }
  } else {
    // nothing on screen depends on the graph: drop the cache so the next
    // Tree open fetches a fresh one with a clean flash baseline
    currentGraph = null;
    lastGraphJson = null;
    lastTreeJson = null;
    previousTreeRowJson = null;
  }

  if (selectedBranchName !== null) {
    var stillExists = findBranchInState(selectedBranchName) !== null;
    if (!stillExists) {
      handleBranchVanished();
      return;
    }
    // The "behind" sentence can change while the /api/diff answer stays the
    // same (the base branch advanced), so the header is re-rendered here.
    if (headerRegionJson() !== lastHeaderJson) {
      renderHeader();
    }
  }
  if (hasSelection()) {
    // An edit in another worktree leaves this selection's answer as it is.
    if (selectionToken(stateBody) !== selectionToken(previousState)) {
      refreshDiff();
    }
    healIncompleteLoads();
    return;
  }
  // No selection yet (the first fetch failed and polling recovered): select
  // now, unless the open branch or commit vanished.
  if (!branchVanished && !commitVanished) {
    openStartingView();
  }
}

// A restarted BranchLens has a new page token and access cookie, so this
// page's Run and Push would be refused, and it may have a different Check
// tab. A reload is refused too: only the new address carries the cookie.
var RESTARTED_REASON = "BranchLens was restarted: open the new address it printed " +
  "in the terminal to run a check or push.";

function noticeServerRestart(stateBody) {
  if (stateBody.launch_id === lastLaunchId) {
    return;
  }
  var firstAnswer = lastLaunchId === null;
  lastLaunchId = stateBody.launch_id;
  if (firstAnswer) {
    return;
  }
  serverRestarted = true;
  updateRunCard();
  if (viewMode === "check") {
    renderCheckPanel();
  }
  // ask the new server whether it has a feed or a toolkit
  securityEnabled = null;
  pollSecurity();
}

// A non-ok /api/state answer with a readable JSON error: the server answered,
// so its sentence goes in the diff pane and the footer stays live. Network
// failures and answers with no readable body mark contact as lost.
function handleStateFailure(result) {
  if (result.body && result.body.error) {
    setFooter("live");
    var message = String(result.body.error);
    if (message !== stateErrorText) {
      stateErrorText = message;
      renderDiffPane();
    }
  } else {
    setFooter("lost");
  }
}

function pollOnce() {
  if (pollInFlight || document.hidden) {
    return;
  }
  // The security feed is not polled here: it has its own loop (see
  // pollSecurity), faster while a check started from this page is running.
  pollInFlight = true;
  fetchJson("/api/state", TIMEOUT_STATE_MS).then(function (result) {
    pollInFlight = false;
    if (document.hidden) {
      return; // tab went to background mid-request: keep the paused footer
    }
    if (!result.ok || result.body === null) {
      handleStateFailure(result);
      return;
    }
    if (stateErrorText !== null) {
      stateErrorText = null;
      renderDiffPane();
    }
    setFooter("live"); // recover silently after a failure
    handleNewState(result.body);
  }).catch(function (error) {
    pollInFlight = false;
    if (!document.hidden) {
      setFooter(footerStateFor(error));
    }
  });
}

function startPolling() {
  if (pollTimerId === null) {
    pollTimerId = setInterval(pollOnce, 2000);
  }
}

function stopPolling() {
  if (pollTimerId !== null) {
    clearInterval(pollTimerId);
    pollTimerId = null;
  }
}

document.addEventListener("visibilitychange", function () {
  if (document.hidden) {
    stopPolling();
    scheduleSecurityPoll(); // slows down, or stops when no run of ours is going
    setFooter("paused");
  } else {
    // The footer stays as it is until the poll below reports "live" or "lost".
    pollOnce();
    startPolling();
    pollSecurity(); // restarts its own loop
    forgetUnseenCheckEnd();
  }
});

/* ============================== Startup =================================== */

function autoSelectBranch() {
  if (!currentState || currentState.branches.length === 0) {
    return null;
  }
  var branches = currentState.branches;
  for (var i = 0; i < branches.length; i++) {
    if (branches[i].is_current) {
      return branches[i].name;
    }
  }
  for (var j = 0; j < branches.length; j++) {
    if (!branches[j].is_default) {
      return branches[j].name;
    }
  }
  return branches[0].name;
}

/* ---- The view in the address, so a reload comes back to it ---- */

// For example #view=tree&branch=feature&file=src%2Fapp.py&base=<commit id>,
// with commit=<commit id> in place of branch= when a commit is selected.
var VIEW_NAMES = ["branches", "tree", "check", "network"];
var COMMIT_ID_PATTERN = /^([0-9a-f]{40}|[0-9a-f]{64})$/;

function rememberViewInAddress() {
  var parts = ["view=" + encodeURIComponent(viewMode)];
  if (selectedBranchName !== null) {
    parts.push("branch=" + encodeURIComponent(selectedBranchName));
  } else if (selectedCommitSha !== null) {
    parts.push("commit=" + encodeURIComponent(selectedCommitSha));
  }
  if (hasSelection() && selectedFilePath !== null) {
    parts.push("file=" + encodeURIComponent(selectedFilePath));
  }
  if (baseSha !== null) {
    parts.push("base=" + encodeURIComponent(baseSha));
  }
  try {
    history.replaceState(null, "", "#" + parts.join("&"));
  } catch (error) {
    // the page works the same; only a reload forgets the view
  }
}

function readViewFromAddress() {
  var saved = { view: null, branch: null, commit: null, file: null, base: null };
  var pairs = window.location.hash.replace(/^#/, "").split("&");
  for (var i = 0; i < pairs.length; i++) {
    var equalsAt = pairs[i].indexOf("=");
    if (equalsAt <= 0) {
      continue;
    }
    var key = pairs[i].slice(0, equalsAt);
    var value;
    try {
      value = decodeURIComponent(pairs[i].slice(equalsAt + 1));
    } catch (error) {
      continue; // a broken escape: ignore that part
    }
    if (Object.prototype.hasOwnProperty.call(saved, key) && value !== "") {
      saved[key] = value;
    }
  }
  return saved;
}

// Read before anything rewrites the address; used once.
var savedAddressView = readViewFromAddress();

// With the first /api/state answer: back to the view in the address, as
// far as it still exists, then its commit, else a branch (the saved one,
// else a default).
function openStartingView() {
  var saved = savedAddressView;
  savedAddressView = null;
  var restoreBranch = false;
  if (saved !== null) {
    if (saved.base !== null && COMMIT_ID_PATTERN.test(saved.base)) {
      baseSha = saved.base; // dropped again when it is no longer in the history
    } else if (saved.base === EMPTY_TREE_BASE) {
      baseSha = EMPTY_TREE_BASE;
    }
    // The Check tab exists only when the server has a feed or a toolkit; if
    // the answer is not in yet, the tab leaves again when it says no.
    if (VIEW_NAMES.indexOf(saved.view) !== -1 &&
        !(saved.view === "check" && securityEnabled === false)) {
      switchView(saved.view);
    }
    if (saved.commit !== null && COMMIT_ID_PATTERN.test(saved.commit)) {
      selectCommit(saved.commit);
      restoringCommit = true; // a commit no longer in the history opens a branch
      fileToRestore = saved.file;
      return;
    }
    restoreBranch = saved.branch !== null && findBranchInState(saved.branch) !== null;
  }
  var chosen = restoreBranch ? saved.branch : autoSelectBranch();
  if (chosen !== null) {
    selectBranch(chosen);
    if (restoreBranch) {
      fileToRestore = saved.file; // opened when the branch's diff arrives, if listed
    }
  }
}

function initialize() {
  liveTextElement.textContent = "Live: updates automatically";
  buildRunCard(); // the Check tab's Run card, hidden until the tab is shown
  renderHeader(); // shows the pick-a-branch line until state arrives
  // One probe; with neither a feed nor a toolkit the server says so exactly
  // once. Otherwise pollSecurity keeps its own loop going from here.
  pollSecurity();
  fetchJson("/api/state", TIMEOUT_FIRST_STATE_MS).then(function (result) {
    if (!result.ok || result.body === null) {
      handleStateFailure(result);
      startPolling();
      return;
    }
    currentState = result.body;
    lastStateToken = currentState.state_token;
    noticeServerRestart(currentState);
    lastSidebarJson = sidebarRegionJson(currentState);
    renderSidebar();
    openStartingView();
    startPolling();
  }).catch(function (error) {
    setFooter(footerStateFor(error));
    startPolling();
  });
  setInterval(updateRelativeTimes, 30000); // tick "3 min ago" style labels
  setInterval(tickLiveElapsed, 1000);      // tick the Check tab's running clocks
}

initialize();
</script>
</body>
</html>
