<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BranchLens</title>
<style>
/* ============================== Color tokens ============================== */
:root {
  color-scheme: light dark;
  --canvas: #ffffff;
  --panel: #f6f8fa;
  --hover: #eaeef2;
  --selected: #ddf4ff;
  --border: #d0d7de;
  --text: #1f2328;
  --muted: #59636e;
  --accent: #0969da;
  --add-line-bg: #e6ffec;
  --add-gutter-bg: #ccffd8;
  --del-line-bg: #ffebe9;
  --del-gutter-bg: #ffd7d5;
  --add-fg: #116329;
  --del-fg: #cf222e;
  --gutter: #fafaf8;
  --flash: #fff8c5;
  --amber-banner-bg: #fff8c5;
  --amber-banner-fg: #7d4e00;
  --amber-dot: #9a6700;
  --chip-new-bg: #dafbe1;
  --chip-new-fg: #1a7f37;
  --chip-edited-bg: #ddf4ff;
  --chip-edited-fg: #0969da;
  --chip-deleted-bg: #ffebe9;
  --chip-deleted-fg: #cf222e;
  --chip-moved-bg: #fbefff;
  --chip-moved-fg: #8250df;
  --chip-binary-bg: #eaeef2;
  --chip-binary-fg: #59636e;
  /* tree lane colors (lane 0 always uses --accent); never diff red/green */
  --lane1: #8250df;
  --lane2: #1b7c83;
  --lane3: #bc4c00;
  --lane4: #bf3989;
  --lane5: #57606a;
  /* the sidebar width of the Tree, Check and Network tabs; renderTree reads it */
  --wide-sidebar: 420px;
  /* every piece of code, path, branch name and count */
  --mono-font: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
               "Liberation Mono", monospace;
}
@media (max-width: 1100px) {
  :root { --wide-sidebar: 340px; }
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #0d1117;
    --panel: #161b22;
    --hover: #21262d;
    --selected: #121d2f;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --add-line-bg: #12261e;
    --add-gutter-bg: #1c4328;
    --del-line-bg: #25171c;
    --del-gutter-bg: #542426;
    --add-fg: #3fb950;
    --del-fg: #f85149;
    --gutter: #14181f;
    --flash: #272215;
    --amber-banner-bg: #272215;
    --amber-banner-fg: #d29922;
    --amber-dot: #d29922;
    --chip-new-bg: #12261e;
    --chip-new-fg: #3fb950;
    --chip-edited-bg: #121d2f;
    --chip-edited-fg: #58a6ff;
    --chip-deleted-bg: #25171c;
    --chip-deleted-fg: #f85149;
    --chip-moved-bg: #2b2138;
    --chip-moved-fg: #a371f7;
    --chip-binary-bg: #21262d;
    --chip-binary-fg: #8b949e;
    --lane1: #a371f7;
    --lane2: #39c5cf;
    --lane3: #e0823d;
    --lane4: #db61a2;
    --lane5: #8b949e;
  }
}

/* ============================== Base & layout ============================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
/* clip, where supported: not even a script's scrollIntoView moves the page */
html, body { height: 100%; overflow: hidden; overflow: clip; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
               Helvetica, Arial, sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--canvas);
}
.mono { font-family: var(--mono-font); }
/* read by screen readers, never shown */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

#app {
  display: grid;
  grid-template-columns: 280px 1fr;
  height: 100%;
  transition: grid-template-columns 180ms ease;
}
#app.tree-mode { grid-template-columns: var(--wide-sidebar) 1fr; }
/* the run panel carries finding titles and reasons: it needs the same room */
#app.check-mode { grid-template-columns: var(--wide-sidebar) 1fr; }
#sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
}
#main {
  display: grid;
  /* three rows: security banner (collapses when hidden) / header / content */
  grid-template-rows: auto auto 1fr;
  /* one column that never grows past the window, whatever the header holds */
  grid-template-columns: minmax(0, 1fr);
  min-width: 0;
  min-height: 0;
}
/* fixed rows: a hidden banner takes no cell */
#security-banner { grid-row: 1; }
#header-bar { grid-row: 2; }
#content { grid-row: 3; }
#content {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: 0;
}
@media (max-width: 1000px) {
  #content { grid-template-columns: 220px 1fr; }
}

/* ============================== Sidebar =================================== */
#sidebar-top {
  padding: 14px 12px 10px 12px;
  border-bottom: 1px solid var(--border);
}
#repo-name {
  font-size: 15px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#branch-section-label {
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: 0.5px;
  color: var(--muted);
}
#view-tabs {
  display: flex;
  gap: 14px;
  margin-top: 8px;
}
.view-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 2px 1px 4px 1px;
  font: inherit;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  cursor: pointer;
}
.view-tab.selected {
  color: var(--text);
  border-bottom-color: var(--accent);
}
#branch-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}
#branch-list:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
#tree-list {
  display: none;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}
#tree-list:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
#app.tree-mode #tree-list { display: block; }
#app.tree-mode #branch-list { display: none; }
#app.tree-mode #branch-section-label { display: none; }
.branch-row {
  /* transparent left border keeps text aligned when the selected border appears */
  padding: 10px 12px 10px 9px;
  border-left: 3px solid transparent;
  cursor: pointer;
}
.branch-row:hover { background: var(--hover); }
.branch-row.selected {
  background: var(--selected);
  border-left-color: var(--accent);
}
.detached-row { cursor: default; }
.detached-row:hover { background: transparent; }
.branch-line1 {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.branch-name {
  font-size: 13px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.chip {
  flex: none;
  display: inline-block;
  font-size: 11px;
  line-height: 1;
  padding: 2px 7px;
  border-radius: 10px;
  white-space: nowrap;
}
.chip-default {
  color: var(--muted);
  border: 1px solid var(--border);
  background: transparent;
}
.chip-checked {
  color: var(--accent);
  background: var(--selected);
}
.branch-row.selected .chip-checked {
  /* keep the chip visible on the selected (same-tint) background */
  border: 1px solid var(--accent);
}
.uncommitted-dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--amber-dot);
}
.branch-line2 {
  margin-top: 3px;
  font-size: 12px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.branch-line3 {
  margin-top: 2px;
  font-size: 12px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#live-footer {
  flex: 0 0 32px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--muted);
}
#live-dot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  /* accent: green and red are reserved for added and deleted lines */
  background: var(--accent);
  opacity: 0.6;
}
#live-dot.off {
  background: var(--muted);
  opacity: 0.6;
}
#live-dot.pulse { animation: dot-pulse 700ms ease-out 1; }
@keyframes dot-pulse {
  0%   { opacity: 0.6; transform: scale(1); }
  40%  { opacity: 1;   transform: scale(1.4); }
  100% { opacity: 0.6; transform: scale(1); }
}

/* ============================== Tree view ================================= */
.tree-row {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding-right: 10px;
  cursor: pointer;
  min-width: 0;
}
.tree-row:hover { background: var(--hover); }
.tree-row.selected {
  background: var(--selected);
  /* inset bar instead of a border so the graph column never shifts */
  box-shadow: inset 3px 0 0 var(--accent);
}
.tree-svg { flex: none; display: block; }
/* hollow merge-ring centers follow the row background so lines don't show through */
.tree-svg .ring { fill: var(--panel); }
.tree-row:hover .ring { fill: var(--hover); }
.tree-row.selected .ring { fill: var(--selected); }
.tree-subject {
  /* takes only the room the tip chips leave */
  flex: 1 1 0;
  min-width: 3em;
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tree-row.pseudo .tree-subject {
  font-style: italic;
  color: var(--muted);
}
/* a button; its font comes from .mono. A long name ends in an ellipsis and
   its title holds the full name. */
.tip-chip {
  flex: 0 1 auto;
  min-width: 3em;
  max-width: 16em;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid currentColor;
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
}
/* marks the default branch as last seen online; not clickable, so no cursor */
.online-chip {
  flex: 0 1 auto;
  min-width: 3em;
  max-width: 16em;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid currentColor;
  color: var(--accent);
  white-space: nowrap;
}
.tree-time {
  flex: none;
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
#tree-list.hide-times .tree-time { display: none; }
/* a button, shown only on the hovered and the selected row */
.compare-chip {
  display: none;
  flex: none;
  font-family: inherit;
  font-size: 10px;
  line-height: 1;
  padding: 2px 6px;
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 4px;
  background: transparent;
  white-space: nowrap;
  cursor: pointer;
}
.tree-row:hover .compare-chip,
.tree-row.selected .compare-chip { display: inline-block; }
.tree-row:hover .tree-time { display: none; }
.base-chip {
  flex: none;
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--accent);
  color: var(--canvas);
  white-space: nowrap;
}
.tree-note {
  padding: 8px 10px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
}
.tree-empty {
  padding: 24px 16px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}
/* The tree's last entry, "compare from the beginning". Always visible: a
   touch screen has no hover. renderTree indents it to the subjects' column. */
.tree-beginning {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 26px;
  padding: 4px 10px 12px 10px;
  font-size: 11px;
  color: var(--muted);
  min-width: 0;
}
.beginning-chip {
  flex: none;
  font-family: inherit;
  font-size: 10px;
  line-height: 1;
  padding: 2px 6px;
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 4px;
  background: transparent;
  white-space: nowrap;
  cursor: pointer;
}
.beginning-chip:hover { background: var(--hover); }
.tree-beginning-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============================== Header bar ================================ */
#header-bar {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}
#header-line1 { font-size: 14px; }
.name-chip {
  font-family: var(--mono-font);
  font-size: 12px;
  font-weight: 600;
  background: var(--selected);
  border-radius: 3px;
  padding: 1px 5px;
  overflow-wrap: anywhere;    /* a long branch name wraps instead of widening the page */
}
.stop-compare-pill {
  display: inline-block;
  margin-left: 8px;
  font-family: inherit;
  font-size: 11px;
  line-height: 1;
  padding: 3px 8px;
  border-radius: 10px;
  border: 1px solid var(--accent);
  color: var(--accent);
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
}
#header-line2 {
  margin-top: 3px;
  font-size: 12px;
  color: var(--muted);
  min-height: 15px;
}
#header-line2 .adds { color: var(--add-fg); }
#header-line2 .dels { color: var(--del-fg); }

/* ---------------------------- Commit message ------------------------------ */
/* renderCommitMessage adds .shown; a branch selection shows nothing here. */
#commit-message { display: none; }
#commit-message.shown {
  display: block;
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--canvas);
}
.commit-message-text {
  position: relative; /* anchors the fade drawn over the collapsed bottom */
  padding: 8px 10px;
  font-family: var(--mono-font);
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;      /* keep the line breaks the author typed */
  overflow-wrap: anywhere;    /* a long URL wraps instead of widening the page */
  max-height: 40vh;           /* "show all" scrolls here, leaving room for the diff */
  overflow-y: auto;
}
.commit-message-text.collapsed {
  /* six lines of text, plus this block's 8px top and bottom padding */
  max-height: calc(6 * 1.5 * 12px + 16px);
  overflow: hidden;
}
/* Fades the clipped last line. */
.commit-message-text.collapsed::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 24px;
  background: linear-gradient(transparent, var(--canvas));
}
.commit-message-subject { font-weight: 600; }
.commit-message-body { color: var(--muted); }
.commit-message-footer {
  display: flex;
  gap: 12px;
  align-items: center;
  border-top: 1px solid var(--border);
  padding: 5px 10px;
  font-size: 11px;
  color: var(--muted);
}
/* a button that looks like a link */
.commit-message-action {
  font: inherit;
  padding: 0;
  border: none;
  background: none;
  color: var(--accent);
  cursor: pointer;
}
.commit-message-action:hover { text-decoration: underline; }
.commit-message-meta {
  display: flex;
  gap: 12px;
  margin-left: auto;
  min-width: 0;
}
.commit-message-author {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============================== Security feed ============================= */
/* Amber, accent and muted only: red and green are reserved for diff lines. */
#security-banner {
  display: none;
  padding: 6px 16px;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
}
#security-banner.running {
  display: block;
  background: var(--amber-banner-bg);
  color: var(--amber-banner-fg);
}
#security-banner.done {
  display: block;
  background: var(--panel);
  color: var(--muted);
}
#security-banner .mono { font-weight: 600; }
/* the whole banner opens the Check tab */
#security-banner.running,
#security-banner.done { cursor: pointer; }
#security-banner:hover .banner-link { text-decoration: underline; }
#security-banner:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
#security-banner .banner-word { font-weight: 600; color: var(--text); }
#security-banner .banner-link { color: var(--accent); }
/* on the Check tab itself the banner links nowhere */
#app.check-mode #security-banner { cursor: default; }
#app.check-mode #security-banner .banner-go { display: none; }
.security-badge {
  flex: none;
  font-size: 11px;
  line-height: 1;
  padding: 2px 7px;
  border-radius: 10px;
  white-space: nowrap;
}
.security-badge.pending {
  color: var(--muted);
  border: 1px solid var(--border);
  background: transparent;
}
.security-badge.checking {
  background: var(--amber-banner-bg);
  color: var(--amber-banner-fg);
}
.security-badge.clean {
  color: var(--accent);
  border: 1px solid var(--accent);
  background: transparent;
}
.security-badge.findings {
  background: var(--amber-banner-fg);
  color: var(--canvas);
  font-weight: 600;
}
/* a deep dive's own count, before verification */
.security-badge.candidates {
  color: var(--amber-banner-fg);
  border: 1px solid var(--amber-dot);
  background: transparent;
}
.security-badge.unverified {
  color: var(--amber-banner-fg);
  border: 1px dashed var(--amber-dot);
  background: transparent;
}
.security-badge.skipped {
  color: var(--muted);
  border: 1px dashed var(--border);
  background: transparent;
}

/* ---- Check tab: the pipeline console ---- */
/* Top to bottom: the Run card, then three numbered stages on a timeline
   (mechanical checks, LLM review, verdict). Running is amber, finished is
   accent, and each state also has its own shape. */
#check-list {
  display: none;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 12px 24px 12px;
}
#app.check-mode #check-list { display: block; }
#app.check-mode #branch-list,
#app.check-mode #tree-list,
#app.check-mode #branch-section-label { display: none; }
/* the tab exists only when a feed or a toolkit is configured */
#tab-check { display: none; }
#app.has-security #tab-check { display: inline-block; }
/* beats the display that several classes below set */
#check-list [hidden] { display: none !important; }

@keyframes console-spin {
  to { transform: rotate(360deg); }
}
/* the lit stretch that travels along a running segment of the meter */
@keyframes meter-sweep {
  from { left: -35%; }
  to   { left: 100%; }
}

/* Buttons and text links used only here */
.console-button {
  flex: none;
  height: 28px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: 6px;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}
.console-button.primary {
  background: var(--accent);
  color: var(--canvas);
}
.console-button.primary:hover:not(:disabled) { filter: brightness(1.08); }
.console-button.secondary {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}
.console-button.secondary:hover:not(:disabled) { background: var(--hover); }
.console-button:disabled {
  background: var(--hover);
  color: var(--muted);
  border-color: var(--border);
  cursor: not-allowed;
}
.console-button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.console-button.wide {
  width: 100%;
  height: 32px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.console-link {
  flex: none;
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
}
.console-link:hover { text-decoration: underline; }
.console-link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}
.console-note {
  margin-top: 8px;
  padding: 6px 8px;
  border-radius: 4px;
  font-size: 11px;
  line-height: 1.45;
  background: var(--amber-banner-bg);
  color: var(--amber-banner-fg);
}
.console-message {
  margin-top: 8px;
  font-size: 11px;
  line-height: 1.45;
  color: var(--amber-banner-fg);
  overflow-wrap: anywhere;
}
.console-log {
  margin-top: 6px;
  max-height: 180px;
  overflow: auto;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--panel);
  color: var(--text);
  font-family: var(--mono-font);
  font-size: 11px;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* 1. Run card */
.run-card {
  margin-bottom: 20px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--canvas);
}
.run-card-top {
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-width: 0;
}
.run-card-lead {
  flex: none;
  font-size: 13px;
  color: var(--muted);
}
.run-card-branch {
  flex: 0 1 auto;
  min-width: 0;
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.run-card-branch.none {
  font-weight: 400;
  color: var(--muted);
}
.run-card-top .console-link { margin-left: auto; }
.run-card-base {
  margin-top: 2px;
  min-height: 15px;
  font-size: 11px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.run-card-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 28px;
  margin-top: 10px;
}
/* why Run is disabled, on its own line so it is never cut off */
.run-card-reason {
  margin-top: 6px;
  font-size: 11px;
  line-height: 1.45;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.run-card-clock {
  flex: none;
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.run-card-log-toggle { margin-top: 8px; }

/* The meter: one segment per stage. The review, the longest stage, gets the
   widest segment. */
.run-meter {
  display: flex;
  gap: 3px;
  height: 4px;
  margin-top: 12px;
}
.run-meter-segment {
  position: relative;
  flex: 1 1 0;
  overflow: hidden;
  border-radius: 2px;
  background: var(--hover);
}
.run-meter-segment.review { flex-grow: 2; }
.run-meter-segment.verdict { flex: 0 0 22px; }
.run-meter-fill {
  width: 0;
  height: 100%;
  background: var(--accent);
  transition: width 400ms ease;
}
.run-meter-segment.running .run-meter-fill,
.run-meter-segment.blocked .run-meter-fill,
.run-meter-segment.warn .run-meter-fill { background: var(--amber-dot); }
.run-meter-segment.stopped .run-meter-fill { background: var(--muted); }
.run-meter-segment.running::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 35%;
  background: var(--amber-dot);
  opacity: 0.35;
  animation: meter-sweep 1.8s ease-in-out infinite;
}

/* 2. The stages, on a timeline */
.stage {
  position: relative;
  padding: 0 0 18px 32px;
}
/* the rail down to the next stage's marker */
.stage::before {
  content: "";
  position: absolute;
  left: 10px;
  top: 26px;
  bottom: 4px;
  width: 2px;
  border-radius: 1px;
  background: var(--border);
}
.stage:last-child::before { display: none; }
/* focus lands on the stage when the control that had it is gone */
.stage:focus { outline: none; }
.stage:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
  border-radius: 4px;
}
.stage.done::before { background: var(--accent); }
.stage-marker {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border: 2px solid var(--border);
  border-radius: 50%;
  background: var(--panel);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.stage.waiting .stage-marker { border-color: var(--muted); }
.stage.running .stage-marker { color: var(--amber-banner-fg); }
/* the running arc sits exactly on the marker's own border */
.stage.running .stage-marker::after {
  content: "";
  position: absolute;
  inset: -2px;
  border: 2px solid transparent;
  border-top-color: var(--amber-dot);
  border-radius: 50%;
  animation: console-spin 900ms linear infinite;
  animation-delay: var(--spin-delay, 0ms);
}
.stage.done .stage-marker {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--canvas);
}
.stage.blocked .stage-marker {
  background: var(--amber-banner-fg);
  border-color: var(--amber-banner-fg);
  color: var(--canvas);
}
.stage.warn .stage-marker {
  border-color: var(--amber-dot);
  color: var(--amber-banner-fg);
}
.stage.skipped .stage-marker,
.stage.stopped .stage-marker { border-style: dashed; }
.stage-head {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 22px;
  padding: 0;
  border: none;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
}
.stage-head:enabled { cursor: pointer; }
.stage-head:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 3px;
}
.stage-title {
  flex: none;
  font-size: 13px;
  font-weight: 600;
}
.stage-status {
  flex: 1 1 auto;
  min-width: 0;
  text-align: right;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.stage.running .stage-status { color: var(--amber-banner-fg); }
.stage-caret {
  flex: none;
  width: 10px;
  font-size: 10px;
  color: var(--muted);
  transition: transform 150ms ease;
}
.stage.collapsed .stage-caret { transform: rotate(-90deg); }
.stage-detail {
  margin-top: 1px;
  font-size: 11px;
  line-height: 1.45;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.stage-body { margin-top: 8px; }
.stage.collapsed .stage-body { display: none; }
.stage-subhead {
  margin: 12px 0 4px 0;
  font-size: 11px;
  letter-spacing: 0.5px;
  color: var(--muted);
}
.stage-subhead:first-child { margin-top: 0; }
.stage-note {
  margin: 0 0 4px 0;
  font-size: 11px;
  line-height: 1.45;
  color: var(--muted);
}
.stage-empty,
.check-empty {
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
}
.check-empty { padding: 4px 2px; }

/* One row per check. Every row keeps a fixed height while it updates: a
   gate row reserves its detail line even while that line is still empty. */
.check-row {
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) auto;
  column-gap: 8px;
  align-items: center;
  min-height: 24px;
  margin: 0 -6px;
  padding: 3px 6px;
  border-radius: 4px;
  font-size: 12px;
}
.check-row.clickable { cursor: pointer; }
.check-row.clickable:hover { background: var(--hover); }
.check-row.clickable:focus-visible,
.issue-row.clickable:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.check-row.blocking { box-shadow: inset 2px 0 0 var(--amber-dot); }
.row-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-id {
  margin-right: 6px;
  font-size: 11px;
  color: var(--muted);
}
/* fixed height: the row does not grow when its result chip appears */
.row-side {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 18px;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.row-state.running { color: var(--amber-banner-fg); }
.row-state.findings {
  color: var(--amber-banner-fg);
  font-weight: 600;
}
.row-time {
  min-width: 36px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.row-detail {
  grid-column: 2 / 4;
  min-height: 15px;
  font-size: 11px;
  line-height: 15px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Status marks: waiting (hollow), running (spinning arc), done (filled
   accent), nothing to do (filled grey), needs a look (amber ring),
   blocking (amber diamond), stopped (dashed). */
.status-mark {
  display: block;
  justify-self: center;
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.status-mark.pending { border: 1.5px solid var(--muted); }
.status-mark.running {
  width: 12px;
  height: 12px;
  border: 2px solid var(--hover);
  border-top-color: var(--amber-dot);
  animation: console-spin 900ms linear infinite;
  animation-delay: var(--spin-delay, 0ms);
}
.status-mark.ok { background: var(--accent); }
.status-mark.neutral {
  width: 8px;
  height: 8px;
  background: var(--muted);
}
.status-mark.warn { border: 2px solid var(--amber-dot); }
.status-mark.block {
  width: 9px;
  height: 9px;
  border-radius: 1px;
  background: var(--amber-dot);
  transform: rotate(45deg);
}
.status-mark.stopped { border: 1.5px dashed var(--muted); }

.result-chip {
  font-size: 10px;
  line-height: 1;
  padding: 2px 6px;
  border-radius: 10px;
  white-space: nowrap;
}
.result-chip.tested {
  color: var(--accent);
  border: 1px solid var(--accent);
}
.result-chip.partial {
  background: var(--amber-banner-bg);
  color: var(--amber-banner-fg);
}
.result-chip.not-possible {
  background: var(--amber-banner-bg);
  color: var(--amber-banner-fg);
  font-weight: 600;
}
.result-chip.not-applicable {
  color: var(--muted);
  border: 1px solid var(--border);
}
.result-chip.blocking {
  background: var(--amber-banner-fg);
  color: var(--canvas);
  font-weight: 600;
}

/* 3. The verdict card, the last stage's body */
.verdict-card {
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-left-width: 4px;
  border-radius: 8px;
  background: var(--canvas);
}
.verdict-card.ok { border-left-color: var(--accent); }
.verdict-card.blocked,
.verdict-card.unsure { border-left-color: var(--amber-dot); }
.verdict-context {
  font-size: 11px;
  line-height: 1.45;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.verdict-word {
  margin-top: 4px;
  font-size: 22px;
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.2px;
}
.verdict-card.ok .verdict-word { color: var(--accent); }
.verdict-card.blocked .verdict-word,
.verdict-card.unsure .verdict-word { color: var(--amber-banner-fg); }
.verdict-card.idle .verdict-word { color: var(--muted); }
/* the numbers that decide whether to trust the run, above the prose */
.verdict-summary {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 600;
}
.verdict-line {
  margin-top: 4px;
  font-size: 11px;
  line-height: 1.45;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.verdict-section-label {
  margin: 14px 0 4px 0;
  font-size: 11px;
  letter-spacing: 0.5px;
  color: var(--muted);
}
/* A finding: severity and its whole title (wrapped), then file:line and who
   reported it. */
.issue-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 8px;
  row-gap: 1px;
  align-items: start;
  margin: 0 -6px;
  padding: 4px 6px;
  border-radius: 4px;
  font-size: 12px;
}
.issue-row.clickable { cursor: pointer; }
.issue-row.clickable:hover { background: var(--hover); }
.issue-row .severity-chip { margin-top: 1px; }
.issue-title {
  min-width: 0;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.issue-where {
  grid-column: 2;
  min-width: 0;
  font-size: 11px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.severity-chip {
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  padding: 2px 5px;
  border-radius: 3px;
  text-transform: uppercase;
}
/* No red or green here: those are for diff lines. Filled chips use the
   darker amber so their white text stays readable. */
.severity-chip.high {
  background: var(--amber-banner-fg);
  color: var(--canvas);
}
.severity-chip.medium {
  background: var(--amber-banner-bg);
  color: var(--amber-banner-fg);
}
.severity-chip.low {
  color: var(--muted);
  border: 1px solid var(--border);
}
/* An area not fully examined: its name and result chip, then the reason. */
.check-area-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 4px 0 0 0;
  font-size: 12px;
}
.check-area-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow-wrap: anywhere;
}
.check-area-row .result-chip { flex: none; }
.check-area-reason {
  padding: 1px 0 4px 0;
  font-size: 11px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

/* Push: the one action that writes, under the verdict that allows it */
.push-area { margin-top: 14px; }
.push-reason {
  margin-top: 6px;
  font-size: 11px;
  line-height: 1.45;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.push-result {
  margin-top: 8px;
  font-size: 12px;
  font-weight: 600;
}
.push-output-toggle {
  display: block;
  margin-top: 6px;
}

/* the line over a finished run's stages: which branch it checked, when */
.check-last,
.check-feed {
  margin: 0 0 12px 0;
  font-size: 12px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.check-feed { color: var(--muted); }
.check-last .mono { font-weight: 600; }
.check-last-other { color: var(--amber-banner-fg); }

/* ============================== File explorer ============================= */
#file-panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  border-right: 1px solid var(--border);
}
#file-list-header {
  flex: none;
  padding: 8px 10px;
  font-size: 11px;
  letter-spacing: 0.5px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  min-height: 30px;
}
#file-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}
#file-list:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
/* a half-screen window: the file list sits above the diff, and a short
   window scrolls */
@media (max-width: 900px) {
  #main { overflow-y: auto; }
  #content {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, 1fr);
    min-height: 320px;
  }
  /* the network pane is the only thing shown there */
  #app.network-mode #content { grid-template-rows: minmax(0, 1fr); }
  #file-panel {
    max-height: 30vh;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
}
.file-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px 7px 7px;
  border-left: 3px solid transparent;
  cursor: pointer;
  min-width: 0;
}
.file-row:hover { background: var(--hover); }
/* a file name that is not valid UTF-8: listed and counted, never opened */
.file-row.unshowable { cursor: default; }
.file-row.unshowable:hover { background: transparent; }
.file-row.selected {
  background: var(--selected);
  border-left-color: var(--accent);
}
/* the edited chip has the selected row's own background: outline it */
.file-row.selected .word-chip.edited {
  box-shadow: inset 0 0 0 1px var(--chip-edited-fg);
}
.chip-col {
  flex: 0 0 64px;
  text-align: center;
}
.word-chip {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
  padding: 3px 7px;
  border-radius: 5px;
}
.word-chip.new     { background: var(--chip-new-bg);     color: var(--chip-new-fg); }
.word-chip.edited  { background: var(--chip-edited-bg);  color: var(--chip-edited-fg); }
.word-chip.deleted { background: var(--chip-deleted-bg); color: var(--chip-deleted-fg); }
.word-chip.moved   { background: var(--chip-moved-bg);   color: var(--chip-moved-fg); }
/* "type changed" is wider than the 64px column: it wraps to two lines */
.word-chip.typechanged {
  white-space: normal;
  line-height: 1.15;
}
/* The filename stays whole; the directory shrinks with an ellipsis down to
   one letter. The reversed row lays the name out first, so a directory with
   no room left wraps to a second line, hidden by the fixed height. Only a
   name wider than the whole row is cut. */
.file-path {
  display: flex;
  flex-direction: row-reverse;
  flex-wrap: wrap;
  justify-content: flex-end; /* the end of a reversed row is its left side */
  align-content: flex-start;
  height: 16px;
  line-height: 16px;
  overflow: hidden;
  flex: 1 1 auto;
  min-width: 0;
  font-size: 12px;
}
.path-dir {
  order: 1;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1 1 2ch;
  min-width: 2ch;
  max-width: max-content;
}
.path-name {
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 0 0 auto;
  max-width: 100%;
}
.path-old { color: var(--muted); }
.file-path.struck {
  text-decoration: line-through;
  color: var(--muted);
}
.file-path.struck .path-name { color: var(--muted); }
.rename-path {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.file-counts {
  flex: none;
  margin-left: auto;
  font-size: 11px;
  white-space: nowrap;
}
.file-counts .adds { color: var(--add-fg); }
.file-counts .dels { color: var(--del-fg); }
.binary-pill {
  flex: none;
  margin-left: auto;
  font-size: 11px;
  line-height: 1;
  padding: 2px 7px;
  border-radius: 10px;
  background: var(--chip-binary-bg);
  color: var(--chip-binary-fg);
}

/* ============================== Diff pane ================================= */
#diff-pane {
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;   /* lines wrap; the pane never scrolls horizontally */
  position: relative;
}
#diff-sticky {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
#diff-sticky:empty { display: none; }
.mini-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  min-width: 0;
}
.mini-header .file-path,
.mini-header .rename-path { font-size: 12px; }
.mini-header .file-counts { font-size: 12px; }
.banner {
  padding: 6px 12px;
  font-size: 12px;
  border-top: 1px solid var(--border);
  color: var(--muted);
}
.banner.amber {
  background: var(--amber-banner-bg);
  color: var(--amber-banner-fg);
}

table.diff-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
/* one table per chunk of rows, laid out only near the screen */
.diff-chunk { content-visibility: auto; }
/* the cells also carry .mono, which gives them the code font */
td.gutter {
  width: 44px;
  text-align: right;
  padding: 0 6px 0 2px;
  font-size: 12px;
  line-height: 20px;
  color: var(--muted);
  user-select: none;
  vertical-align: top;
  background: var(--gutter);
}
td.code {
  position: relative;
  padding: 0 10px 0 22px;
  font-size: 12px;
  line-height: 20px;
  tab-size: 4;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  vertical-align: top;
}
/* the +/− sign lives outside the text flow so copied code stays clean */
td.code::before {
  position: absolute;
  left: 8px;
  top: 0;
  user-select: none;
}
tr.row-add td.code::before { content: "+"; }
tr.row-del td.code::before { content: "−"; }
tr.row-add td.code   { background: var(--add-line-bg); }
tr.row-add td.gutter { background: var(--add-gutter-bg); }
tr.row-del td.code   { background: var(--del-line-bg); }
tr.row-del td.gutter { background: var(--del-gutter-bg); }
/* the muted colour is too faint on the coloured gutters */
tr.row-add td.gutter, tr.row-del td.gutter { color: var(--text); }
/* the line a Check-tab finding points at */
tr.jump-target td {
  box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent);
}
tr.jump-target td:first-child { box-shadow: inset 0 1px 0 var(--accent),
  inset 0 -1px 0 var(--accent), inset 3px 0 0 var(--accent); }
td.sep {
  text-align: center;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--muted);
  background: var(--panel);
  user-select: none;
}
/* "Copied 3 lines": shown for a moment after code is selected in the diff */
.copy-notice {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 20;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  color: var(--text);
  font-size: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  pointer-events: none;
}
.copy-notice[hidden] { display: none; }

/* ============================== Cards ===================================== */
.card-holder {
  display: flex;
  justify-content: center;
  padding: 48px 24px;
}
.card {
  max-width: 480px;
  padding: 20px 24px;
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
}
.card .mono { font-size: 12px; }
.card .error-text {
  display: block;
  margin-top: 8px;
  font-size: 12px;
  overflow-wrap: anywhere;
}

/* ============================== Network view ============================== */
/* Colors here are directory lanes, --accent and amber only. */

/* The sidebar here is the Tree tab's commit list: picking a commit also
   drives the header and the diff. */
#app.network-mode { grid-template-columns: var(--wide-sidebar) 1fr; }
#app.network-mode #tree-list { display: block; }
#app.network-mode #branch-list,
#app.network-mode #branch-section-label { display: none; }
#app.network-mode #content {
  grid-template-columns: 1fr;
  min-width: 0;
}
#app.network-mode #file-panel,
#app.network-mode #diff-pane { display: none; }
#app.network-mode #network-pane { display: grid; }

#network-pane {
  display: none;
  grid-template-columns: 1fr 300px;
  grid-template-rows: auto 1fr;
  min-width: 0;
  min-height: 0;
}
@media (max-width: 1000px) {
  #network-pane { grid-template-columns: 1fr 240px; }
}
#network-legend {
  grid-column: 1 / -1;
  padding: 8px 12px 9px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}
#network-canvas {
  position: relative;
  overflow: hidden;
  min-width: 0;
  min-height: 0;
  background: var(--canvas);
  touch-action: none;
}
#network-canvas:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
#network-detail {
  border-left: 1px solid var(--border);
  overflow-y: auto;
  background: var(--panel);
  padding: 10px 12px;
}
/* a half-screen window: the detail column moves under the canvas; the
   legend and the detail each scroll within a fifth of the height, and the
   drawing keeps at least 200px */
@media (max-width: 900px) {
  #network-pane {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(200px, 1fr) auto;
  }
  #network-legend {
    max-height: 20vh;
    overflow-y: auto;
  }
  #network-detail {
    max-height: 20vh;
    border-left: none;
    border-top: 1px solid var(--border);
  }
}
/* a short window: the file list leaves the diff more of the height */
@media (max-width: 900px) and (max-height: 560px) {
  #file-panel { max-height: 22vh; }
}
#network-svg {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}
#network-svg.panning { cursor: grabbing; }

/* ---- Network: the legend strip ---- */
.net-legend-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
@media (max-width: 900px) {
  .net-legend-top { flex-wrap: wrap; } /* the buttons go under the sentence */
}
.net-legend-text {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 12px;
  line-height: 1.45;
}
.net-legend-strong { font-weight: 600; }
.net-legend-rest { color: var(--muted); }
.net-tools {
  flex: none;
  display: flex;
  gap: 6px;
}
.net-tool-button {
  font: inherit;
  font-size: 11px;
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--canvas);
  color: var(--text);
  cursor: pointer;
}
.net-tool-button:hover { background: var(--hover); }
.net-legend-keys {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 14px;
  margin-top: 6px;
}
.net-legend-key {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
}
.net-legend-swatch {
  flex: none;
  width: 22px;
  height: 13px;
  border-radius: 3px;
  border: 1.5px solid var(--muted);
  background: var(--panel);
}
.net-legend-swatch.changed {
  background: var(--selected);
  border-color: var(--accent);
}
.net-legend-swatch.cycle { border-color: var(--amber-dot); }
.net-legend-swatch.unread {
  border-style: dashed;
  background: var(--canvas);
}
.net-legend-dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}
.net-legend-commit {
  margin-top: 5px;
  font-size: 11px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
/* amber marks capping and size warnings only */
.net-note {
  font-size: 11px;
  line-height: 1.45;
  padding: 5px 7px;
  margin: 6px 0 0 0;
  border-radius: 4px;
  background: var(--amber-banner-bg);
  color: var(--amber-banner-fg);
}

/* ---- Network: the drawing ---- */
.net-node {
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.net-node-box {
  fill: var(--panel);
  stroke-width: 1.5;
}
.net-node.changed .net-node-box { fill: var(--selected); }
/* comes last so the "not read" look wins the fill; the dot and the bold name
   still mark a file the commit changed */
.net-node.unparsed .net-node-box {
  fill: var(--canvas);
  stroke-dasharray: 4 3;
}
.net-node.selected .net-node-box { stroke-width: 3; }
.net-node-halo {
  fill: var(--accent);
  opacity: 0;
}
.net-node.selected .net-node-halo { opacity: 0.14; }
.net-node-ring {
  fill: none;
  stroke: var(--amber-dot);
  stroke-width: 1.5;
}
.net-changed-dot { fill: var(--accent); }
.net-node-label {
  font-size: 11px;
  fill: var(--text);
}
.net-node.changed .net-node-label { font-weight: 600; }
.net-node.unparsed .net-node-label { fill: var(--muted); }
.net-node-dir {
  font-size: 10px;
  fill: var(--muted);
}
.net-band-rule {
  stroke: var(--border);
  stroke-width: 1;
  stroke-dasharray: 4 4;
}
.net-band-label {
  font-size: 10px;
  fill: var(--muted);
  letter-spacing: 0.5px;
}
.net-edge {
  fill: none;
  stroke: var(--muted);
  stroke-width: 1.25;
  opacity: 0.75;
}
.net-edge.cycle {
  stroke: var(--amber-dot);
  stroke-dasharray: 5 3;
}
/* .hi after .cycle so a highlighted plain edge turns accent; the rule below
   it puts amber back on a highlighted loop edge */
.net-edge.hi {
  stroke: var(--accent);
  stroke-width: 2;
}
.net-edge.cycle.hi { stroke: var(--amber-dot); }
/* A highlight fades the node and edge layers as two groups (the only
   subjects of dim-mode rules) and draws copies of the highlighted elements
   in the overlay above them. */
#network-svg.dim-mode #network-nodes { opacity: 0.18; }
#network-svg.dim-mode #network-edges { opacity: 0.15; }
#network-overlay { pointer-events: none; }
#network-overlay .net-edge { opacity: 1; }
/* one marker per arrowhead colour: a marker does not take the stroke of its
   path, so highlighting swaps marker-end */
#net-arrow path { fill: var(--muted); }
#net-arrow-hi path { fill: var(--accent); }
#net-arrow-cycle path { fill: var(--amber-dot); }

/* ---- Network: the detail column ---- */
.net-detail-head { margin-bottom: 12px; }
.net-detail-head:focus { outline: none; }
.net-detail-head:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}
.net-detail-path {
  font-size: 12px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.net-detail-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}
.net-chip {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 9px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: none;
}
.net-chip.changed {
  background: var(--selected);
  border-color: var(--accent);
  color: var(--accent);
}
.net-chip.cycle {
  background: var(--amber-banner-bg);
  border-color: var(--amber-dot);
  color: var(--amber-banner-fg);
}
.net-chip.unread { border-style: dashed; }
.net-chip.clickable {
  font: inherit;
  font-size: 10px;
  cursor: pointer;
}
.net-chip.clickable:hover { background: var(--hover); }
.net-detail-section { margin-bottom: 14px; }
.net-detail-label {
  font-size: 11px;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin-bottom: 4px;
}
.net-detail-note {
  font-size: 11px;
  line-height: 1.45;
  color: var(--muted);
  margin-bottom: 6px;
}
.net-detail-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  margin-bottom: 14px;
}
.net-neighbour-row {
  display: block;
  width: 100%;
  padding: 4px 5px;
  border: none;
  border-radius: 4px;
  background: none;
  font: inherit;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.net-neighbour-row:hover { background: var(--hover); }
.net-neighbour-row .file-path { font-size: 12px; }
.net-symbols {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: 3px;
}
.net-symbol {
  font-size: 10px;
  padding: 0 4px;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--muted);
}
.net-symbol.none {
  border-style: dashed;
  font-style: italic;
}
.net-toggle {
  font: inherit;
  font-size: 10px;
  padding: 0 4px;
  border: none;
  background: none;
  color: var(--accent);
  cursor: pointer;
}
.net-summary-line {
  font-size: 11px;
  line-height: 1.5;
  color: var(--muted);
  margin-bottom: 3px;
  overflow-wrap: anywhere;
}
.net-summary-line.strong {
  color: var(--text);
  font-weight: 600;
}
.net-dir-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 3px;
  overflow-wrap: anywhere;
}
.net-dir-swatch {
  flex: none;
  width: 13px;
  height: 13px;
  border-radius: 3px;
  border: 2px solid var(--border);
}

/* a "Reading…" note, made visible by revealAfterDelay() */
.loading-note { visibility: hidden; }
.loading-note.shown { visibility: visible; }

/* ============================== Flash & motion ============================ */
@keyframes row-flash {
  from { background-color: var(--flash); }
  to   { background-color: transparent; }
}
.flash { animation: row-flash 900ms ease-out 1; }

/* the pseudo-elements carry the running meter and spinners */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* High contrast drops shadows and backgrounds: selection uses system colours */
@media (forced-colors: active) {
  .view-tab, .branch-row, .file-row { border-color: Canvas; }
  .view-tab.selected { border-bottom-color: Highlight; }
  .branch-row.selected, .file-row.selected { border-left-color: Highlight; }
  .tree-row.selected { outline: 2px solid Highlight; outline-offset: -2px; }
  .uncommitted-dot { forced-color-adjust: none; background: Mark; }
  #live-dot { forced-color-adjust: none; background: Highlight; }
  #live-dot.off { background: GrayText; }
}

/* Printing: the whole diff on paper, without the sidebar and the lists */
@media print {
  html, body { height: auto; overflow: visible; }
  #app, #main, #content { display: block; height: auto; overflow: visible; }
  #sidebar, #security-banner, #file-panel { display: none !important; }
  #app:not(.network-mode) #network-pane { display: none; }
  #network-canvas { height: 60vh; }
  #diff-pane { overflow: visible; height: auto; }
  #diff-sticky { position: static; }
  .diff-chunk { content-visibility: visible; }
}
</style>

<body>
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-top">
      <h1 id="repo-name"></h1>
      <div id="view-tabs" role="tablist" aria-label="Views">
        <button id="tab-branches" class="view-tab selected" type="button" role="tab" aria-selected="true">Branches</button>
        <button id="tab-tree" class="view-tab" type="button" role="tab" aria-selected="false" tabindex="-1">Tree</button>
        <button id="tab-check" class="view-tab" type="button" role="tab" aria-selected="false" tabindex="-1">Check</button>
        <button id="tab-network" class="view-tab" type="button" role="tab" aria-selected="false" tabindex="-1">Network</button>
      </div>
      <div id="branch-section-label"></div>
    </div>
    <nav id="branch-list" tabindex="0" aria-label="Branches"></nav>
    <div id="tree-list" tabindex="0" aria-label="History"></div>
    <div id="check-list"></div>
    <div id="live-footer">
      <span id="live-dot"></span>
      <span id="live-text"></span>
    </div>
  </aside>
  <main id="main">
    <div id="security-banner"></div>
    <header id="header-bar">
      <div id="header-line1"></div>
      <div id="header-line2"></div>
      <div id="commit-message"></div>
    </header>
    <div id="content">
      <section id="file-panel" aria-label="Files">
        <div id="file-list-header"></div>
        <div id="file-list" tabindex="0" aria-label="Changed files"></div>
      </section>
      <section id="diff-pane" aria-label="Diff">
        <div id="diff-sticky"></div>
        <div id="diff-body"></div>
        <div id="copy-notice" class="copy-notice" role="status" aria-live="polite" hidden></div>
      </section>
      <section id="network-pane" aria-label="Network">
        <div id="network-legend"></div>
        <div id="network-canvas" tabindex="0" role="group" aria-label="Dependency network" aria-describedby="network-key-help"></div>
        <div id="network-detail"></div>
      </section>
    </div>
  </main>
</div>
<div id="sr-status" class="visually-hidden" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================== Constants & elements ====================== */

var MINUS = "−"; // typographic minus used for deletion counts everywhere

var SVG_NAMESPACE = "http://www.w3.org/2000/svg";

var repoNameElement = document.getElementById("repo-name");
var branchSectionLabelElement = document.getElementById("branch-section-label");
var branchListElement = document.getElementById("branch-list");
var treeListElement = document.getElementById("tree-list");
var appElement = document.getElementById("app");
var tabBranchesElement = document.getElementById("tab-branches");
var tabTreeElement = document.getElementById("tab-tree");
var tabCheckElement = document.getElementById("tab-check");
var tabNetworkElement = document.getElementById("tab-network");
var checkListElement = document.getElementById("check-list");
var networkLegendElement = document.getElementById("network-legend");
var networkCanvasElement = document.getElementById("network-canvas");
var networkDetailElement = document.getElementById("network-detail");
var liveDotElement = document.getElementById("live-dot");
var liveTextElement = document.getElementById("live-text");
var headerLine1Element = document.getElementById("header-line1");
var headerLine2Element = document.getElementById("header-line2");
var commitMessageElement = document.getElementById("commit-message");
var fileListHeaderElement = document.getElementById("file-list-header");
var fileListElement = document.getElementById("file-list");
var diffStickyElement = document.getElementById("diff-sticky");
var diffBodyElement = document.getElementById("diff-body");
var securityBannerElement = document.getElementById("security-banner");
var srStatusElement = document.getElementById("sr-status");

/* ============================== App state ================================= */

var currentState = null;          // last /api/state payload
var lastStateToken = null;
var lastSidebarJson = null;       // JSON of the sidebar region, for change detection
var lastHeaderJson = null;        // JSON of the header's state-derived part
var stateErrorText = null;        // readable /api/state error reported by the server
var previousBranchRowJson = null; // map branch name -> row JSON, for flash detection

var selectedBranchName = null;    // selection survives re-renders by NAME
var selectedCommitSha = null;     // ... or by full commit sha (never both at once)
var selectedFilePath = null;      // selection survives re-renders by PATH
// A line a Check-tab finding asked to scroll to once its file is drawn:
// {path, line}, or null.
var pendingLineJump = null;
var branchVanished = false;
var commitVanished = false;

var viewMode = "branches";        // "branches"|"tree"|"check"|"network", in memory
var currentGraph = null;          // last /api/graph payload
var lastGraphJson = null;
var lastTreeJson = null;          // JSON of the tree region, for change detection
var previousTreeRowJson = null;   // map row key -> row JSON, for flash detection
var baseSha = null;               // "compare from here" base commit, or null

var currentDiff = null;           // last /api/diff payload for the open branch
var lastDiffJson = null;
var diffErrorText = null;         // server error text when the diff request failed
var previousFileRowJson = null;   // map file path -> row JSON, for flash detection

var currentFile = null;           // last /api/file payload for the open file
var lastFileJson = null;
var fileErrorText = null;
var fileVanished = false;
var fileReloadDeferred = false;   // the open file changed while the Network view hid it
var fileToRestore = null;         // file named in the address, opened once its diff loads
var restoringCommit = false;      // the commit is the one named in the address, not yet answered

// One serial per loader, bumped when a request is issued: only the newest
// request may render. A poll never re-issues one that is still running: it
// sets the loader's "wanted" flag, and the loader asks again once the
// answer on its way is shown.
var diffRequestSerial = 0;
var diffRequestPending = false;
var diffReloadWanted = false;
var fileRequestSerial = 0;
var fileRequestPending = false;
var fileReloadWanted = false;
var graphRequestSerial = 0;
var graphRequestPending = false;
var graphReloadWanted = false;

var lastLaunchId = null;          // launch_id in the latest /api/state answer
var serverRestarted = false;      // a later answer came from another server process

var pollTimerId = null;
var pollInFlight = false;
var footerState = "live";         // "live" | "paused" | "lost"

var securityEnabled = null;       // null = not probed yet; false = server has no feed
var securityState = null;         // last /api/security payload
var lastSecurityJson = null;

/* ============================== Small helpers ============================= */

function makeElement(tagName, className) {
  var node = document.createElement(tagName);
  if (className) {
    node.className = className;
  }
  return node;
}

function makeText(tagName, className, text) {
  var node = makeElement(tagName, className);
  node.textContent = text;
  return node;
}

function clearNode(node) {
  while (node.firstChild) {
    node.removeChild(node.firstChild);
  }
}

// Screen readers read out the text of this hidden status line.
function announce(text) {
  if (srStatusElement.textContent !== text) {
    srStatusElement.textContent = text;
  }
}

function preserveScroll(regionElement, renderFunction) {
  var savedTop = regionElement.scrollTop;
  renderFunction();
  var maxTop = regionElement.scrollHeight;
  regionElement.scrollTop = Math.min(savedTop, maxTop);
}

// A "Reading…" note becomes visible only once the answer has taken 400 ms.
// It holds its space from the start.
var LOADING_NOTE_DELAY_MS = 400;

function revealAfterDelay(element) {
  element.classList.add("loading-note");
  window.setTimeout(function () {
    element.classList.add("shown");
  }, LOADING_NOTE_DELAY_MS);
  return element;
}

function flashRow(rowElement) {
  rowElement.classList.add("flash");
  rowElement.addEventListener("animationend", function () {
    rowElement.classList.remove("flash");
  }, { once: true });
}

// Request timeouts in ms. The first state request outlasts the server's git
// limit (GIT_TIMEOUT_SECONDS in gitops.py, 60 s), so a git stopped for time
// reaches the page as an error; the server keeps that error for later polls.
// The Network view can parse a whole tree, so its limit is long.
var TIMEOUT_STATE_MS = 8000;
var TIMEOUT_FIRST_STATE_MS = 75000;
var TIMEOUT_LOAD_MS = 30000;
var TIMEOUT_NETWORK_MS = 120000;
// the server gives a push up to 120 s, so a POST waits a little longer
var TIMEOUT_POST_MS = 150000;

// Returns {ok, status, body}; throws only on a network failure or the timeout.
function fetchJson(url, timeoutMs) {
  return requestJson(url, { cache: "no-store" }, timeoutMs);
}

// The secret every POST carries. The URL BranchLens prints opens
// /#token=<secret>; the page moves the secret into localStorage, which is
// per port (cookies are shared between ports), and removes it from the
// address. A reload or a second tab reads it from there.
var PAGE_TOKEN_STORAGE_KEY = "branchlens-page-token";

function readPageToken() {
  var match = /^#token=([0-9a-f]+)$/.exec(window.location.hash);
  if (match !== null) {
    try {
      window.localStorage.setItem(PAGE_TOKEN_STORAGE_KEY, match[1]);
    } catch (error) {
      // storage blocked: this tab still has the token until it reloads
    }
    try {
      history.replaceState(null, "", window.location.pathname);
    } catch (error) {
      // the token stays in the address bar; the page works the same
    }
    return match[1];
  }
  try {
    return window.localStorage.getItem(PAGE_TOKEN_STORAGE_KEY) || "";
  } catch (error) {
    return "";
  }
}

var PAGE_TOKEN = readPageToken();

// POST a JSON body with the page token; same result shape as fetchJson.
// Only Run, Cancel and Push use it.
function postJson(url, body) {
  var options = {
    method: "POST",
    cache: "no-store",
    headers: {
      "Content-Type": "application/json",
      "X-BranchLens-Token": PAGE_TOKEN
    },
    body: JSON.stringify(body)
  };
  return requestJson(url, options, TIMEOUT_POST_MS);
}

// The shared part of fetchJson and postJson: the request, its timeout, and
// the reply read as JSON (null when the body is not JSON).
function requestJson(url, options, timeoutMs) {
  var controller = null;
  var timerId = null;
  if (typeof AbortController !== "undefined") {
    controller = new AbortController();
    options.signal = controller.signal;
    timerId = window.setTimeout(function () {
      controller.abort();
    }, timeoutMs || TIMEOUT_LOAD_MS);
  }
  function clearTimer() {
    if (timerId !== null) {
      window.clearTimeout(timerId);
    }
  }
  return fetch(url, options).then(function (response) {
    return response.json().catch(function () { return null; }).then(function (body) {
      clearTimer();
      return { ok: response.ok, status: response.status, body: body };
    });
  }, function (error) {
    clearTimer();
    throw error;
  });
}

function pluralize(count, singular, plural) {
  if (count === 1) {
    return count + " " + singular;
  }
  return count + " " + plural;
}

// The main panes follow either a branch or a commit; never both at once.
function hasSelection() {
  return selectedBranchName !== null || selectedCommitSha !== null;
}

/* ============================== Relative time ============================= */

function relativeTime(isoString) {
  var then = new Date(isoString).getTime();
  if (isNaN(then)) {
    return "";
  }
  var seconds = Math.floor((Date.now() - then) / 1000);
  if (seconds < 45) {
    return "just now";
  }
  var minutes = Math.floor(seconds / 60);
  if (minutes < 60) {
    return Math.max(minutes, 1) + " min ago";
  }
  var hours = Math.floor(minutes / 60);
  if (hours < 24) {
    return pluralize(hours, "hour ago", "hours ago");
  }
  var days = Math.floor(hours / 24);
  if (days === 1) {
    return "yesterday";
  }
  if (days < 7) {
    return days + " days ago";
  }
  var weeks = Math.floor(days / 7);
  if (days < 31) {
    return pluralize(weeks, "week ago", "weeks ago");
  }
  var months = Math.floor(days / 30);
  if (months < 12) {
    return pluralize(Math.max(months, 1), "month ago", "months ago");
  }
  var years = Math.floor(days / 365);
  return pluralize(Math.max(years, 1), "year ago", "years ago");
}

// Tick the visible relative times without re-rendering anything else.
function updateRelativeTimes() {
  var timeSpans = document.querySelectorAll(".rel-time");
  for (var i = 0; i < timeSpans.length; i++) {
    var span = timeSpans[i];
    var newText = relativeTime(span.getAttribute("data-when"));
    if (span.textContent !== newText) {
      span.textContent = newText;
    }
  }
}

/* ============================== Footer (live dot) ========================= */

function setFooter(state) {
  if (footerState === state) {
    return;
  }
  var previousState = footerState;
  footerState = state;
  if (state === "live") {
    liveDotElement.classList.remove("off");
    liveTextElement.textContent = "Live: updates automatically";
    if (previousState === "lost" || previousState === "slow") {
      announce("Back in contact with the local server.");
    }
  } else if (state === "paused") {
    liveDotElement.classList.add("off");
    liveTextElement.textContent = "Paused: tab in background";
  } else if (state === "slow") {
    liveDotElement.classList.add("off");
    liveTextElement.textContent = "The local server is slow to answer; waiting…";
    announce("The local server is slow to answer.");
  } else {
    liveDotElement.classList.add("off");
    liveTextElement.textContent = "Lost contact with the local server; retrying…";
    announce("Lost contact with the local server.");
  }
}

// The footer state after a request threw: a timeout means the server is
// slow, anything else that it is out of reach.
function footerStateFor(error) {
  return error && error.name === "AbortError" ? "slow" : "lost";
}

function pulseLiveDot() {
  liveDotElement.classList.remove("pulse");
  // force a reflow so a rapid second pulse restarts the animation
  void liveDotElement.offsetWidth;
  liveDotElement.classList.add("pulse");
}

// Removes the class after each pulse. With reduced motion nothing animates
// and the class stays until the next pulse.
liveDotElement.addEventListener("animationend", function () {
  liveDotElement.classList.remove("pulse");
});

/* ============================== Sidebar =================================== */

function sidebarRegionJson(stateBody) {
  return sidebarJson([stateBody.repo_name, stateBody.default_branch, stateBody.branches,
    stateBody.detached_worktrees]);
}

// JSON of what the sidebar shows. A branch's content_token is left out: it
// moves on every edit, and the row shows nothing of it.
function sidebarJson(value) {
  return JSON.stringify(value, function (key, item) {
    return key === "content_token" ? undefined : item;
  });
}

// The name of the ref every branch is compared with. When the default branch
// has an online copy, counts and fork points are measured against it and the
// local branch of the same name may sit elsewhere, so the label is
// "origin/main", not "main".
function comparisonLabel(stateBody) {
  if (!stateBody) {
    return "";
  }
  if (typeof stateBody.comparison_label === "string") {
    return stateBody.comparison_label;
  }
  return stateBody.default_branch || "";
}

// The base that compares with nothing ("compare from the beginning", and a
// first publish's default): every file counts as new, and a run judges the
// whole history. The server and the toolkit read the same word.
var EMPTY_TREE_BASE = "empty-tree";

// The base a run started from this page uses when no base is picked in the
// Tree (the page then sends none): for the default branch, nothing on a
// first publish, else its push remote's copy ("upstream/main"); for any
// other branch, the comparison ref.
function defaultRunBase(branch) {
  if (branch !== null && branch.is_default && currentState &&
      currentState.first_publish === true) {
    return EMPTY_TREE_BASE;
  }
  if (branch !== null && branch.is_default && currentState &&
      typeof currentState.push_remote === "string") {
    return currentState.push_remote + "/" + currentState.default_branch;
  }
  return comparisonLabel(currentState);
}

// True when a run on this branch from the empty tree is the default
// branch's first publish: its push remote has no copy of it yet.
function isFirstPublishRun(branchName) {
  return currentState !== null && currentState.first_publish === true &&
    branchName !== null && branchName === currentState.default_branch;
}

// The subject of a commit in the loaded graph, or null when it is not there.
function graphCommitSubject(sha) {
  if (currentGraph === null) {
    return null;
  }
  for (var i = 0; i < currentGraph.commits.length; i++) {
    if (currentGraph.commits[i].sha === sha) {
      return currentGraph.commits[i].subject;
    }
  }
  return null;
}

// A run's base as plain words, for a dialog: "nothing (whole history)" for
// the empty tree ("nothing (first publish)" on a first publish), a commit
// by its short id and subject, any other ref by its name.
function runBaseText(base, branchName) {
  if (base === EMPTY_TREE_BASE) {
    return isFirstPublishRun(branchName) ? "nothing (first publish)" : "nothing (whole history)";
  }
  if (COMMIT_ID_PATTERN.test(base)) {
    var subject = graphCommitSubject(base);
    return base.slice(0, 7) + (subject !== null ? " “" + subject + "”" : "");
  }
  return base;
}

// Appends a run's base, worded as runBaseText words it, with ids and ref
// names in monospace. branchName is the branch the run checks.
function appendRunBase(parent, base, branchName) {
  if (base === EMPTY_TREE_BASE) {
    parent.appendChild(document.createTextNode(isFirstPublishRun(branchName) ?
      "nothing (first publish)" : "nothing (whole history)"));
  } else if (COMMIT_ID_PATTERN.test(base)) {
    parent.appendChild(makeText("span", "mono", base.slice(0, 7)));
    var subject = graphCommitSubject(base);
    if (subject !== null) {
      parent.appendChild(document.createTextNode(" “" + subject + "”"));
    }
  } else {
    parent.appendChild(makeText("span", "mono", base));
  }
}

function diffBaseLabel(diffBody) {
  if (!diffBody) {
    return null;
  }
  if (typeof diffBody.base_label === "string") {
    return diffBody.base_label;
  }
  if (typeof diffBody.base === "string") {
    return diffBody.base;
  }
  return null;
}

// The amber dot, with a tooltip and a screen-reader label.
function makeUncommittedDot() {
  var dot = makeElement("span", "uncommitted-dot");
  dot.title = "Has edits not yet committed";
  dot.setAttribute("role", "img");
  dot.setAttribute("aria-label", "edits not yet committed");
  return dot;
}

// The muted chip for a folder whose git status failed, with git's message.
function makeStatusErrorChip(statusError) {
  var chip = makeText("span", "chip chip-default", "edits unknown");
  chip.title = "Could not read the uncommitted changes: " + statusError;
  return chip;
}

function makeBranchRow(branch, comparisonName) {
  var row = makeElement("div", "branch-row");
  row.dataset.branchName = branch.name;
  if (branch.name === selectedBranchName) {
    row.classList.add("selected");
  }

  var line1 = makeElement("div", "branch-line1");
  var nameSpan = makeText("span", "branch-name mono", branch.name);
  nameSpan.title = branch.name; // the ellipsis hides the end of long names
  line1.appendChild(nameSpan);
  if (branch.is_default) {
    line1.appendChild(makeText("span", "chip chip-default", "default"));
  }
  if (branch.worktree_path !== null) {
    var checkedText = branch.is_current ? "checked out here" : "checked out";
    var checkedChip = makeText("span", "chip chip-checked", checkedText);
    checkedChip.title = branch.is_current ?
      "Open in the folder BranchLens was started from" :
      "Open in another folder (a worktree): " + branch.worktree_path;
    line1.appendChild(checkedChip);
  }
  if (branch.has_uncommitted) {
    line1.appendChild(makeUncommittedDot());
  }
  if (typeof branch.status_error === "string") {
    line1.appendChild(makeStatusErrorChip(branch.status_error));
  }
  row.appendChild(line1);

  var line2 = makeText("div", "branch-line2", branch.last_commit_subject || "");
  line2.title = branch.last_commit_subject || "";
  row.appendChild(line2);

  var line3 = makeElement("div", "branch-line3");
  var timeSpan = makeText("span", "rel-time", relativeTime(branch.last_commit_date));
  timeSpan.setAttribute("data-when", branch.last_commit_date || "");
  line3.appendChild(timeSpan);

  // The default branch is counted too when it has an online copy (the server
  // sends 0 and 0 otherwise): its new commits are what a push would send.
  var parts = [];
  if (branch.ahead > 0) {
    parts.push(pluralize(branch.ahead, "new commit", "new commits"));
  }
  if (branch.behind > 0) {
    parts.push(branch.behind + " missing");
  }
  if (parts.length > 0) {
    var wordsSpan = makeText("span", "", " · " + parts.join(" · "));
    wordsSpan.title = "Compared with " + comparisonName + ": " +
      pluralize(branch.ahead, "commit", "commits") + " this branch has, " +
      pluralize(branch.behind, "commit", "commits") + " it is missing";
    line3.appendChild(wordsSpan);
  }
  row.appendChild(line3);

  row.addEventListener("click", function () {
    selectBranch(branch.name);
    if (returnToCheckAfterPick) {
      switchView("check"); // the Run card's "change" link sent the user here
    }
  });
  return row;
}

// A folder checked out on no branch (a rebase, a bisect, a single commit, a
// submodule's own checkout) or on a branch with no commit yet. Only branches
// with commits are compared, so the row says its edits are not shown.
function makeDetachedRow(entry) {
  var row = makeElement("div", "branch-row detached-row");
  var pathParts = entry.path.split("/");
  var line1 = makeElement("div", "branch-line1");
  line1.appendChild(makeText("span", "branch-name mono", pathParts[pathParts.length - 1]));
  line1.appendChild(makeText("span", "chip chip-default", "not compared"));
  if (entry.has_uncommitted) {
    line1.appendChild(makeUncommittedDot());
  }
  if (typeof entry.status_error === "string") {
    line1.appendChild(makeStatusErrorChip(entry.status_error));
  }
  row.appendChild(line1);
  row.appendChild(makeText("div", "branch-line2",
    "No branch with commits here; its edits are not shown."));
  row.title = entry.path + "\nThis folder is checked out on no branch (a " +
    "rebase, a bisect, a single commit or a submodule's own checkout), or on " +
    "a branch with no commit yet. BranchLens compares branches that have " +
    "commits, so what changed here is not listed.";
  return row;
}

function renderSidebar() {
  if (!currentState) {
    return;
  }
  repoNameElement.textContent = currentState.repo_name;
  repoNameElement.title = currentState.repo_name;

  clearNode(branchSectionLabelElement);
  branchSectionLabelElement.appendChild(
    document.createTextNode("BRANCHES: ALL COMPARED WITH "));
  branchSectionLabelElement.appendChild(
    makeText("span", "mono", comparisonLabel(currentState)));

  var allowFlash = previousBranchRowJson !== null;
  var newRowJson = {};

  clearNode(branchListElement);
  for (var i = 0; i < currentState.branches.length; i++) {
    var branch = currentState.branches[i];
    var row = makeBranchRow(branch, comparisonLabel(currentState));
    var rowJson = sidebarJson(branch);
    newRowJson[branch.name] = rowJson;
    if (allowFlash && previousBranchRowJson[branch.name] !== rowJson) {
      flashRow(row);
    }
    branchListElement.appendChild(row);
  }
  var detachedWorktrees = currentState.detached_worktrees || [];
  for (var k = 0; k < detachedWorktrees.length; k++) {
    branchListElement.appendChild(makeDetachedRow(detachedWorktrees[k]));
  }
  previousBranchRowJson = newRowJson;
  updateRunCard(); // the Check tab's Run card shows a branch from this list
}

function updateSidebarSelection() {
  var rows = branchListElement.children;
  for (var i = 0; i < rows.length; i++) {
    var isSelected = rows[i].dataset.branchName === selectedBranchName;
    rows[i].classList.toggle("selected", isSelected);
    if (isSelected) {
      rows[i].scrollIntoView({ block: "nearest" });
    }
  }
  // The Run card, and on the Check tab the "Last check" line, name the selection.
  if (viewMode === "check") {
    renderCheckPanel();
  } else {
    updateRunCard();
  }
}

// Keyboard: ArrowUp / ArrowDown move the branch selection when the list has
// focus; Enter returns to the Check tab after its "change" link.
branchListElement.addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    if (returnToCheckAfterPick && selectedBranchName !== null) {
      event.preventDefault();
      switchView("check");
      // back to the "change" link, or to the tab while a run hides that link
      if (runCard.change.hidden) {
        tabCheckElement.focus();
      } else {
        runCard.change.focus();
      }
    }
    return;
  }
  if (event.key !== "ArrowUp" && event.key !== "ArrowDown") {
    return;
  }
  event.preventDefault(); // stop the list from scrolling under the selection
  if (currentState === null || currentState.branches.length === 0) {
    return;
  }
  var names = [];
  for (var i = 0; i < currentState.branches.length; i++) {
    names.push(currentState.branches[i].name);
  }
  var index = selectedCommitSha === null ? names.indexOf(selectedBranchName) : -1;
  if (index === -1) {
    index = 0;
  } else if (event.key === "ArrowDown") {
    index = Math.min(index + 1, names.length - 1);
  } else {
    index = Math.max(index - 1, 0);
  }
  if (names[index] !== selectedBranchName || selectedCommitSha !== null) {
    selectBranch(names[index]);
    announce("Branch " + names[index] + ", " + (index + 1) + " of " + names.length);
  }
});

/* ============================== Tree view ================================= */
/* LANES-EXTRACT-BEGIN (pure functions, no DOM; test.sh runs them under node) */

// Lane geometry. Two lanes never share an x: their lines would merge into one
// column that reads as a parent edge git does not have. The spacing shrinks
// to fit, and lanes that still do not fit are drawn as marks with no lines and
// counted in a note under the tree.
var TREE_LANE_SPACING = 14;      // comfortable spacing, used whenever it fits
var TREE_MIN_LANE_SPACING = 8;   // closer than this and dots would touch
var TREE_MAX_GRAPH_WIDTH = 300;  // the graph column never eats more than this

// Set by renderTree before any row is built; the defaults give the standard
// spacing.
var treeLaneSpacing = TREE_LANE_SPACING;
var treeLaneBudget = 20;

function computeTreeLaneGeometry(laneCount) {
  var spacing = TREE_LANE_SPACING;
  if (laneCount * TREE_LANE_SPACING + 8 > TREE_MAX_GRAPH_WIDTH) {
    spacing = Math.floor((TREE_MAX_GRAPH_WIDTH - 8) / laneCount);
    if (spacing < TREE_MIN_LANE_SPACING) {
      spacing = TREE_MIN_LANE_SPACING;
    }
  }
  var budget = Math.floor((TREE_MAX_GRAPH_WIDTH - 8) / spacing);
  if (budget < 1) {
    budget = 1;
  }
  var overflow = laneCount > budget;
  var drawn = overflow ? budget : laneCount;
  var slots = overflow ? drawn + 1 : drawn;
  return {
    spacing: spacing,
    drawn: drawn,
    overflow: overflow,
    hidden: overflow ? laneCount - drawn : 0,
    width: slots * spacing + 8
  };
}

// x position of a lane's center inside the graph column.
function laneX(laneIndex) {
  return 4 + laneIndex * treeLaneSpacing + Math.round(treeLaneSpacing / 2);
}

// False for a lane past the right edge of the column; nothing is drawn for it.
function laneIsDrawn(laneIndex) {
  return laneIndex < treeLaneBudget;
}

// The commits that own lane 0: the default branch tip and its first-parent
// chain. The walk starts from the online copy of the default branch when the
// graph carries it, else from the local tip, and stops at a parent outside
// the graph window. The result is empty when the tip is not in the window.
function buildTrunkShas(commits, defaultBranchName, onlineTipSha) {
  var trunkShas = {};
  var commitBySha = {};
  for (var i = 0; i < commits.length; i++) {
    commitBySha[commits[i].sha] = commits[i];
  }
  var walker = null;
  if (onlineTipSha && commitBySha[onlineTipSha] !== undefined) {
    walker = commitBySha[onlineTipSha];
  } else if (defaultBranchName) {
    for (var j = 0; j < commits.length; j++) {
      if (commits[j].tips.indexOf(defaultBranchName) !== -1) {
        walker = commits[j];
        break;
      }
    }
  }
  while (walker !== null) {
    trunkShas[walker.sha] = true;
    var firstParent = walker.parents.length > 0 ? walker.parents[0] : null;
    walker = firstParent !== null && commitBySha[firstParent] !== undefined ?
      commitBySha[firstParent] : null;
  }
  return trunkShas;
}

// gitk-style lane assignment, except that lane 0 is kept for the default
// branch's chain (`trunkShas`), which draws as the straight accent spine. An
// empty trunk set (tip outside the window) gives plain gitk behavior.
// Walks the commits in the given (topo, newest-first) order and returns
// per-commit drawing instructions:
//   lane          lane index of this commit's dot
//   activeBefore  lane indexes carrying an edge when the row starts
//   hasIncoming   an edge from above ends in this dot (its own lane expected it)
//   closes        other lanes whose edges also bend into this dot
//   hasOutgoing   an edge continues below the dot (first parent is drawn)
//   mergeEdges    lane indexes the extra (merge) parents connect to
function assignLanes(commits, trunkShas) {
  var trunk = trunkShas || {};
  var lowestFreeLane = Object.keys(trunk).length > 0 ? 1 : 0;

  var knownShas = {};
  for (var s = 0; s < commits.length; s++) {
    knownShas[commits[s].sha] = true;
  }

  var laneExpected = []; // index -> the sha this lane is waiting for, or null
  var rows = [];
  var maxLaneIndex = -1;

  function firstFreeLane() {
    for (var f = lowestFreeLane; f < laneExpected.length; f++) {
      if (laneExpected[f] === null) {
        return f;
      }
    }
    while (laneExpected.length < lowestFreeLane) {
