// Query string for the current selection, plus the compare base when set.
function targetQuery(branchName, commitSha, requestBase) {
  var query;
  if (branchName !== null) {
    query = "branch=" + encodeURIComponent(branchName);
  } else {
    query = "commit=" + encodeURIComponent(commitSha);
  }
  if (requestBase !== null) {
    query = query + "&base=" + encodeURIComponent(requestBase);
  }
  return query;
}

function loadDiff() {
  var branchName = selectedBranchName;
  var commitSha = selectedCommitSha;
  var requestBase = baseSha;
  if (branchName === null && commitSha === null) {
    return;
  }
  diffRequestSerial += 1;
  var serial = diffRequestSerial;
  diffRequestPending = true;
  diffReloadWanted = false; // this request covers it
  var url = "/api/diff?" + targetQuery(branchName, commitSha, requestBase);
  fetchJson(url).then(function (result) {
    if (serial !== diffRequestSerial) {
      return; // a newer request was issued meanwhile: only that one renders
    }
    diffRequestPending = false;
    if (diffReloadWanted) {
      diffReloadWanted = false;
      window.setTimeout(loadDiff, 0); // runs once this answer is handled
    }
    if (branchName !== selectedBranchName || commitSha !== selectedCommitSha ||
        requestBase !== baseSha) {
      return; // stale response: the selection or base changed meanwhile
    }
    if (result.status === 404) {
      if (requestBase !== null) {
        // The base may have left the history before the graph noticed: drop
        // it and retry, keeping the selection. The retry reports a branch or
        // commit that is really gone.
        baseSha = null;
        rememberViewInAddress();
        renderTreeIfChanged();
        renderHeader();
        loadDiff();
        return;
      }
      if (branchName !== null) {
        handleBranchVanished();
      } else {
        handleCommitVanished();
      }
      return;
    }
    restoringCommit = false; // the server knows the commit
    if (!result.ok || result.body === null) {
      var message = (result.body && result.body.error) ?
        String(result.body.error) : "The server reported an unexpected problem.";
      if (message === diffErrorText) {
        return;
      }
      diffErrorText = message;
      currentDiff = null;
      lastDiffJson = null;
      lastFileJson = null; // the card replaced the file: draw it again on recovery
      renderHeader();
      renderFileList();
      renderDiffPane();
      return;
    }
    var json = JSON.stringify(result.body);
    if (json === lastDiffJson) {
      // The list can stay the same while the open file's lines change (an
      // edit that keeps its counts). A commit's lines never change.
      if (selectedBranchName !== null && selectedFilePath !== null && !fileVanished) {
        refreshOpenFile();
      }
      return;
    }
    lastDiffJson = json;
    currentDiff = result.body;
    diffErrorText = null;

    renderHeader();
    preserveScroll(fileListElement, renderFileList);

    if (selectedFilePath === null) {
      // Auto-open only when nothing is open (opening is not switching): the
      // file named in the address when it is in the list, else the largest.
      var best = null;
      if (fileToRestore !== null) {
        best = findShowableFileEntry(fileToRestore);
        fileToRestore = null;
      }
      if (best === null) {
        best = pickLargestFile(currentDiff.files);
      }
      if (best) {
        selectFile(best.path);
      } else {
        renderDiffPane();
      }
      return;
    }
    var entry = findFileEntry(selectedFilePath);
    if (entry === null) {
      fileVanished = true;
      lastFileJson = null; // the card replaced the file: draw it again on recovery
      renderDiffPane();
      return;
    }
    fileVanished = false;
    renderDiffSticky(); // counts in the mini-header may have changed
    refreshOpenFile();
  }).catch(function (error) {
    if (serial === diffRequestSerial) {
      diffRequestPending = false;
    }
    setFooter(footerStateFor(error));
  });
}

// Polls reload the comparison through here: a request already on its way is
// kept, and the comparison is asked for again once its answer is in.
function refreshDiff() {
  if (diffRequestPending) {
    diffReloadWanted = true;
  } else {
    loadDiff();
  }
}

// The same for the open file. While the Network view hides the diff pane,
// the load waits until the pane shows again.
function refreshOpenFile() {
  if (viewMode === "network") {
    fileReloadDeferred = true;
  } else if (fileRequestPending) {
    fileReloadWanted = true;
  } else {
    loadFile();
  }
}

function loadFile() {
  var branchName = selectedBranchName;
  var commitSha = selectedCommitSha;
  var requestBase = baseSha;
  var path = selectedFilePath;
  if ((branchName === null && commitSha === null) || path === null) {
    return;
  }
  var freshSelection = lastFileJson === null;
  fileRequestSerial += 1;
  var serial = fileRequestSerial;
  fileRequestPending = true;
  fileReloadWanted = false; // this request covers it
  var url = "/api/file?" + targetQuery(branchName, commitSha, requestBase) +
            "&path=" + encodeURIComponent(path);
  fetchJson(url).then(function (result) {
    if (serial !== fileRequestSerial) {
      return; // a newer request was issued meanwhile
    }
    fileRequestPending = false;
    if (fileReloadWanted) {
      fileReloadWanted = false;
      window.setTimeout(refreshOpenFile, 0); // runs once this answer is handled
    }
    if (branchName !== selectedBranchName || commitSha !== selectedCommitSha ||
        requestBase !== baseSha || path !== selectedFilePath) {
      return; // stale response
    }
    if (result.status === 404) {
      fileVanished = true;
      lastFileJson = null; // the card replaced the file: draw it again on recovery
      renderDiffPane();
      if (requestBase !== null) {
        // The file may have left the comparison, or the base the history
        // before the graph noticed. The comparison tells them apart: its 404
        // drops the base, its file list shows whether the file is still there.
        refreshDiff();
      }
      return;
    }
    if (!result.ok || result.body === null) {
      var message = (result.body && result.body.error) ?
        String(result.body.error) : "The server reported an unexpected problem.";
      if (message === fileErrorText) {
        return; // the same card is already on screen
      }
      fileErrorText = message;
      lastFileJson = null; // the card replaced the file: draw it again on recovery
      renderDiffPane();
      return;
    }
    var json = JSON.stringify(result.body);
    if (json === lastFileJson) {
      return;
    }
    lastFileJson = json;
    currentFile = result.body;
    fileErrorText = null;
    if (freshSelection) {
      renderDiffPane();
      document.getElementById("diff-pane").scrollTop = 0;
    } else {
      preserveScroll(document.getElementById("diff-pane"), renderDiffPane);
    }
    if (pendingLineJump !== null) {
      jumpToPendingLine(path); // a Check-tab finding asked for this line
    }
  }).catch(function (error) {
    if (serial === fileRequestSerial) {
      fileRequestPending = false;
    }
    setFooter(footerStateFor(error));
  });
}

/* ============================== Network view ============================== */

/* One commit, one picture: nodes are the files at that commit, and an arrow
   runs from the file that uses something to the file it depends on. The
   payload for a sha is fetched once; polling never fetches it again. */

// Geometry, in SVG user units. Nothing is measured from rendered text: the
// layout depends on the payload alone.
var NETWORK_NODE_W = 128;
var NETWORK_NODE_H = 34;
var NETWORK_COL_GAP = 28;
var NETWORK_ROW_GAP = 26;
var NETWORK_LAYER_GAP = 74;
var NETWORK_PADDING = 40;
var NETWORK_BAND_LABEL_H = 34; // room above the "not connected" band for its rule
var NETWORK_NODES_PER_ROW = 12;
var NETWORK_ORDER_SWEEPS = 8;
var NETWORK_LABEL_CHARS = 16;
var NETWORK_DIR_CHARS = 18;
var NETWORK_SYMBOLS_SHOWN = 8;
var NETWORK_MIN_ZOOM = 0.25;
var NETWORK_MAX_ZOOM = 2.5;
var NETWORK_READABLE_ZOOM = 1;     // file names at their CSS size, 11px
var NETWORK_DRAG_THRESHOLD = 4;
var NETWORK_DENSE_NODES = 150;
var NETWORK_HARD_NODES = 600;

// --accent comes last, so a small repository keeps it for "changed" and
// "selected".
var NETWORK_DIR_COLORS = ["var(--lane1)", "var(--lane2)", "var(--lane3)",
                          "var(--lane4)", "var(--lane5)", "var(--accent)"];

// The legend shows this sentence verbatim.
var NETWORK_ARROW_SENTENCE = "An arrow points from a file to what it depends on";
// For an unread file, what it uses is unknown; what uses it is known from the
// files that were read.
var NETWORK_UNREAD_SENTENCE = "BranchLens did not read this file, so what it uses is unknown. What uses it is still known, from the files that were read.";
var NETWORK_NO_LINKS_SENTENCE = "BranchLens read this file and found no links to or from other files in the repository.";
// Links found and then cut by the size limit, which differs from having none.
var NETWORK_LINKS_DROPPED_SENTENCE = "BranchLens found links for this file and then dropped them to stay under the size limit, so what it uses, and what uses it, is only partly drawn.";

var NETWORK_LANGUAGE_WORDS = {
  python: "Python",
  javascript: "JavaScript",
  typescript: "TypeScript",
  java: "Java",
  unsupported: "not a language BranchLens reads"
};

var currentNetwork = null;         // last /api/network payload
var currentNetworkSha = null;      // the commit currentNetwork describes
var networkRequestSha = null;      // the commit a fetch is in flight for
var networkRequestSerial = 0;      // bumped per fetch: only the newest answer counts
var networkDrawnSha = null;        // the commit whose drawing is on screen
var networkDrawnLayout = null;     // the layout whose elements that drawing holds
var networkErrorText = null;       // server error sentence, shown verbatim
var networkLayout = null;
var networkSvgElement = null;
var networkViewportElement = null;
var networkOverlayElement = null;  // holds the highlighted copies
var networkSelectedPath = null;
var networkHighlighted = [];       // the drawn elements that have a copy there
var networkPositionOverrides = makePathMap(); // path -> {x, y}, set by dragging
var networkPan = { x: 0, y: 0, k: 1 };
var networkDragState = null;
var networkDragFramePending = false;
var networkStartViewPending = false; // drawn while hidden: place it once shown
var networkStartPan = null;          // networkPan as the start view left it
var networkCycleMode = false;     // the "cycles (n)" chip is holding the highlight
var networkSymbolsExpanded = makePathMap(); // edge key -> true once "+N more" was used
var networkSkippedExpanded = false;
var networkUnresolvedExpanded = false;

/* ---- Network: small helpers ---- */

// A map keyed by repository paths. It has no prototype, so a file named
// __proto__ is an ordinary key.
function makePathMap() {
  return Object.create(null);
}

function networkRound(value) {
  return Math.round(value * 100) / 100;
}

// Cuts the middle, so the extension stays: settings.py and settings.js remain
// distinct.
function truncateMiddle(text, maxChars) {
  if (text.length <= maxChars) {
    return text;
  }
  var head = Math.ceil((maxChars - 1) / 2);
  var tail = maxChars - 1 - head;
  return text.slice(0, head) + "…" + text.slice(text.length - tail);
}

function networkTopDirectory(path) {
  var slashIndex = path.indexOf("/");
  if (slashIndex < 0) {
    return "";
  }
  return path.slice(0, slashIndex);
}

function networkBaseName(path) {
  var slashIndex = path.lastIndexOf("/");
  if (slashIndex < 0) {
    return path;
  }
  return path.slice(slashIndex + 1);
}

// The last segment of the parent directory: "src/deep/nested/m.py" -> "nested".
function networkDirTail(path) {
  var slashIndex = path.lastIndexOf("/");
  if (slashIndex < 0) {
    return "";
  }
  var parent = path.slice(0, slashIndex);
  var parentSlash = parent.lastIndexOf("/");
  if (parentSlash < 0) {
    return parent;
  }
  return parent.slice(parentSlash + 1);
}

function networkLanguageWord(language) {
  if (typeof language !== "string" || language === "") {
    return "unknown kind of file";
  }
  if (hasOwnKey(NETWORK_LANGUAGE_WORDS, language)) {
    return NETWORK_LANGUAGE_WORDS[language];
  }
  return language;
}

function networkComparePaths(a, b) {
  if (a < b) {
    return -1;
  }
  if (a > b) {
    return 1;
  }
  return 0;
}

// Falls back only when the server left the field out; a real 0 is kept as 0.
function networkNumber(value, fallback) {
  if (typeof value === "number") {
    return value;
  }
  return fallback;
}

function networkShortSha(sha) {
  if (currentGraph !== null) {
    for (var i = 0; i < currentGraph.commits.length; i++) {
      if (currentGraph.commits[i].sha === sha) {
        return currentGraph.commits[i].short;
      }
    }
  }
  return sha.slice(0, 7);
}

/* ---- Network: which commit is shown ---- */

// The network is a snapshot at one commit. For a selected branch that is its
// tip commit, and the legend says uncommitted edits are not in it.
function networkCommitSha() {
  if (selectedCommitSha !== null) {
    return selectedCommitSha;
  }
  if (selectedBranchName === null || currentGraph === null) {
    return null;
  }
  for (var i = 0; i < currentGraph.commits.length; i++) {
    var commit = currentGraph.commits[i];
    for (var t = 0; t < commit.tips.length; t++) {
      if (commit.tips[t] === selectedBranchName) {
        return commit.sha;
      }
    }
  }
  return null;
}

function networkShowsBranchTip() {
  return selectedCommitSha === null && networkCommitSha() !== null;
}

/* ---- Network: loading ---- */

function resetNetworkState() {
  // a different commit: everything derived from the old one goes, dragged
  // positions included
  currentNetwork = null;
  currentNetworkSha = null;
  networkLayout = null;
  networkErrorText = null;
  networkSelectedPath = null;
  networkPositionOverrides = makePathMap();
  networkSymbolsExpanded = makePathMap();
  networkSkippedExpanded = false;
  networkUnresolvedExpanded = false;
  networkCycleMode = false;
  networkHighlighted = [];
  networkPan = { x: 0, y: 0, k: 1 };
  networkStartPan = null;
  networkDragState = null;
  cancelNetworkHover();
}

function loadNetwork(sha) {
  networkRequestSerial += 1;
  var serial = networkRequestSerial;
  networkRequestSha = sha;
  fetchJson("/api/network?commit=" + encodeURIComponent(sha), TIMEOUT_NETWORK_MS).then(function (result) {
    if (serial !== networkRequestSerial) {
      return; // a newer request was issued meanwhile: only that one renders
    }
    networkRequestSha = null;
    if (sha !== networkCommitSha()) {
      return; // stale answer: the reader moved on, the drawing stays theirs
    }
    if (!result.ok || result.body === null) {
      networkErrorText = (result.body && result.body.error) ?
        String(result.body.error) : "The server reported an unexpected problem.";
      currentNetwork = null;
      currentNetworkSha = sha;
      networkLayout = null;
      renderNetworkPane();
      return;
    }
    currentNetwork = result.body;
    currentNetworkSha = sha;
    networkErrorText = null;
    networkLayout = buildNetworkLayout(currentNetwork);
    renderNetworkPane();
  }).catch(function (error) {
    if (serial === networkRequestSerial) {
      networkRequestSha = null;
    }
    setFooter(footerStateFor(error));
  });
}

function renderNetworkPane() {
  var wanted = networkCommitSha();
  if (wanted !== currentNetworkSha) {
    resetNetworkState();
  }
  if (viewMode !== "network") {
    return; // nothing on screen depends on it
  }
  if (wanted !== null && currentNetwork === null && networkErrorText === null &&
      networkRequestSha !== wanted) {
    loadNetwork(wanted);
  }
  renderNetworkLegend();
  renderNetworkCanvas();
  preserveScroll(networkDetailElement, renderNetworkDetail);
}

/* ---- Network: layout step 1, the model ---- */

function makeNetworkLayoutNode(source) {
  return {
    path: source.path,
    language: source.language,
    analyzed: source.analyzed !== false,
    reason: source.reason || null,
    changed: source.changed_in_commit === true,
    usesCount: source.uses || 0,
    usedByCount: source.used_by || 0,
    linksDropped: source.links_dropped === true,
    lines: typeof source.lines === "number" ? source.lines : null,
    size: typeof source.size === "number" ? source.size : null,
    comp: -1,
    layer: 0,
    subRow: 0,
    bandIndex: 0,
    bandPosition: 0,
    cycle: false,
    disconnected: false,
    x: 0,
    y: 0,
    color: NETWORK_DIR_COLORS[0],
    label: "",
    dirLabel: "",
    element: null
  };
}

function networkAdjacency(payload, index) {
  var outgoing = makePathMap();
  var incoming = makePathMap();
  var i;
  for (i = 0; i < payload.nodes.length; i++) {
    outgoing[payload.nodes[i].path] = [];
    incoming[payload.nodes[i].path] = [];
  }
  var edges = [];
  var dropped = 0;
  for (i = 0; i < payload.edges.length; i++) {
    var source = payload.edges[i];
    if (!hasOwnKey(index, source.from) || !hasOwnKey(index, source.to)) {
      dropped = dropped + 1; // an endpoint the server did not list: never expected
      continue;
    }
    outgoing[source.from].push(source.to);
    incoming[source.to].push(source.from);
    edges.push({
      fromPath: source.from,
      toPath: source.to,
      symbols: source.symbols || [],
      symbolCount: typeof source.symbol_count === "number" ?
        source.symbol_count : (source.symbols || []).length,
      symbolsTruncated: source.symbols_truncated === true,
      symbolsUnreadable: typeof source.symbols_unreadable === "number" ?
        source.symbols_unreadable : 0,
      kind: source.kind || "import",
      kinds: source.kinds || [],
      star: source.star === true,
      dynamic: source.dynamic === true,
      conditional: source.conditional === true,
      typeOnly: source.type_only === true,
      count: source.count || 1,
      lines: source.lines || [],
      cycle: false,
      selfLoop: source.from === source.to,
      outIndex: 0,
      outCount: 1,
      inIndex: 0,
      inCount: 1,
      element: null
    });
  }
  for (i = 0; i < payload.nodes.length; i++) {
    outgoing[payload.nodes[i].path].sort();
    incoming[payload.nodes[i].path].sort();
  }
  return { outgoing: outgoing, incoming: incoming, edges: edges, dropped: dropped };
}

/* ---- Network: layout step 2, strongly connected components ---- */

// Iterative Tarjan with an explicit work stack, so a deep import chain cannot
// overflow the call stack. Components come out in reverse topological order
// of the condensation, which the layering step relies on.
function findStronglyConnected(paths, outgoing) {
  var index = makePathMap();
  var low = makePathMap();
  var onStack = makePathMap();
  var stack = [];
  var counter = 0;
  var compOf = makePathMap();
  var members = [];
  for (var i = 0; i < paths.length; i++) {
    var root = paths[i];
    if (hasOwnKey(index, root)) {
      continue;
    }
    index[root] = counter;
    low[root] = counter;
    counter = counter + 1;
    stack.push(root);
    onStack[root] = true;
    var frames = [{ node: root, edgeAt: 0 }];
    while (frames.length > 0) {
      var frame = frames[frames.length - 1];
      var children = outgoing[frame.node];
      if (frame.edgeAt < children.length) {
        var child = children[frame.edgeAt];
        frame.edgeAt = frame.edgeAt + 1;
        if (!hasOwnKey(index, child)) {
          index[child] = counter;
          low[child] = counter;
          counter = counter + 1;
          stack.push(child);
          onStack[child] = true;
          frames.push({ node: child, edgeAt: 0 });
        } else if (onStack[child] === true) {
          low[frame.node] = Math.min(low[frame.node], index[child]);
        }
      } else {
        var finished = frames.pop().node;
        if (frames.length > 0) {
          var parent = frames[frames.length - 1].node;
          low[parent] = Math.min(low[parent], low[finished]);
        }
        if (low[finished] === index[finished]) {
          var group = [];
          var popped = null;
          while (popped !== finished) {
            popped = stack.pop();
            onStack[popped] = false;
            group.push(popped);
          }
          group.sort();
          for (var m = 0; m < group.length; m++) {
            compOf[group[m]] = members.length;
          }
          members.push(group);
        }
      }
    }
  }
  return { compOf: compOf, members: members };
}

/* ---- Network: layout step 3, layers ---- */

// Longest path over the condensation, in Tarjan's emission order: every
// component a component reaches was emitted earlier, so one pass is enough.
// Layer 0 is drawn at the bottom: dependency arrows run down, and an arrow
// running up is a loop edge.
function assignNetworkLayers(members, compOf, edges) {
  var compEdges = [];   // component -> the components it depends on
  var compIncoming = []; // component -> the components that depend on it
  var c;
  for (c = 0; c < members.length; c++) {
    compEdges.push([]);
    compIncoming.push([]);
  }
  var seen = {};
  for (var i = 0; i < edges.length; i++) {
    var from = compOf[edges[i].fromPath];
    var to = compOf[edges[i].toPath];
    if (from === to) {
      continue;
    }
    var key = from + ">" + to;
    if (seen[key] === true) {
      continue;
    }
    seen[key] = true;
    compEdges[from].push(to);
    compIncoming[to].push(from);
  }
  var compLayer = [];
  for (c = 0; c < members.length; c++) {
    var layer = 0;
    for (var j = 0; j < compEdges[c].length; j++) {
      var below = compLayer[compEdges[c][j]] + 1;
      if (below > layer) {
        layer = below;
      }
    }
    compLayer.push(layer);
  }
  return { compLayer: compLayer, compEdges: compEdges, compIncoming: compIncoming };
}

/* ---- Network: layout step 4, ordering inside a layer ---- */

function medianOfNeighbours(values) {
  if (values.length === 0) {
    return null;
  }
  values.sort(function (a, b) {
    return a - b;
  });
  var middle = Math.floor(values.length / 2);
  if (values.length % 2 === 1) {
    return values[middle];
  }
  return (values[middle - 1] + values[middle]) / 2;
}

// Slots are normalised to 0..1 within their layer, so a median can mix
// neighbours from layers of different widths.
function refreshNetworkPositions(list, position) {
  for (var k = 0; k < list.length; k++) {
    position[list[k]] = (k + 0.5) / list.length;
  }
}

function networkNeighbourMedian(neighbours, position, fallback) {
  var values = [];
  for (var i = 0; i < neighbours.length; i++) {
    if (position[neighbours[i]] !== undefined) {
      values.push(position[neighbours[i]]);
    }
  }
  var median = medianOfNeighbours(values);
  if (median === null) {
    return fallback; // no neighbour on this side: keep the slot, never jump
  }
  return median;
}

// Orders components, not nodes, so a loop's members stay together. Eight
// fixed sweeps with no randomness.
function orderNetworkLayers(layerComponents, compEdges, compIncoming, smallestPath) {
  var position = {};
  var L;
  for (L = 0; L < layerComponents.length; L++) {
    refreshNetworkPositions(layerComponents[L], position);
  }
  for (var sweep = 0; sweep < NETWORK_ORDER_SWEEPS; sweep++) {
    var useDependents = (sweep % 2 === 0);
    for (var step = 0; step < layerComponents.length; step++) {
      if (useDependents) {
        L = layerComponents.length - 2 - step; // from just under the top, down
      } else {
        L = step + 1;
      }
      if (L < 0 || L >= layerComponents.length) {
        continue;
      }
      var list = layerComponents[L];
      var keys = {};
      for (var k = 0; k < list.length; k++) {
        var comp = list[k];
        var reference = useDependents ? compIncoming[comp] : compEdges[comp];
        keys[comp] = networkNeighbourMedian(reference, position, position[comp]);
      }
      list.sort(function (a, b) {
        if (keys[a] !== keys[b]) {
          return keys[a] - keys[b];
        }
        return networkComparePaths(smallestPath[a], smallestPath[b]);
      });
      refreshNetworkPositions(list, position);
    }
  }
}

/* ---- Network: layout step 5, coordinates ---- */

// A band wider than NETWORK_NODES_PER_ROW nodes wraps into sub-rows. Bands
// stack top-down with layer 0 last, so arrows between bands run down.
function placeNetworkNodes(layout) {
  var pitchX = NETWORK_NODE_W + NETWORK_COL_GAP;
  var pitchY = NETWORK_NODE_H + NETWORK_ROW_GAP;
  var b, i;
  var maxRowWidth = NETWORK_NODE_W;
  for (b = 0; b < layout.bands.length; b++) {
    var perRow = Math.min(layout.bands[b].nodes.length, NETWORK_NODES_PER_ROW);
    var rowWidth = perRow * pitchX - NETWORK_COL_GAP;
    if (rowWidth > maxRowWidth) {
      maxRowWidth = rowWidth;
    }
  }
  var yCursor = NETWORK_PADDING;
  for (b = 0; b < layout.bands.length; b++) {
    var band = layout.bands[b];
    if (band.label !== null) {
      band.ruleY = yCursor + NETWORK_BAND_LABEL_H / 2;
      yCursor = yCursor + NETWORK_BAND_LABEL_H;
    } else {
      band.ruleY = null;
    }
    band.top = yCursor;
    var subRows = Math.ceil(band.nodes.length / NETWORK_NODES_PER_ROW);
    for (i = 0; i < band.nodes.length; i++) {
      var node = band.nodes[i];
      var subRow = Math.floor(i / NETWORK_NODES_PER_ROW);
      var column = i % NETWORK_NODES_PER_ROW;
      var inThisRow = Math.min(NETWORK_NODES_PER_ROW,
        band.nodes.length - subRow * NETWORK_NODES_PER_ROW);
      var thisRowWidth = inThisRow * pitchX - NETWORK_COL_GAP;
      node.subRow = subRow;
      node.bandIndex = b;
      node.bandPosition = i;
      node.x = NETWORK_PADDING + (maxRowWidth - thisRowWidth) / 2 + column * pitchX;
      node.y = band.top + subRow * pitchY;
    }
    yCursor = yCursor + subRows * pitchY - NETWORK_ROW_GAP + NETWORK_LAYER_GAP;
  }
  layout.width = maxRowWidth + 2 * NETWORK_PADDING;
  layout.height = yCursor - NETWORK_LAYER_GAP + NETWORK_PADDING;

  // a node the reader dragged keeps the place they put it
  for (i = 0; i < layout.nodes.length; i++) {
    var moved = layout.nodes[i];
    if (hasOwnKey(networkPositionOverrides, moved.path)) {
      moved.x = networkPositionOverrides[moved.path].x;
      moved.y = networkPositionOverrides[moved.path].y;
    }
  }
  assignNetworkEdgeAnchors(layout);
}

// A hub's arrows fan across 60% of its width instead of collapsing into one
// point: outgoing anchors sit on the bottom edge, incoming ones on the top.
function assignNetworkEdgeAnchors(layout) {
  var path;
  var i;
  for (i = 0; i < layout.nodes.length; i++) {
    path = layout.nodes[i].path;
    sortNetworkAnchorList(layout, layout.outgoingEdges[path], "toPath");
    sortNetworkAnchorList(layout, layout.incomingEdges[path], "fromPath");
    var outList = layout.outgoingEdges[path];
    for (var a = 0; a < outList.length; a++) {
      layout.edges[outList[a]].outIndex = a;
      layout.edges[outList[a]].outCount = outList.length;
    }
    var inList = layout.incomingEdges[path];
    for (var c = 0; c < inList.length; c++) {
      layout.edges[inList[c]].inIndex = c;
      layout.edges[inList[c]].inCount = inList.length;
    }
  }
}

function sortNetworkAnchorList(layout, edgeIndexes, endKey) {
  edgeIndexes.sort(function (a, b) {
    var nodeA = layout.index[layout.edges[a][endKey]];
    var nodeB = layout.index[layout.edges[b][endKey]];
    if (nodeA.x !== nodeB.x) {
      return nodeA.x - nodeB.x;
    }
    return networkComparePaths(layout.edges[a][endKey], layout.edges[b][endKey]);
  });
}

/* ---- Network: layout, the whole build ---- */

function buildNetworkLayout(payload) {
  var i;
  var nodes = [];
  for (i = 0; i < payload.nodes.length; i++) {
    nodes.push(makeNetworkLayoutNode(payload.nodes[i]));
  }
  nodes.sort(function (a, b) {
    return networkComparePaths(a.path, b.path);
  });

  var index = makePathMap();
  var paths = [];
  for (i = 0; i < nodes.length; i++) {
    index[nodes[i].path] = nodes[i];
    paths.push(nodes[i].path);
  }
  var directories = networkDirectoryList(nodes);
  applyNetworkDirectoryColors(nodes, directories);

  var adjacency = networkAdjacency(payload, index);
  var components = findStronglyConnected(paths, adjacency.outgoing);
  var layers = assignNetworkLayers(components.members, components.compOf,
    adjacency.edges);

  var layout = {
    width: 0,
    height: 0,
    nodes: nodes,
    index: index,
    edges: adjacency.edges,
    outgoingEdges: makePathMap(),
    incomingEdges: makePathMap(),
    componentMembers: components.members,
    bands: [],
    layerCount: 0,
    cycleCount: 0,
    disconnectedCount: 0,
    linksDroppedCount: 0,
    unparsedCount: 0,
    droppedEdgeCount: adjacency.dropped,
    directories: directories
  };
  for (i = 0; i < nodes.length; i++) {
    layout.outgoingEdges[nodes[i].path] = [];
    layout.incomingEdges[nodes[i].path] = [];
    if (!nodes[i].analyzed) {
      layout.unparsedCount = layout.unparsedCount + 1;
    }
  }
  for (i = 0; i < adjacency.edges.length; i++) {
    var edge = adjacency.edges[i];
    layout.outgoingEdges[edge.fromPath].push(i);
    layout.incomingEdges[edge.toPath].push(i);
    edge.cycle = components.compOf[edge.fromPath] === components.compOf[edge.toPath];
  }

  // A component of two or more files is a loop; a single file is one only when
  // it imports itself.
  var componentIsCycle = [];
  for (i = 0; i < components.members.length; i++) {
    componentIsCycle.push(components.members[i].length > 1);
  }
  for (i = 0; i < adjacency.edges.length; i++) {
    if (adjacency.edges[i].selfLoop) {
      componentIsCycle[components.compOf[adjacency.edges[i].fromPath]] = true;
    }
  }
  for (i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    node.comp = components.compOf[node.path];
    node.layer = layers.compLayer[node.comp];
    node.cycle = componentIsCycle[node.comp];
    // A file whose arrows the size limit cut does not join the "not connected"
    // band.
    node.disconnected = layout.outgoingEdges[node.path].length === 0 &&
      layout.incomingEdges[node.path].length === 0 &&
      !node.linksDropped;
    if (node.disconnected) {
      layout.disconnectedCount = layout.disconnectedCount + 1;
    }
    if (node.linksDropped) {
      layout.linksDroppedCount = layout.linksDroppedCount + 1;
    }
  }
  for (i = 0; i < componentIsCycle.length; i++) {
    if (componentIsCycle[i]) {
      layout.cycleCount = layout.cycleCount + 1;
    }
  }

  buildNetworkBands(layout, components, layers);
  placeNetworkNodes(layout);
  return layout;
}

// Files with no links go into their own band below layer 0, which holds the
// files the others depend on.
function buildNetworkBands(layout, components, layers) {
  var i;
  var maxLayer = 0;
  for (i = 0; i < layers.compLayer.length; i++) {
    if (layers.compLayer[i] > maxLayer) {
      maxLayer = layers.compLayer[i];
    }
  }
  layout.layerCount = maxLayer + 1;

  var smallestPath = [];
  for (i = 0; i < components.members.length; i++) {
    smallestPath.push(components.members[i][0]);
  }

  var layerComponents = [];
  for (i = 0; i <= maxLayer; i++) {
    layerComponents.push([]);
  }
  for (i = 0; i < components.members.length; i++) {
    if (layout.index[components.members[i][0]].disconnected) {
      continue; // its own band, drawn below layer 0
    }
    layerComponents[layers.compLayer[i]].push(i);
  }
  // starting order: by the component's smallest member path, top-level
  // directory first, so files from one directory begin next to each other
  for (i = 0; i <= maxLayer; i++) {
    layerComponents[i].sort(function (a, b) {
      var dirOrder = networkComparePaths(networkTopDirectory(smallestPath[a]),
        networkTopDirectory(smallestPath[b]));
      if (dirOrder !== 0) {
        return dirOrder;
      }
      return networkComparePaths(smallestPath[a], smallestPath[b]);
    });
  }
  orderNetworkLayers(layerComponents, layers.compEdges, layers.compIncoming,
    smallestPath);

  for (var L = maxLayer; L >= 0; L = L - 1) {
    var bandNodes = [];
    for (i = 0; i < layerComponents[L].length; i++) {
      var group = components.members[layerComponents[L][i]];
      for (var m = 0; m < group.length; m++) {
        bandNodes.push(layout.index[group[m]]);
      }
    }
    if (bandNodes.length > 0) {
      layout.bands.push({ nodes: bandNodes, label: null, top: 0, ruleY: null });
    }
  }

  var loose = [];
  for (i = 0; i < layout.nodes.length; i++) {
    if (layout.nodes[i].disconnected) {
      loose.push(layout.nodes[i]);
    }
  }
  if (loose.length > 0) {
    layout.bands.push({
      nodes: loose,
      label: "NOT CONNECTED TO ANYTHING BRANCHLENS COULD READ · " +
        pluralize(loose.length, "FILE", "FILES"),
      top: 0,
      ruleY: null
    });
  }
}

/* ---- Network: directory colour ---- */

function networkDirectoryList(nodes) {
  var seen = makePathMap();
  var list = [];
  for (var i = 0; i < nodes.length; i++) {
    var dir = networkTopDirectory(nodes[i].path);
    if (seen[dir] !== true) {
      seen[dir] = true;
      list.push(dir);
    }
  }
  list.sort();
  return list;
}

function applyNetworkDirectoryColors(nodes, directories) {
  var colorOf = makePathMap();
  for (var d = 0; d < directories.length; d++) {
    colorOf[directories[d]] = NETWORK_DIR_COLORS[d % NETWORK_DIR_COLORS.length];
  }
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    var dir = networkTopDirectory(node.path);
    node.color = colorOf[dir];
    node.label = truncateMiddle(networkBaseName(node.path), NETWORK_LABEL_CHARS);
    if (!node.analyzed) {
      node.label = node.label + " ?"; // never confusable with "read, no links"
    } else if (node.linksDropped) {
      node.label = node.label + " +"; // links were found, then cut by the cap
    }
    node.dirLabel = truncateMiddle(networkDirTail(node.path), NETWORK_DIR_CHARS);
  }
}

function networkDirectoryColor(dir, directories) {
  for (var i = 0; i < directories.length; i++) {
    if (directories[i] === dir) {
      return NETWORK_DIR_COLORS[i % NETWORK_DIR_COLORS.length];
    }
  }
  return NETWORK_DIR_COLORS[0];
}

/* ---- Network: the SVG ---- */

function makeNetworkMarker(id) {
  var marker = makeSvgElement("marker");
  marker.setAttribute("id", id);
  marker.setAttribute("viewBox", "0 0 10 10");
  marker.setAttribute("refX", "10");
  marker.setAttribute("refY", "5");
  marker.setAttribute("markerWidth", "7");
  marker.setAttribute("markerHeight", "7");
  marker.setAttribute("orient", "auto");
  // userSpaceOnUse keeps the head one size: a highlighted 2px edge must not
  // grow a giant arrowhead
  marker.setAttribute("markerUnits", "userSpaceOnUse");
  var head = makeSvgElement("path");
  head.setAttribute("d", "M 0 0 L 10 5 L 0 10 Z");
  marker.appendChild(head);
  return marker;
}

function makeNetworkDefs() {
  var defs = makeSvgElement("defs");
  defs.appendChild(makeNetworkMarker("net-arrow"));
  defs.appendChild(makeNetworkMarker("net-arrow-hi"));
  defs.appendChild(makeNetworkMarker("net-arrow-cycle"));
  return defs;
}

function networkNodeTitle(node) {
  var parts = node.path + " · " + networkLanguageWord(node.language);
  if (node.changed) {
    parts = parts + " · changed in this commit";
  } else {
    parts = parts + " · this commit did not change it";
  }
  if (node.analyzed) {
    parts = parts + " · uses " + node.usesCount + " · used by " + node.usedByCount;
  } else {
    // used_by is known for an unread file too: it comes from the files read.
    parts = parts + " · not read: " + (node.reason || "reason not given") +
      " · what it uses is unknown · used by " + node.usedByCount;
  }
  if (node.linksDropped) {
    parts = parts + " · some of its links were not drawn (size limit)";
  }
  if (node.cycle) {
    parts = parts + " · in a loop";
  }
  return parts;
}

function networkSymbolsSentence(edge) {
  if (edge.symbols.length === 0) {
    if (edge.symbolsUnreadable > 0) {
      return pluralize(edge.symbolsUnreadable, "name", "names") +
        " crossing this arrow could not be read";
    }
    return "whole file imported, no named symbols";
  }
  var text = edge.symbols.join(", ");
  if (edge.symbolsUnreadable > 0) {
    text = text + ", and " +
      pluralize(edge.symbolsUnreadable, "more name", "more names") +
      " that could not be read";
  }
  if (edge.symbolsTruncated) {
    text = text + ", … (" + edge.symbolCount + " names in all)";
  }
  return text;
}

function networkEdgeTitle(edge) {
  return edge.fromPath + " → " + edge.toPath + ": " + networkSymbolsSentence(edge);
}

// Three geometries: an arrow between bands runs down, an arrow inside one row
// is a side arc, and a file that imports itself gets a loop on its right.
function networkEdgeGeometry(edge) {
  var from = networkLayout.index[edge.fromPath];
  var to = networkLayout.index[edge.toPath];
  var fromMidY = from.y + NETWORK_NODE_H / 2;
  var toMidY = to.y + NETWORK_NODE_H / 2;
  if (edge.selfLoop) {
    var right = from.x + NETWORK_NODE_W;
    return "M " + networkRound(right) + " " + networkRound(fromMidY - 8) +
      " C " + networkRound(right + 34) + " " + networkRound(fromMidY - 26) +
      ", " + networkRound(right + 34) + " " + networkRound(fromMidY + 26) +
      ", " + networkRound(right) + " " + networkRound(fromMidY + 8);
  }
  if (Math.abs(from.y - to.y) < 1) {
    // same row: one of a mutually-importing pair arcs above and the other
    // below, so the two can never be drawn on top of each other
    if (to.x >= from.x) {
      var rx1 = from.x + NETWORK_NODE_W;
      var rx2 = to.x;
      return "M " + networkRound(rx1) + " " + networkRound(fromMidY) +
        " Q " + networkRound((rx1 + rx2) / 2) + " " + networkRound(fromMidY - 26) +
        " " + networkRound(rx2) + " " + networkRound(toMidY);
    }
    var lx1 = from.x;
    var lx2 = to.x + NETWORK_NODE_W;
    return "M " + networkRound(lx1) + " " + networkRound(fromMidY) +
      " Q " + networkRound((lx1 + lx2) / 2) + " " + networkRound(fromMidY + 26) +
      " " + networkRound(lx2) + " " + networkRound(toMidY);
  }
  var ax = from.x + NETWORK_NODE_W *
    (0.2 + 0.6 * (edge.outIndex + 1) / (edge.outCount + 1));
  var bx = to.x + NETWORK_NODE_W *
    (0.2 + 0.6 * (edge.inIndex + 1) / (edge.inCount + 1));
  var y1 = from.y + NETWORK_NODE_H;
  var y2 = to.y;
  if (to.y < from.y) {
    // running back up: only ever a loop edge, and it is amber and dashed
    y1 = from.y;
    y2 = to.y + NETWORK_NODE_H;
  }
  var dy = y2 - y1;
  return "M " + networkRound(ax) + " " + networkRound(y1) +
    " C " + networkRound(ax) + " " + networkRound(y1 + dy * 0.45) +
    ", " + networkRound(bx) + " " + networkRound(y2 - dy * 0.45) +
    ", " + networkRound(bx) + " " + networkRound(y2);
}

function makeNetworkEdge(edge) {
  var pathElement = makeSvgElement("path");
  var className = "net-edge";
  if (edge.cycle) {
    className = className + " cycle";
  }
  if (edge.selfLoop) {
    className = className + " self";
  }
  pathElement.setAttribute("class", className);
  pathElement.setAttribute("d", networkEdgeGeometry(edge));
  pathElement.setAttribute("marker-end",
    edge.cycle ? "url(#net-arrow-cycle)" : "url(#net-arrow)");
  var title = makeSvgElement("title");
  title.textContent = networkEdgeTitle(edge);
  pathElement.appendChild(title);
  return pathElement;
}

function makeNetworkNodeRect(className, inset, radius) {
  var rect = makeSvgElement("rect");
  rect.setAttribute("class", className);
  rect.setAttribute("x", String(-inset));
  rect.setAttribute("y", String(-inset));
  rect.setAttribute("width", String(NETWORK_NODE_W + inset * 2));
  rect.setAttribute("height", String(NETWORK_NODE_H + inset * 2));
  rect.setAttribute("rx", String(radius));
  return rect;
}

function makeNetworkNode(node, showDirLine) {
  var group = makeSvgElement("g");
  var className = "net-node";
  if (node.changed) {
    className = className + " changed";
  }
  if (node.cycle) {
    className = className + " cycle";
  }
  if (!node.analyzed) {
    className = className + " unparsed";
  }
  group.setAttribute("class", className);
  group.setAttribute("transform",
    "translate(" + networkRound(node.x) + "," + networkRound(node.y) + ")");

  var title = makeSvgElement("title");
  title.textContent = networkNodeTitle(node);
  group.appendChild(title);

  group.appendChild(makeNetworkNodeRect("net-node-halo", 5, 9));
  var box = makeNetworkNodeRect("net-node-box", 0, 5);
  // a token string, never user text; var() only resolves in a style property
  box.style.stroke = node.color;
  group.appendChild(box);
  if (node.cycle) {
    group.appendChild(makeNetworkNodeRect("net-node-ring", 3, 8));
  }
  if (node.changed) {
    var dot = makeSvgElement("circle");
    dot.setAttribute("class", "net-changed-dot");
    dot.setAttribute("cx", String(NETWORK_NODE_W - 9));
    dot.setAttribute("cy", "9");
    dot.setAttribute("r", "3");
    group.appendChild(dot);
  }

  var withDir = showDirLine && node.dirLabel !== "";
  var label = makeSvgElement("text");
  label.setAttribute("class", "net-node-label mono");
  label.setAttribute("x", String(NETWORK_NODE_W / 2));
  label.setAttribute("y", withDir ? "15" : "21");
  label.setAttribute("text-anchor", "middle");
  label.textContent = node.label;
  group.appendChild(label);
  if (withDir) {
    var dirText = makeSvgElement("text");
    dirText.setAttribute("class", "net-node-dir");
    dirText.setAttribute("x", String(NETWORK_NODE_W / 2));
    dirText.setAttribute("y", "27");
    dirText.setAttribute("text-anchor", "middle");
    dirText.textContent = node.dirLabel;
    group.appendChild(dirText);
  }

  group.addEventListener("mouseenter", function () {
    setNetworkHover(node.path);
  });
  group.addEventListener("mouseleave", function () {
    clearNetworkHover();
  });
  group.addEventListener("pointerdown", function (event) {
    onNetworkNodePointerDown(event, node.path);
  });
  node.element = group;
  return group;
}

function makeNetworkBand(band, layout) {
  var group = makeSvgElement("g");
  var rule = makeSvgElement("line");
  rule.setAttribute("class", "net-band-rule");
  rule.setAttribute("x1", String(NETWORK_PADDING / 2));
  rule.setAttribute("y1", String(networkRound(band.ruleY)));
  rule.setAttribute("x2", String(networkRound(layout.width - NETWORK_PADDING / 2)));
  rule.setAttribute("y2", String(networkRound(band.ruleY)));
  group.appendChild(rule);
  var label = makeSvgElement("text");
  label.setAttribute("class", "net-band-label");
  label.setAttribute("x", String(NETWORK_PADDING / 2));
  label.setAttribute("y", String(networkRound(band.ruleY - 6)));
  label.textContent = band.label;
  group.appendChild(label);
  return group;
}

function networkGraphLabel() {
  var short = currentNetwork.commit ? currentNetwork.commit.short : "";
  return "Dependency network at " + short + ": " +
    pluralize(networkLayout.nodes.length, "file", "files") + ", " +
    pluralize(networkLayout.edges.length, "link", "links") + ", " +
    pluralize(networkLayout.cycleCount, "loop", "loops") + ", " +
    pluralize(networkLayout.unparsedCount, "file not read", "files not read");
}

function renderNetworkGraph() {
  cancelNetworkHover();
  var fragment = document.createDocumentFragment();
  var svg = makeSvgElement("svg");
  svg.setAttribute("id", "network-svg");
  // role="img" with a summary label; the data is in the detail panel
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", networkGraphLabel());
  svg.appendChild(makeNetworkDefs());

  var viewport = makeSvgElement("g");
  viewport.setAttribute("id", "network-viewport");
  var edgeGroup = makeSvgElement("g");
  edgeGroup.setAttribute("id", "network-edges");
  var bandGroup = makeSvgElement("g");
  bandGroup.setAttribute("id", "network-bands");
  var nodeGroup = makeSvgElement("g");
  nodeGroup.setAttribute("id", "network-nodes");
  var overlayGroup = makeSvgElement("g");
  overlayGroup.setAttribute("id", "network-overlay");

  var i;
  for (i = 0; i < networkLayout.edges.length; i++) {
    var edge = networkLayout.edges[i];
    edge.element = makeNetworkEdge(edge);
    edgeGroup.appendChild(edge.element);
  }
  for (i = 0; i < networkLayout.bands.length; i++) {
    if (networkLayout.bands[i].label !== null) {
      bandGroup.appendChild(makeNetworkBand(networkLayout.bands[i], networkLayout));
    }
  }
  // a dense graph drops the second label line; the directory stays in the
  // tooltip and the panel
  var showDirLine = networkLayout.nodes.length <= NETWORK_DENSE_NODES;
  for (i = 0; i < networkLayout.nodes.length; i++) {
    nodeGroup.appendChild(makeNetworkNode(networkLayout.nodes[i], showDirLine));
  }

  // edges first, then bands, then nodes: a node always occludes an arrow that
  // merely passes over it, and the dashed rule never covers a node
  viewport.appendChild(edgeGroup);
  viewport.appendChild(bandGroup);
  viewport.appendChild(nodeGroup);
  viewport.appendChild(overlayGroup); // highlighted copies, on top of everything
  svg.appendChild(viewport);
  fragment.appendChild(svg);

  networkSvgElement = svg;
  networkViewportElement = viewport;
  networkOverlayElement = overlayGroup;
  svg.addEventListener("pointerdown", onNetworkPointerDown);
  svg.addEventListener("pointermove", onNetworkPointerMove);
  svg.addEventListener("pointerup", onNetworkPointerUp);
  svg.addEventListener("pointercancel", onNetworkPointerUp);
  svg.addEventListener("wheel", onNetworkWheel, { passive: false });

  clearNode(networkCanvasElement);
  networkCanvasElement.appendChild(fragment);
  applyNetworkTransform();
  showNetworkStartView();
}

// True when the server stopped listing the commit's files early: its file
// counts are then lower bounds.
function networkListingStopped() {
  var truncation = currentNetwork !== null ? currentNetwork.truncation : null;
  return !!truncation && truncation.tree_listing_stopped === true;
}

// Files at the commit the server never looked at: past its listing cap, or
// with paths too long to read. Any of them may be source code.
function networkFilesNotLookedAt() {
  var excluded = currentNetwork !== null && currentNetwork.excluded ? currentNetwork.excluded : {};
  return networkNumber(excluded.unlisted, 0) + networkNumber(excluded.too_deep, 0);
}

// "3 more were", or "more than 3 more were" when the listing stopped early.
function networkNotLookedAtWords(singular, plural) {
  return (networkListingStopped() ? "more than " : "") +
    pluralize(networkFilesNotLookedAt(), singular, plural);
}

// Nothing to draw has two very different causes, and the card says which.
function networkEmptyGraphParts() {
  var counts = currentNetwork.counts || {};
  var atCommit = networkNumber(counts.files_at_commit, 0);
  if (networkFilesNotLookedAt() > 0 || networkListingStopped()) {
    return ["None of the files BranchLens looked at are in a language it can read " +
      "(Python, JavaScript, TypeScript, Java); " +
      networkNotLookedAtWords("more was", "more were") + " not looked at, so " +
      "source files may exist there. There is nothing to draw."];
  }
  if (atCommit === 0) {
    return ["There are no files at this commit."];
  }
  return ["None of the " + atCommit + " files at this commit are in a language " +
    "BranchLens can read (Python, JavaScript, TypeScript, Java). There is nothing to draw."];
}

function networkEmptyCard(parts) {
  clearNode(networkCanvasElement);
  networkSvgElement = null;
  networkViewportElement = null;
  networkOverlayElement = null;
  networkCanvasElement.appendChild(makeCard(parts));
}

function renderNetworkCanvas() {
  var wanted = networkCommitSha();
  if (networkErrorText !== null) {
    networkDrawnSha = null;
    networkDrawnLayout = null;
    networkEmptyCard([{ errorBlock: true, text: networkErrorText }]);
    return;
  }
  if (wanted === null) {
    networkDrawnSha = null;
    networkDrawnLayout = null;
    networkEmptyCard(["Pick a commit in the list on the left. The network shows " +
      "the repository's files and the links between them as they were at that " +
      "commit."]);
    return;
  }
  if (currentNetwork === null) {
    if (networkDrawnSha !== null) {
      return; // an older drawing is up: leave it while the new one loads
    }
    networkEmptyCard(["Reading the files at ", { text: networkShortSha(wanted) }, "…"]);
    return;
  }
  // The same commit can come back as a new layout (picked again while the old
  // drawing stayed up), whose nodes have no elements yet: that one is drawn.
  if (networkDrawnLayout === networkLayout) {
    return; // this layout is already on screen: never redraw
  }
  if (networkLayout.nodes.length === 0) {
    networkDrawnSha = null;
    networkDrawnLayout = null;
    networkEmptyCard(networkEmptyGraphParts());
    return;
  }
  renderNetworkGraph();
  networkDrawnSha = currentNetworkSha;
  networkDrawnLayout = networkLayout;
  if (networkSelectedPath !== null) {
    applyNetworkSelectionMarks();
  }
}

/* ---- Network: pan, zoom and fit ---- */

function applyNetworkTransform() {
  if (networkViewportElement === null) {
    return;
  }
  networkViewportElement.setAttribute("transform",
    "translate(" + networkRound(networkPan.x) + "," + networkRound(networkPan.y) +
    ") scale(" + networkRound(networkPan.k) + ")");
}

// Places the drawing at scale k: centred across, and centred down when it
// fits, else from its top band.
function placeNetworkAtScale(k) {
  var wrapWidth = networkCanvasElement.clientWidth;
  var wrapHeight = networkCanvasElement.clientHeight;
  var drawnHeight = networkLayout.height * k;
  networkPan.k = k;
  networkPan.x = (wrapWidth - networkLayout.width * k) / 2;
  networkPan.y = drawnHeight <= wrapHeight ? (wrapHeight - drawnHeight) / 2 : 0;
  applyNetworkTransform();
}

// The first view of a drawing, also used by Reset layout: scale 1, so file
// names are drawn at 11px.
function showNetworkStartView() {
  if (networkLayout === null || networkSvgElement === null) {
    return;
  }
  if (networkCanvasElement.clientWidth === 0 || networkCanvasElement.clientHeight === 0) {
    networkStartViewPending = true; // the pane is hidden: there is no size yet
    return;
  }
  networkStartViewPending = false;
  placeNetworkAtScale(NETWORK_READABLE_ZOOM);
  networkStartPan = { x: networkPan.x, y: networkPan.y, k: networkPan.k };
}

// True while the reader has not scrolled, dragged or zoomed since the start view.
function networkIsAtStartView() {
  return networkStartPan !== null && networkPan.x === networkStartPan.x &&
    networkPan.y === networkStartPan.y && networkPan.k === networkStartPan.k;
}

// The Fit button and the f key: the whole drawing, however small that makes it.
function fitNetworkToView() {
  if (networkLayout === null || networkSvgElement === null) {
    return;
  }
  var wrapWidth = networkCanvasElement.clientWidth;
  var wrapHeight = networkCanvasElement.clientHeight;
  if (wrapWidth === 0 || wrapHeight === 0) {
    return;
  }
  var k = Math.min(wrapWidth / networkLayout.width, wrapHeight / networkLayout.height);
  if (k > 1) {
    k = 1; // never zoom IN to fit: two nodes must not render as two billboards
  }
  if (k < NETWORK_MIN_ZOOM) {
    k = NETWORK_MIN_ZOOM;
  }
  placeNetworkAtScale(k);
}

function zoomNetworkBy(factor) {
  if (networkSvgElement === null) {
    return;
  }
  var wrapWidth = networkCanvasElement.clientWidth;
  var wrapHeight = networkCanvasElement.clientHeight;
  zoomNetworkAbout(factor, wrapWidth / 2, wrapHeight / 2);
}

function zoomNetworkAbout(factor, pointX, pointY) {
  var newK = networkPan.k * factor;
  if (newK > NETWORK_MAX_ZOOM) {
    newK = NETWORK_MAX_ZOOM;
  }
  if (newK < NETWORK_MIN_ZOOM) {
    newK = NETWORK_MIN_ZOOM;
  }
  networkPan.x = pointX - ((pointX - networkPan.x) / networkPan.k) * newK;
  networkPan.y = pointY - ((pointY - networkPan.y) / networkPan.k) * newK;
  networkPan.k = newK;
  applyNetworkTransform();
}

// Scrolling moves the drawing; with Ctrl or Cmd held it zooms about the
// pointer. A trackpad pinch arrives as a wheel event with ctrlKey set.
function onNetworkWheel(event) {
  if (!networkIsLive()) {
    return;
  }
  event.preventDefault();
  if (event.ctrlKey || event.metaKey) {
    var factor = Math.pow(1.0015, -event.deltaY);
    if (factor < 0.5) {
      factor = 0.5;
    }
    if (factor > 2) {
      factor = 2;
    }
    var rect = networkCanvasElement.getBoundingClientRect();
    zoomNetworkAbout(factor, event.clientX - rect.left, event.clientY - rect.top);
    return;
  }
  var wrapWidth = networkCanvasElement.clientWidth;
  var wrapHeight = networkCanvasElement.clientHeight;
  var step = 1; // deltaMode 0: the deltas are pixels
  if (event.deltaMode === 1) {
    step = 16; // lines
  } else if (event.deltaMode === 2) {
    step = wrapHeight; // pages
  }
  // part of the drawing always stays across the middle of the canvas
  var drawnWidth = networkLayout.width * networkPan.k;
  var drawnHeight = networkLayout.height * networkPan.k;
  networkPan.x = keepBetween(networkPan.x - event.deltaX * step,
    wrapWidth / 2 - drawnWidth, wrapWidth / 2);
  networkPan.y = keepBetween(networkPan.y - event.deltaY * step,
    wrapHeight / 2 - drawnHeight, wrapHeight / 2);
  applyNetworkTransform();
}

function keepBetween(value, low, high) {
  if (value < low) {
    return low;
  }
  if (value > high) {
    return high;
  }
  return value;
}

function networkNodeIsVisible(node) {
  var wrapWidth = networkCanvasElement.clientWidth;
  var wrapHeight = networkCanvasElement.clientHeight;
  var screenX = node.x * networkPan.k + networkPan.x;
  var screenY = node.y * networkPan.k + networkPan.y;
  return screenX >= 0 && screenY >= 0 &&
    screenX + NETWORK_NODE_W * networkPan.k <= wrapWidth &&
    screenY + NETWORK_NODE_H * networkPan.k <= wrapHeight;
}

function centreNetworkNode(path) {
  if (networkLayout === null || !hasOwnKey(networkLayout.index, path)) {
    return;
  }
  var node = networkLayout.index[path];
  var wrapWidth = networkCanvasElement.clientWidth;
  var wrapHeight = networkCanvasElement.clientHeight;
  if (wrapWidth === 0) {
    return;
  }
  networkPan.x = wrapWidth / 2 - (node.x + NETWORK_NODE_W / 2) * networkPan.k;
  networkPan.y = wrapHeight / 2 - (node.y + NETWORK_NODE_H / 2) * networkPan.k;
  applyNetworkTransform();
}

function resetNetworkLayout() {
  if (networkLayout === null) {
    return;
  }
  networkPositionOverrides = makePathMap();
  placeNetworkNodes(networkLayout);
  for (var i = 0; i < networkLayout.nodes.length; i++) {
    var node = networkLayout.nodes[i];
    setNetworkShape(node.element, "transform",
      "translate(" + networkRound(node.x) + "," + networkRound(node.y) + ")");
  }
  for (var e = 0; e < networkLayout.edges.length; e++) {
    setNetworkShape(networkLayout.edges[e].element, "d",
      networkEdgeGeometry(networkLayout.edges[e]));
  }
  showNetworkStartView();
}

/* ---- Network: highlight, hover and selection ---- */

function networkIsLive() {
  return networkLayout !== null && networkDrawnLayout === networkLayout;
}

// Sets where a drawn node or edge is, on the element and on its highlighted
// copy, so a dragged highlight moves with it.
function setNetworkShape(element, attributeName, value) {
  element.setAttribute(attributeName, value);
  if (element.networkCopy) {
    element.networkCopy.setAttribute(attributeName, value);
  }
}

// Draws a copy of a node or an edge in the overlay, above the faded layers.
// The original stays underneath and keeps receiving the pointer.
function addNetworkHighlight(element, isEdge, isCycle) {
  if (element.networkCopy) {
    return; // a node reached by two edges is copied once
  }
  var copy = element.cloneNode(true);
  copy.classList.add("hi");
  if (isEdge && !isCycle) {
    // a marker never inherits the path's stroke, so the head is swapped too
    copy.setAttribute("marker-end", "url(#net-arrow-hi)");
  }
  if (isEdge) {
    networkOverlayElement.insertBefore(copy, networkOverlayElement.firstChild); // under the nodes
  } else {
    networkOverlayElement.appendChild(copy);
  }
  element.networkCopy = copy;
  networkHighlighted.push(element);
}

function clearNetworkHighlight() {
  for (var i = 0; i < networkHighlighted.length; i++) {
    networkHighlighted[i].networkCopy = null;
  }
  networkHighlighted = [];
  if (networkOverlayElement !== null) {
    clearNode(networkOverlayElement);
  }
  if (networkSvgElement !== null) {
    networkSvgElement.classList.remove("dim-mode");
  }
}

// O(degree): nothing here ever walks every element on the canvas.
function highlightNetworkNeighbourhood(path) {
  clearNetworkHighlight();
  if (!networkIsLive() || !hasOwnKey(networkLayout.index, path)) {
    return;
  }
  networkSvgElement.classList.add("dim-mode");
  addNetworkHighlight(networkLayout.index[path].element, false, false);
  var lists = [networkLayout.outgoingEdges[path], networkLayout.incomingEdges[path]];
  for (var l = 0; l < lists.length; l++) {
    for (var i = 0; i < lists[l].length; i++) {
      var edge = networkLayout.edges[lists[l][i]];
      addNetworkHighlight(edge.element, true, edge.cycle);
      var other = (l === 0) ? edge.toPath : edge.fromPath;
      if (other !== path) {
        addNetworkHighlight(networkLayout.index[other].element, false, false);
      }
    }
  }
}

function highlightNetworkCycles() {
  cancelNetworkHover();
  clearNetworkHighlight();
  if (!networkIsLive()) {
    return;
  }
  networkCycleMode = true;
  networkSvgElement.classList.add("dim-mode");
  var i;
  for (i = 0; i < networkLayout.nodes.length; i++) {
    if (networkLayout.nodes[i].cycle) {
      addNetworkHighlight(networkLayout.nodes[i].element, false, false);
    }
  }
  for (i = 0; i < networkLayout.edges.length; i++) {
    if (networkLayout.edges[i].cycle) {
      addNetworkHighlight(networkLayout.edges[i].element, true, true);
    }
  }
}

// Hover, and taking it away, wait this long: a pointer crossing several
// boxes and the gaps between them restyles the drawing once.
var NETWORK_HOVER_DELAY_MS = 80;
var networkHoverTimer = null;

function cancelNetworkHover() {
  if (networkHoverTimer !== null) {
    window.clearTimeout(networkHoverTimer);
    networkHoverTimer = null;
  }
}

// path null takes the hover highlight away.
function scheduleNetworkHover(path) {
  cancelNetworkHover();
  networkHoverTimer = window.setTimeout(function () {
    networkHoverTimer = null;
    if (networkSelectedPath !== null || networkCycleMode || networkDragState !== null) {
      return; // selection owns the highlight while it lasts
    }
    if (path === null) {
      clearNetworkHighlight();
    } else {
      highlightNetworkNeighbourhood(path);
    }
  }, NETWORK_HOVER_DELAY_MS);
}

function setNetworkHover(path) {
  scheduleNetworkHover(path);
}

function clearNetworkHover() {
  scheduleNetworkHover(null);
}

function applyNetworkSelectionMarks() {
  for (var i = 0; i < networkLayout.nodes.length; i++) {
    var node = networkLayout.nodes[i];
    node.element.classList.toggle("selected", node.path === networkSelectedPath);
  }
  if (networkSelectedPath !== null) {
    highlightNetworkNeighbourhood(networkSelectedPath);
  }
}

function selectNetworkNode(path) {
  if (!networkIsLive() || !hasOwnKey(networkLayout.index, path)) {
    return;
  }
  cancelNetworkHover();
  networkCycleMode = false;
  networkSelectedPath = path;
  applyNetworkSelectionMarks();
  renderNetworkDetail();
  networkDetailElement.scrollTop = 0;
  var usedBy = "used by " + networkLayout.incomingEdges[path].length;
  announce("Selected " + path + ": " + (networkLayout.index[path].analyzed ?
    "uses " + networkLayout.outgoingEdges[path].length + ", " + usedBy :
    "not read, " + usedBy));
}

// After a panel button rebuilt the panel, the focus goes to its first line.
function focusNetworkDetailHead() {
  var head = networkDetailElement.querySelector(".net-detail-head");
  if (head !== null) {
    head.focus({ preventScroll: true });
  }
}

function clearNetworkSelection() {
  // the loops chip highlights with NO node selected, so the highlight has to
  // go before the early return or it would survive a click on the background
  networkCycleMode = false;
  clearNetworkHighlight();
  if (networkSelectedPath === null) {
    return;
  }
  networkSelectedPath = null;
  if (networkIsLive()) {
    applyNetworkSelectionMarks();
  }
  renderNetworkDetail();
}

/* ---- Network: pointer, drag and pan ---- */

function onNetworkNodePointerDown(event, path) {
  if (!networkIsLive() || event.button !== 0) {
    return;
  }
  cancelNetworkHover();
  event.preventDefault();
  networkCanvasElement.focus(); // preventDefault would otherwise skip the focus
  var node = networkLayout.index[path];
  networkDragState = {
    kind: "node",
    path: path,
    pointerId: event.pointerId,
    startX: event.clientX,
    startY: event.clientY,
    originX: node.x,
    originY: node.y,
    dx: 0,
    dy: 0,
    moved: false
  };
  node.element.setPointerCapture(event.pointerId);
}

function onNetworkPointerDown(event) {
  if (networkDragState !== null || event.button !== 0 || !networkIsLive()) {
    return; // a node under the pointer already claimed this press
  }
  cancelNetworkHover();
  networkCanvasElement.focus();
  networkDragState = {
    kind: "pan",
    path: null,
    pointerId: event.pointerId,
    startX: event.clientX,
    startY: event.clientY,
    originX: networkPan.x,
    originY: networkPan.y,
    dx: 0,
    dy: 0,
    moved: false
  };
  networkSvgElement.setPointerCapture(event.pointerId);
  networkSvgElement.classList.add("panning");
}

function onNetworkPointerMove(event) {
  if (networkDragState === null || event.pointerId !== networkDragState.pointerId) {
    return;
  }
  var dx = event.clientX - networkDragState.startX;
  var dy = event.clientY - networkDragState.startY;
  if (!networkDragState.moved) {
    if (Math.abs(dx) < NETWORK_DRAG_THRESHOLD &&
        Math.abs(dy) < NETWORK_DRAG_THRESHOLD) {
      return; // still a click, not a drag
    }
    networkDragState.moved = true;
  }
  networkDragState.dx = dx;
  networkDragState.dy = dy;
  if (networkDragFramePending) {
    return; // one pending frame, never a queue
  }
  networkDragFramePending = true;
  window.requestAnimationFrame(applyNetworkDragFrame);
}

// Dragging moves one node; the layout is not recomputed.
function applyNetworkDragFrame() {
  networkDragFramePending = false;
  if (networkDragState === null) {
    return;
  }
  if (networkDragState.kind === "pan") {
    networkPan.x = networkDragState.originX + networkDragState.dx;
    networkPan.y = networkDragState.originY + networkDragState.dy;
    applyNetworkTransform();
    return;
  }
  if (!networkIsLive()) {
    return;
  }
  var node = networkLayout.index[networkDragState.path];
  node.x = networkDragState.originX + networkDragState.dx / networkPan.k;
  node.y = networkDragState.originY + networkDragState.dy / networkPan.k;
  networkPositionOverrides[node.path] = { x: node.x, y: node.y };
  setNetworkShape(node.element, "transform",
    "translate(" + networkRound(node.x) + "," + networkRound(node.y) + ")");
  updateNetworkEdgePaths(node.path);
}

function updateNetworkEdgePaths(path) {
  var lists = [networkLayout.outgoingEdges[path], networkLayout.incomingEdges[path]];
  for (var l = 0; l < lists.length; l++) {
    for (var i = 0; i < lists[l].length; i++) {
      var edge = networkLayout.edges[lists[l][i]];
      setNetworkShape(edge.element, "d", networkEdgeGeometry(edge));
    }
  }
}

function onNetworkPointerUp(event) {
  if (networkDragState === null || event.pointerId !== networkDragState.pointerId) {
    return;
  }
  var state = networkDragState;
  networkDragState = null;
  if (networkSvgElement !== null) {
    networkSvgElement.classList.remove("panning");
  }
  if (state.kind === "pan") {
    if (!state.moved) {
      clearNetworkSelection();
    }
    return;
  }
  if (!state.moved) {
    selectNetworkNode(state.path);
  }
}

/* ---- Network: keyboard ---- */

function nearestNetworkNodeInBand(bandIndex, fromNode) {
  if (bandIndex < 0 || bandIndex >= networkLayout.bands.length) {
    return null;
  }
  var candidates = networkLayout.bands[bandIndex].nodes;
  var best = null;
  var bestDistance = -1;
  for (var i = 0; i < candidates.length; i++) {
    var distance = Math.abs(candidates[i].x - fromNode.x);
    if (best === null || distance < bestDistance) {
      best = candidates[i];
      bestDistance = distance;
    }
  }
  return best;
}

function moveNetworkSelection(direction) {
  if (!networkIsLive() || networkLayout.nodes.length === 0) {
    return;
  }
  if (networkSelectedPath === null) {
    selectNetworkNode(networkLayout.bands[0].nodes[0].path);
    centreNetworkNode(networkSelectedPath);
    return;
  }
  var node = networkLayout.index[networkSelectedPath];
  var band = networkLayout.bands[node.bandIndex];
  var target = null;
  if (direction === "left" && node.bandPosition > 0) {
    target = band.nodes[node.bandPosition - 1];
  } else if (direction === "right" && node.bandPosition < band.nodes.length - 1) {
    target = band.nodes[node.bandPosition + 1];
  } else if (direction === "down") {
    var out = networkLayout.outgoingEdges[networkSelectedPath];
    if (out.length > 0) {
      target = networkLayout.index[networkLayout.edges[out[0]].toPath];
    } else {
      target = nearestNetworkNodeInBand(node.bandIndex + 1, node);
    }
  } else if (direction === "up") {
    var incoming = networkLayout.incomingEdges[networkSelectedPath];
    if (incoming.length > 0) {
      target = networkLayout.index[networkLayout.edges[incoming[0]].fromPath];
    } else {
      target = nearestNetworkNodeInBand(node.bandIndex - 1, node);
    }
  }
  if (target === null) {
    return;
  }
  selectNetworkNode(target.path);
  if (!networkNodeIsVisible(target)) {
    centreNetworkNode(target.path);
  }
}

function onNetworkKeydown(event) {
  if (event.ctrlKey || event.metaKey || event.altKey) {
    return; // find, page zoom and back stay the browser's
  }
  var key = event.key;
  if (key === "ArrowLeft" || key === "ArrowRight" ||
      key === "ArrowUp" || key === "ArrowDown") {
    event.preventDefault();
    if (key === "ArrowLeft") {
      moveNetworkSelection("left");
    } else if (key === "ArrowRight") {
      moveNetworkSelection("right");
    } else if (key === "ArrowUp") {
      moveNetworkSelection("up");
    } else {
      moveNetworkSelection("down");
    }
    return;
  }
  if (key === "Enter") {
    event.preventDefault();
    if (networkSelectedPath !== null) {
      openNetworkFile(networkSelectedPath);
    }
    return;
  }
  if (key === "Escape") {
    event.preventDefault();
    clearNetworkSelection();
    clearNetworkHighlight();
    return;
  }
  if (key === "f" || key === "F") {
    event.preventDefault();
    fitNetworkToView();
    return;
  }
  if (key === "+" || key === "=") {
    event.preventDefault();
    zoomNetworkBy(1.2);
    return;
  }
  if (key === "-" || key === "_") {
    event.preventDefault();
    zoomNetworkBy(1 / 1.2);
  }
}

// Only a file this commit changed has a diff to show. Always back to Tree:
// with a commit selected the Branches sidebar shows no selection at all.
function openNetworkFile(path) {
  if (findShowableFileEntry(path) === null) {
    return;
  }
  selectFile(path);
  switchView("tree");
}

/* ---- Network: the legend strip ---- */

// spokenName, when given, names a button whose label is only a sign
function makeNetworkToolButton(label, handler, spokenName) {
  var button = makeText("button", "net-tool-button", label);
  button.type = "button";
  if (spokenName) {
    button.setAttribute("aria-label", spokenName);
    button.title = spokenName;
  }
  button.addEventListener("click", handler);
  return button;
}

function makeNetworkLegendKey(swatchClass, text, withDot) {
  var key = makeElement("div", "net-legend-key");
  key.appendChild(makeElement("span", "net-legend-swatch " + swatchClass));
  if (withDot) {
    key.appendChild(makeElement("span", "net-legend-dot"));
  }
  key.appendChild(document.createTextNode(text));
  return key;
}

function renderNetworkLegend() {
  clearNode(networkLegendElement);
  var top = makeElement("div", "net-legend-top");
  var text = makeElement("div", "net-legend-text");
  text.appendChild(makeText("span", "net-legend-strong", NETWORK_ARROW_SENTENCE));
  text.appendChild(makeText("span", "net-legend-rest",
    ": the tail is the file that uses, the head is the file being used. " +
    "Arrows run downward: a file sits above what it depends on. An arrow " +
    "running back up means these files depend on each other in a loop."));
  top.appendChild(text);

  var tools = makeElement("div", "net-tools");
  tools.appendChild(makeNetworkToolButton(MINUS, function () {
    zoomNetworkBy(1 / 1.2);
  }, "Zoom out"));
  tools.appendChild(makeNetworkToolButton("+", function () {
    zoomNetworkBy(1.2);
  }, "Zoom in"));
  tools.appendChild(makeNetworkToolButton("Fit", function () {
    fitNetworkToView();
  }));
  tools.appendChild(makeNetworkToolButton("Reset layout", function () {
    resetNetworkLayout();
  }));
  top.appendChild(tools);
  networkLegendElement.appendChild(top);

  var keys = makeElement("div", "net-legend-keys");
  keys.appendChild(makeNetworkLegendKey("changed",
    "Filled dot and bold name: this commit changed this file.", true));
  keys.appendChild(makeNetworkLegendKey("cycle",
    "Amber ring and dashed amber arrows: files in a loop.", false));
  keys.appendChild(makeNetworkLegendKey("unread",
    "Dashed outline and a question mark: BranchLens did not read this file.",
    false));
  if (networkLayout !== null && networkLayout.linksDroppedCount > 0) {
    // drawn with a solid outline: the file was read
    keys.appendChild(makeNetworkLegendKey("",
      "Solid outline and a plus after the name: this file was read and some " +
      "of its links were cut by the size limit.", false));
  }
  keys.appendChild(makeText("div", "net-legend-key",
    "Scroll or drag to move around; pinch or Ctrl + scroll to zoom."));
  // the drawing's description for screen readers (aria-describedby)
  var keyHelp = makeText("div", "net-legend-key",
    "Keyboard, once the drawing has focus: arrows pick a file, Enter opens its " +
    "diff when this commit changed it, Escape clears, f fits, + and - zoom.");
  keyHelp.id = "network-key-help";
  keys.appendChild(keyHelp);
  networkLegendElement.appendChild(keys);

  renderNetworkLegendCommitLine();
  renderNetworkLegendNotes();
}

function renderNetworkLegendCommitLine() {
  var wanted = networkCommitSha();
  if (wanted === null) {
    return;
  }
  var line = makeElement("div", "net-legend-commit");
  if (currentNetwork !== null && currentNetworkSha === wanted) {
    line.appendChild(makeText("span", "mono", currentNetwork.commit.short));
    line.appendChild(document.createTextNode(" · " + currentNetwork.commit.subject));
  } else {
    line.appendChild(document.createTextNode("Reading the files at "));
    line.appendChild(makeText("span", "mono", networkShortSha(wanted)));
    line.appendChild(document.createTextNode("…"));
  }
  networkLegendElement.appendChild(line);

  if (networkShowsBranchTip()) {
    var branchLine = makeElement("div", "net-legend-commit");
    branchLine.appendChild(document.createTextNode("Showing "));
    branchLine.appendChild(makeText("span", "mono", selectedBranchName));
    branchLine.appendChild(document.createTextNode(" at its last commit "));
    branchLine.appendChild(makeText("span", "mono", networkShortSha(wanted)));
    branchLine.appendChild(document.createTextNode(
      "; edits not yet committed are not in this network."));
    networkLegendElement.appendChild(branchLine);
  }
}

function renderNetworkLegendNotes() {
  if (currentNetwork === null || networkLayout === null) {
    return;
  }
  var truncation = currentNetwork.truncation || null;
  if (currentNetwork.truncated === true) {
    var note = makeElement("div", "net-note");
    if (truncation !== null) {
      var filesShown = networkLayout.nodes.length;
      var filesTotal = filesShown + networkNumber(truncation.nodes_hidden, 0);
      // links the server stopped gathering make the total a lower bound
      var linksAtLeast = networkNumber(truncation.links_not_gathered, 0) > 0 ? "at least " : "";
      note.textContent = "Capped: showing " + filesShown + " of " + filesTotal +
        " files and " +
        networkNumber(truncation.edges_shown, networkLayout.edges.length) +
        " of " + linksAtLeast +
        networkNumber(truncation.edges_total, networkLayout.edges.length) +
        " links, read from " + networkNumber(truncation.source_files_read, 0) +
        " of " + networkNumber(truncation.source_files_total, 0) +
        " source files. What is not drawn is not “nothing”: it is unknown.";
    } else {
      note.textContent = "Capped: showing " + networkLayout.nodes.length +
        " files and " + networkLayout.edges.length +
        " links; some files and links are not drawn.";
    }
    networkLegendElement.appendChild(note);
  }
  if (networkLayout.nodes.length > NETWORK_HARD_NODES) {
    // "Nothing was dropped" is true only when nothing was capped either.
    var hardCapText = networkLayout.nodes.length + " files; this is more " +
      "than this view can lay out legibly. ";
    if (currentNetwork.truncated === true) {
      hardCapText += "Every file counted above is drawn, but not all of them " +
        "were read; see the line above. Use Fit, then zoom into a corner.";
    } else {
      hardCapText += "Nothing was dropped; use Fit, then zoom into a corner.";
    }
    networkLegendElement.appendChild(makeText("div", "net-note", hardCapText));
  } else if (networkLayout.nodes.length > NETWORK_DENSE_NODES) {
    networkLegendElement.appendChild(makeText("div", "net-legend-commit",
      networkLayout.nodes.length + " files; use Fit, then zoom into a corner."));
  }
  if (networkLayout.nodes.length === 1) {
    networkLegendElement.appendChild(makeText("div", "net-legend-commit",
      "One file: nothing to connect it to."));
  } else if (networkLayout.edges.length === 0 && networkLayout.nodes.length > 1) {
    networkLegendElement.appendChild(makeText("div", "net-note",
      networkNoLinksSentence()));
  }
}

// Why a drawing of several files has no arrows.
function networkNoLinksSentence() {
  if (networkLayout.linksDroppedCount > 0) {
    return "No arrow is drawn here: the links BranchLens found were cut by the " +
      "size limit, not absent.";
  }
  if (networkLayout.unparsedCount === networkLayout.nodes.length) {
    return "None of these files were read, so no link between them is known.";
  }
  // An import the view could not follow (an alias, a namespace package)
  // draws no arrow, so "imports nothing" is said only when there is none.
  var unresolved = networkNumber((currentNetwork.counts || {}).unresolved_imports, 0);
  var unfollowed = "none of their imports could be followed to another file " +
    "here (see IMPORTS WITH NO ARROW in the panel)";
  if (networkLayout.unparsedCount === 0) {
    return "BranchLens found no links between these files. All of them were " +
      "read, and " + (unresolved > 0 ? unfollowed :
        "none imports anything from inside this repository") + ".";
  }
  return "BranchLens found no links between these files. " +
    networkLayout.unparsedCount + " of them were not read (see the panel); " +
    "the rest were read and " + (unresolved > 0 ? unfollowed :
      "import nothing from inside this repository") + ".";
}

/* ---- Network: the detail column ---- */

function makeNetworkChip(text, kind) {
  return makeText("span", "net-chip" + (kind ? " " + kind : ""), text);
}

function makeNetworkSection(labelText) {
  var section = makeElement("div", "net-detail-section");
  section.appendChild(makeText("div", "net-detail-label", labelText));
  return section;
}

function networkEdgeKey(edge) {
  return edge.fromPath + ">" + edge.toPath;
}

function makeNetworkSymbolChips(edge) {
  var holder = makeElement("div", "net-symbols");
  if (edge.symbols.length === 0) {
    // An import whose names the scanner could not read is not shown as naming
    // none.
    holder.appendChild(makeText("span", "net-symbol none",
      edge.symbolsUnreadable > 0 ?
        pluralize(edge.symbolsUnreadable, "name", "names") +
          " crossing this arrow could not be read" :
        "whole file imported: no named symbols"));
    return holder;
  }
  var key = networkEdgeKey(edge);
  var expanded = networkSymbolsExpanded[key] === true;
  var shown = expanded ? edge.symbols.length :
    Math.min(edge.symbols.length, NETWORK_SYMBOLS_SHOWN);
  for (var i = 0; i < shown; i++) {
    holder.appendChild(makeText("span", "net-symbol mono", edge.symbols[i]));
  }
  if (!expanded && edge.symbols.length > shown) {
    var more = makeText("button", "net-toggle",
      "+" + (edge.symbols.length - shown) + " more");
    more.type = "button";
    more.addEventListener("click", function (event) {
      event.stopPropagation();
      networkSymbolsExpanded[key] = true;
      preserveScroll(networkDetailElement, renderNetworkDetail);
      focusNetworkDetailHead();
    });
    holder.appendChild(more);
  }
  if (edge.symbolsUnreadable > 0) {
    holder.appendChild(makeText("span", "net-symbol none",
      pluralize(edge.symbolsUnreadable, "more name", "more names") +
      " crossing this arrow could not be read"));
  }
  if (edge.symbolsTruncated) {
    holder.appendChild(makeText("span", "net-symbol none",
      "the server capped this list at " + edge.symbols.length + " of " +
      edge.symbolCount + " names"));
  }
  return holder;
}

function makeNetworkNeighbourRow(edge, otherPath) {
  var row = makeElement("button", "net-neighbour-row");
  row.type = "button";
  row.appendChild(makePlainPath(otherPath, false));
  row.appendChild(makeNetworkSymbolChips(edge));
  var marks = [];
  if (edge.star) {
    marks.push("whole namespace");
  }
  if (edge.dynamic) {
    marks.push("built at runtime");
  }
  if (edge.conditional) {
    marks.push("only on some runs");
  }
  if (edge.typeOnly) {
    marks.push("types only");
  }
  if (marks.length > 0) {
    row.appendChild(makeText("div", "net-detail-note", marks.join(" · ")));
  }
  row.addEventListener("click", function () {
    selectNetworkNode(otherPath);
    centreNetworkNode(otherPath);
    focusNetworkDetailHead();
  });
  return row;
}

function renderNetworkDetail() {
  clearNode(networkDetailElement);
  if (currentNetwork === null || networkLayout === null) {
    return;
  }
  if (networkSelectedPath === null ||
      !hasOwnKey(networkLayout.index, networkSelectedPath)) {
    renderNetworkSummary();
    return;
  }
  var node = networkLayout.index[networkSelectedPath];

  var head = makeElement("div", "net-detail-head");
  head.tabIndex = -1; // focusNetworkDetailHead puts the focus here
  head.appendChild(makeText("div", "net-detail-path mono", node.path));
  var chips = makeElement("div", "net-detail-chips");
  chips.appendChild(makeNetworkChip(networkLanguageWord(node.language), ""));
  if (node.changed) {
    chips.appendChild(makeNetworkChip("changed in this commit", "changed"));
  }
  if (!node.analyzed) {
    chips.appendChild(makeNetworkChip("not read: " +
      (node.reason || "reason not given"), "unread"));
  }
  if (node.linksDropped) {
    chips.appendChild(makeNetworkChip("some links not drawn", "unread"));
  }
  if (node.cycle) {
    chips.appendChild(makeNetworkChip("in a loop", "cycle"));
  }
  head.appendChild(chips);
  networkDetailElement.appendChild(head);

  var actions = makeElement("div", "net-detail-actions");
  if (findShowableFileEntry(node.path) !== null) {
